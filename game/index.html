// Module 11: MultiplayerManager — PeerJS P2Pマルチプレイ
// ==========================================================
class MultiplayerManager {
  static peer = null;
  static connections = {};
  static roomId = null;
  static isHost = false;
  static playerId = null;
  static connected = false;

  static init() {
    MultiplayerManager.playerId = 'p' + Math.random().toString(36).substring(2, 8);
    MultiplayerManager.render();
  }

  static render() {
    const container = document.getElementById('multiplayer-content');
    container.innerHTML =
      '<div class="mp-panel"><h3>🌐 P2Pマルチプレイ (PeerJS)</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;">ルームIDを共有してクロスデバイスでプレイできます。サーバーレス直接通信（PeerJS）を使用します。</p>' +
      '<div style="margin-bottom:8px;"><label style="font-size:12px;color:var(--text-secondary);">ルームコード: </label>' +
      '<input type="text" class="mp-input" id="mp-room-id" placeholder="ルームコードを入力"></div>' +
      '<div style="margin-bottom:8px;"><label style="font-size:12px;color:var(--text-secondary);">パスワード: </label>' +
      '<input type="password" class="mp-input" id="mp-room-pass" placeholder="ルームパスワード (任意)"></div>' +
      '<button class="mp-btn" onclick="MultiplayerManager.hostRoom()">ルーム作成 (ホスト)</button>' +
      '<button class="mp-btn" onclick="MultiplayerManager.joinRoom()">ルームに参加</button>' +
      '<button class="mp-btn" onclick="MultiplayerManager.disconnect()" style="background:var(--accent-red);">切断</button>' +
      '<div class="mp-status" id="mp-status">未接続</div>' +
      '<div class="mp-player-list" id="mp-player-list"></div></div>' +
      '<div class="mp-panel"><h3>📡 同期情報</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);">ゲーム時間・速度・国家方針進行・特別研究進捗・カード発動・核攻撃が全プレイヤー間で同期されます。</p>' +
      '<div style="margin-top:8px;font-size:12px;"><div>プレイヤーID: <strong>' + MultiplayerManager.playerId + '</strong></div>' +
      '<div>接続状態: <strong id="mp-conn-state">未接続</strong></div></div></div>';
  }

  static hostRoom() {
    const roomIdInput = document.getElementById('mp-room-id');
    const roomId = roomIdInput.value.trim() || ('hoi4-' + Math.random().toString(36).substring(2, 8));
    const passInput = document.getElementById('mp-room-pass');
    MultiplayerManager.roomId = roomId;
    MultiplayerManager.roomHash = MultiplayerManager.hashPassword(passInput ? passInput.value : '');
    MultiplayerManager.isHost = true;
    MultiplayerManager.setStatus('ルーム作成中...', false);
    MultiplayerManager.peer = new Peer('hoi4game-' + roomId, { debug: 1 });

    MultiplayerManager.peer.on('open', (id) => {
      MultiplayerManager.connected = true;
      MultiplayerManager.setStatus('ホスト開始 (ID: ' + id + ')', true);
      document.getElementById('mp-indicator').textContent = '👥 ホスト';
      GameUI.notify('ルーム作成完了！ID: ' + roomId);
      MultiplayerManager.updatePlayerList();
    });

    MultiplayerManager.peer.on('connection', (conn) => {
      const peerId = conn.peer;
      MultiplayerManager.connections[peerId] = conn;
      conn.on('open', () => {
        conn.authOk = false;
        MultiplayerManager.setStatus('プレイヤー接続: パスワード認証中...', false);
        conn.send({ type: 'auth_req' });
      });
      conn.on('data', (data) => MultiplayerManager.onData(data, peerId));
      conn.on('close', () => {
        delete MultiplayerManager.connections[peerId];
        MultiplayerManager.setStatus('プレイヤー切断: ' + peerId, false);
        MultiplayerManager.updatePlayerList();
      });
    });

    MultiplayerManager.peer.on('error', (err) => {
      MultiplayerManager.setStatus('エラー: ' + err.type, false);
    });
  }

  static joinRoom() {
    const roomIdInput = document.getElementById('mp-room-id');
    const roomId = roomIdInput.value.trim();
    if (!roomId) { GameUI.notify('ルームコードを入力してください。', 'alert'); return; }
    const passInput = document.getElementById('mp-room-pass');
    MultiplayerManager.joinPassword = passInput ? passInput.value : '';
    MultiplayerManager.roomId = roomId;
    MultiplayerManager.isHost = false;
    MultiplayerManager.setStatus('接続中...', false);
    MultiplayerManager.peer = new Peer({ debug: 1 });

    MultiplayerManager.peer.on('open', (myId) => {
      const conn = MultiplayerManager.peer.connect('hoi4game-' + roomId, { reliable: true });
      MultiplayerManager.connections[conn.peer] = conn;
      conn.on('open', () => {
        MultiplayerManager.connected = true;
        MultiplayerManager.setStatus('接続完了 (ルーム: ' + roomId + ')', true);
        document.getElementById('mp-indicator').textContent = '👥 接続中';
        GameUI.notify('ルームに参加しました: ' + roomId);
        MultiplayerManager.updatePlayerList();
      });
      conn.on('data', (data) => MultiplayerManager.onData(data, conn.peer));
      conn.on('close', () => {
        delete MultiplayerManager.connections[conn.peer];
        MultiplayerManager.setStatus('ホストから切断されました', false);
        document.getElementById('mp-indicator').textContent = '👥 単独';
      });
    });

    MultiplayerManager.peer.on('error', (err) => {
      MultiplayerManager.setStatus('エラー: ' + err.type, false);
    });
  }

  static disconnect() {
    Object.values(MultiplayerManager.connections).forEach(conn => conn.close());
    MultiplayerManager.connections = {};
    if (MultiplayerManager.peer) { MultiplayerManager.peer.destroy(); MultiplayerManager.peer = null; }
    MultiplayerManager.connected = false;
    MultiplayerManager.setStatus('切断しました', false);
    document.getElementById('mp-indicator').textContent = '👥 単独';
    MultiplayerManager.updatePlayerList();
  }

  static setStatus(msg, isConnected) {
    const el = document.getElementById('mp-status');
    if (el) el.textContent = msg;
    const stateEl = document.getElementById('mp-conn-state');
    if (stateEl) stateEl.textContent = isConnected ? '接続中' : '未接続';
  }

  static updatePlayerList() {
    const el = document.getElementById('mp-player-list');
    if (!el) return;
    let html = '<div class="mp-player-item">' + MultiplayerManager.playerId + ' (自分' + (MultiplayerManager.isHost ? '・ホスト' : '') + ')</div>';
    Object.keys(MultiplayerManager.connections).forEach(peerId => {
      html += '<div class="mp-player-item">' + peerId + '</div>';
    });
    el.innerHTML = html;
  }

  static broadcast(data) {
    if (!MultiplayerManager.connected) return;
    Object.values(MultiplayerManager.connections).forEach(conn => {
      try { conn.send(data); } catch (e) {}
    });
  }

  static hashPassword(pw) {
    let h = 5381;
    const s = String(pw || '');
    for (let i = 0; i < s.length; i++) h = (((h << 5) + h) + s.charCodeAt(i)) >>> 0;
    return 'h' + h.toString(36);
  }

  static verifyPassword(pw) {
    return MultiplayerManager.hashPassword(pw) === MultiplayerManager.roomHash;
  }

  static onData(data, fromPeer) {
    if (!data || !data.type) return;
    const conn0 = MultiplayerManager.connections[fromPeer];
    // ホスト側: パスワード認証が済んでいない接続からは認証メッセージ以外を破棄
    if (conn0 && conn0.authOk === false && data.type !== 'auth_resp') return;
    switch (data.type) {
      case 'auth_req': {
        const c = MultiplayerManager.connections[fromPeer];
        if (c) c.send({ type: 'auth_resp', password: MultiplayerManager.joinPassword || '' });
        MultiplayerManager.setStatus('パスワード認証中...', false);
        break;
      }
      case 'auth_resp': {
        const conn = MultiplayerManager.connections[fromPeer];
        if (MultiplayerManager.verifyPassword(data.password)) {
          if (conn) conn.authOk = true;
          MultiplayerManager.setStatus('プレイヤー接続: ' + fromPeer, true);
          MultiplayerManager.updatePlayerList();
          if (conn) conn.send({ type: 'sync', state: CoreEngine.getSyncState(), date: CoreEngine.gameState.date.toISOString() });
          GameUI.notify('プレイヤーが参加しました: ' + fromPeer, 'success');
        } else {
          MultiplayerManager.setStatus('パスワード不一致のため接続を拒否: ' + fromPeer, false);
          GameUI.notify('接続拒否: ルームパスワードが違います', 'alert');
          if (conn) { try { conn.send({ type: 'auth_fail' }); } catch (e) {} setTimeout(() => { try { conn.close(); } catch (e) {} }, 400); }
        }
        break;
      }
      case 'auth_fail':
        MultiplayerManager.setStatus('パスワードが違います', false);
        GameUI.notify('ルームパスワードが違います', 'alert');
        MultiplayerManager.disconnect();
        break;
      case 'sync':
        if (data.state) CoreEngine.applySyncState(data.state);
        if (data.date) CoreEngine.gameState.date = new Date(data.date);
        CoreEngine.updateCalendar();
        CoreEngine.renderStats();
        break;
      case 'tick':
        if (data.state) CoreEngine.applySyncState(data.state);
        if (data.date) CoreEngine.gameState.date = new Date(data.date);
        CoreEngine.updateCalendar();
        break;
      case 'speed':
        CoreEngine.setSpeed(data.speed);
        break;
      case 'focus_select':
        FocusTreeManager.activeFocus = data.focusId;
        FocusTreeManager.render();
        break;
      case 'focus_complete':
        FocusTreeManager.completeFocus(data.focusId);
        break;
      case 'sp_hire':
        if (!SpecialProjectManager.projects[data.sciId]) {
          SpecialProjectManager.projects[data.sciId] = { phase: 'feasibility', progress: 0, factories: 0, completed: false };
          SpecialProjectManager.render();
        }
        break;
      case 'sp_phase':
        if (SpecialProjectManager.projects[data.sciId]) {
          SpecialProjectManager.projects[data.sciId].phase = data.phase;
          SpecialProjectManager.render();
        }
        break;
      case 'nuclear_strike':
        NuclearManager.onNuclearStrike(data);
        break;
      case 'card_activate':
        CoreEngine.log('他プレイヤーがカード「' + data.abilityName + '」を発動しました');
        GameUI.notify('他プレイヤー: ' + data.abilityName + '発動', 'alert');
        break;
      case 'card_hire': {
        if (!CardSystem.hiredCards.some(c => c.id === data.cardId)) {
          const cards = CardSystem.allCards[data.country] || [];
          const card = cards.find(c => c.id === data.cardId);
          if (card) {
            CardSystem.hiredCards.push({ id: card.id, country: card.country, name: card.name, rank: card.rank });
            CardSystem.saveHired();
            CardSystem.render();
            GameUI.notify('他プレイヤーが ' + card.name + ' を雇用しました', 'alert');
          }
        }
        break;
      }
      case 'faction_create':
        if (!DiplomacyManager.factions.find(f => f.name === data.faction.name)) {
          DiplomacyManager.factions.push(data.faction);
          DiplomacyManager.render();
        }
        break;
      case 'faction_join':
        var f = DiplomacyManager.factions.find(f => f.name === data.factionName);
        if (f && !f.members.includes(data.countryId)) f.members.push(data.countryId);
        DiplomacyManager.render();
        break;
      case 'lend_lease':
        DiplomacyManager.lendLeaseContracts.push({ from: 'remote', to: data.to, equipment: data.equipment, amount: data.amount });
        DiplomacyManager.render();
        break;
      case 'trade':
        CoreEngine.log('他プレイヤーが貿易を実行しました');
        break;
      case 'battle_front':
        var ba = BattlePlanManager.armies.find(a => a.id === data.army);
        if (ba) { ba.frontline = data.points; BattlePlanManager.renderPanel(); }
        break;
      case 'battle_arrow':
        var ba2 = BattlePlanManager.armies.find(a => a.id === data.army);
        if (ba2) { ba2.arrow = { from: data.from, to: data.to }; ba2.targetState = data.state; ba2.progress = 0; BattlePlanManager.renderPanel(); }
        break;
      case 'battle_execute':
        CoreEngine.log('他プレイヤーが攻撃作戦を開始しました');
        break;
      case 'battle_start':
        BattleManager.deserialize(data.battle);
        break;
      case 'battle_end':
        BattleManager.battles = BattleManager.battles.filter(b => b.id !== data.battleId);
        break;
      case 'force_zone':
        var zu = [...BattlePlanManager.navy, ...BattlePlanManager.air].find(u => u.id === data.id);
        if (zu) { zu.zone = data.zone; BattlePlanManager.renderPanel(); }
        break;
      case 'state_capture':
        if (MapRenderer.captureState(data.state, data.owner)) {
          CoreEngine.log('他プレイヤーが州 ' + (MapRenderer.states[data.state] ? MapRenderer.states[data.state].name : data.state) + 'を占領しました');
        }
        break;
      case 'construction_add':
        CoreEngine.log('他プレイヤーが建設を開始しました');
        break;
      case 'construction_done':
        var cdst = MapRenderer.states[data.state];
        if (cdst) {
          if (!cdst.b) cdst.b = {};
          cdst.b[data.building] = (cdst.b[data.building] || 0) + 1;
          MapRenderer.invalidateModes();
        }
        break;
    }
  }
}

// ==========================================================
// Module 12: CardSystem — 将軍カード・固有能力・インスタント資源カード
// ==========================================================
class CardSystem {
  static allCards = {};
  static deck = [];
  static selectedCard = null;
  static localStorageKey = 'hoi4_card_game_deck';
  static hiredCards = [];
  static hiredKey = 'hoi4_card_hired';
  // 雇用コスト (政治力): レアリティ別
  static HIRE_COST = { SSR: 150, SR: 90, R: 40, default: 40 };

  static ABILITIES = {
    'hitler': { type: 'passive', name: '国家の象徴', desc: '政治力獲得量+0.5、安定度+10%', modifiers: { politicalPowerGain: 0.5, stabilityBonus: 10 } },
    'stalin': { type: 'passive', name: '鉄の意志', desc: '安定度+15%、戦争協力度+10%', modifiers: { stabilityBonus: 15 } },
    'hermann': { type: 'passive', name: '特別研究の推進者', desc: '特別研究進行速度+30%、施設建設コスト-20%', modifiers: { specialProjectSpeed: 0.3, facilityCostReduction: 0.2 } },
    'rommel': { type: 'active', name: '電撃作戦', desc: '機甲速度+15%、突破+20%（アクティブ）', modifiers: { armorSpeed: 0.15, armorBreakthrough: 0.20 }, activeName: '電撃作戦' },
    'guderian': { type: 'active', name: '電撃戦', desc: '機甲速度+20%、突破+15%（アクティブ）', modifiers: { armorSpeed: 0.20, armorBreakthrough: 0.15 }, activeName: '電撃戦' },
    'mstein': { type: 'active', name: '奇襲作戦', desc: '計画ボーナス+25%（アクティブ）', modifiers: {}, activeName: '奇襲作戦' },
    'rundstedt': { type: 'passive', name: '老練の指揮', desc: '全師団防御+10%', modifiers: {} },
    'tukhachevsky': { type: 'active', name: '一歩も引くな', desc: '歩兵防御+25%（アクティブ）', modifiers: { infantryDefense: 0.25 }, activeName: '一歩も引くな' },
    'yamamoto': { type: 'active', name: 'Z作戦', desc: '海軍攻撃力+20%（アクティブ）', modifiers: {}, activeName: 'Z作戦' },
    'yamashita': { type: 'active', name: 'マレー電撃戦', desc: '機甲速度+15%（アクティブ）', modifiers: { armorSpeed: 0.15 }, activeName: 'マレー電撃戦' },
    'oil': { type: 'instant', name: '石油備蓄解放', desc: '燃料全回復＋石油+50', resource: 'oil', amount: 50, refuel: true },
    'rubber': { type: 'instant', name: '合成ゴム緊急生産', desc: 'ゴム+24', resource: 'rubber', amount: 24 },
    'steel': { type: 'instant', name: '戦時金属増産指示', desc: '鉄+30、タングステン+30', resource: 'steel', amount: 30, extraResource: 'tungsten', extraAmount: 30 },
    'tungsten': { type: 'instant', name: 'タングステン備蓄', desc: 'タングステン+30', resource: 'tungsten', amount: 30 },
    'chromium': { type: 'instant', name: 'クロム備蓄', desc: 'クロム+30', resource: 'chromium', amount: 30 },
    'aluminum': { type: 'instant', name: 'アルミニウム備蓄', desc: 'アルミニウム+30', resource: 'aluminum', amount: 30 },
    'coal': { type: 'instant', name: '石炭備蓄', desc: '石炭+30', resource: 'coal', amount: 30 }
  };

  static DEFAULT_GENERAL_ABILITY = { type: 'passive', name: '指揮能力', desc: '全師団攻撃力+5%', modifiers: {} };

  static async init() {
    CardSystem.allCards = await DataFetcher.fetchAllCards();
    CardSystem.loadDeck();
    CardSystem.loadHired();
    CardSystem.render();
    // リアルタイム同期: ガチャ画面 (card/index.html 別タブ) でカードが
    // 解放された瞬間に storage イベントで受け取り、即座に反映する。
    window.addEventListener('storage', (e) => {
      if (e.key && /_unlocked_cards$/.test(e.key)) {
        if (WindowManager.isOpen('cards')) CardSystem.render();
        const tag = e.key.replace('_unlocked_cards', '').toUpperCase();
        GameUI.notify('🎴 ガチャとリアルタイム同期: ' + DataFetcher.getCountryFlag(tag) + ' 新しいカードが雇用可能になりました！', 'success');
        CoreEngine.log('ガチャカードとリアルタイム同期しました (' + e.key + ')');
      }
    });
  }

  static loadDeck() {
    try {
      const saved = localStorage.getItem(CardSystem.localStorageKey);
      if (saved) CardSystem.deck = JSON.parse(saved);
    } catch (e) { CardSystem.deck = []; }
  }

  static saveDeck() {
    localStorage.setItem(CardSystem.localStorageKey, JSON.stringify(CardSystem.deck));
  }

  // --- カード雇用 (ガチャで引いたキャラを政治力消費で自陣営に配備) ---
  static loadHired() {
    try {
      const saved = localStorage.getItem(CardSystem.hiredKey);
      if (saved) CardSystem.hiredCards = JSON.parse(saved);
    } catch (e) { CardSystem.hiredCards = []; }
  }

  static saveHired() {
    localStorage.setItem(CardSystem.hiredKey, JSON.stringify(CardSystem.hiredCards));
  }

  static isHired(cardId) {
    return CardSystem.hiredCards.some(c => c.id === cardId);
  }

  static isUnlocked(cardId, country) {
    try {
      const key = (country || '').toLowerCase() + '_unlocked_cards';
      const list = JSON.parse(localStorage.getItem(key) || '[]');
      return list.includes(cardId);
    } catch (e) { return false; }
  }

  static hireCard(cardId, country) {
    const cards = CardSystem.allCards[country] || [];
    const card = cards.find(c => c.id === cardId);
    if (!card) return;
    // 国家制限: プレイヤー国と同じ国のカードのみ雇用できる (WORLDパックは無関係)
    if (country === 'WORLD' || country !== CoreEngine.gameState.country) {
      GameUI.notify('🚫 ' + DataFetcher.getCountryFlag(country) + ' ' + country + 'のカードは雇用できません。自国 (' + CoreEngine.gameState.country + ') のカードのみ雇用できます。', 'alert');
      return;
    }
    if (CardSystem.isHired(cardId)) { GameUI.notify('すでに雇用しています。', 'alert'); return; }
    if (!CardSystem.isUnlocked(cardId, country)) {
      GameUI.notify('🔒 ガチャで引き当てたカードのみ雇用できます。', 'alert');
      return;
    }
    const cost = CardSystem.HIRE_COST[card.rank] || CardSystem.HIRE_COST.default;
    if (CoreEngine.gameState.politicalPower < cost) {
      GameUI.notify('政治力が足りません (必要: ' + cost + ')。', 'alert');
      return;
    }
    CoreEngine.gameState.politicalPower -= cost;
    CardSystem.hiredCards.push({ id: card.id, country: card.country, name: card.name, rank: card.rank });
    CardSystem.saveHired();
    CardSystem.applyModifiers(cardId);
    CoreEngine.renderStats();
    CardSystem.selectedCard = card;
    CardSystem.render();
    GameUI.notify('🎖️ ' + card.name + ' を雇用・配備しました (政治力 -' + cost + ')', 'success');
    CoreEngine.log(card.name + ' を政治力 ' + cost + ' で雇用しました。');
    MultiplayerManager.broadcast({ type: 'card_hire', cardId: cardId, country: country });
  }

  static fireCard(cardId) {
    const idx = CardSystem.hiredCards.findIndex(c => c.id === cardId);
    if (idx < 0) return;
    const removed = CardSystem.hiredCards.splice(idx, 1)[0];
    CardSystem.saveHired();
    CardSystem.removeModifiers(cardId);
    CoreEngine.renderStats();
    CardSystem.render();
    GameUI.notify(removed.name + ' を解雇しました。', 'alert');
  }

  // SOV 大粛清などから呼ばれる: 雇用キャラを1人ランダムに失う
  static purgeRandomCharacter() {
    if (CardSystem.hiredCards.length === 0) return null;
    const victim = CardSystem.hiredCards[Math.floor(Math.random() * CardSystem.hiredCards.length)];
    CardSystem.hiredCards = CardSystem.hiredCards.filter(c => c.id !== victim.id);
    CardSystem.saveHired();
    CardSystem.removeModifiers(victim.id);
    if (CardSystem.selectedCard && CardSystem.selectedCard.id === victim.id) CardSystem.selectedCard = null;
    CardSystem.render();
    CoreEngine.renderStats();
    return victim.name;
  }

  static getAbility(card) {
    if (!card) return null;
    return CardSystem.ABILITIES[card.id] || CardSystem.DEFAULT_GENERAL_ABILITY;
  }

  static render() {
    const container = document.getElementById('cards-content');
    const myCountry = CoreEngine.gameState.country;
    const myPack = ['GER', 'SOV', 'JAP'].includes(myCountry) ? myCountry : null;
    const gachaLink = myPack ? 'card/' + myPack + '/index.html' : null;
    let html = '<div class="card-deck-area"><h3>🃏 将軍・指導者カードデッキ</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">カードをクリックしてデッキに編成します。編成したカードの固有能力がゲームに適用されます。' +
      ' ガチャで引き当てたカードは政治力を消費して「雇用・配備」できます。' +
      (gachaLink
        ? '<a href="' + gachaLink + '" target="_blank" style="color:var(--text-gold);margin-left:8px;">🎴 ' + DataFetcher.getCountryFlag(myPack) + ' ' + myPack + ' ガチャを開く (10連で11連目SSR確定)</a>'
        : '<span style="color:var(--text-secondary);margin-left:8px;">※ ' + DataFetcher.getCountryFlag(myCountry) + ' ' + myCountry + 'には専用カードパックがありません (GER/SOV/JAPのみ)</span>') +
      '<span style="display:block;font-size:11px;color:var(--text-secondary);margin-top:2px;">🔒 雇用できるのは自国のカードパックのみです (WORLDパックはこのゲームと無関係)</span></p>';

    html += '<div style="background:var(--bg-panel);border:1px solid var(--text-gold);border-radius:8px;padding:10px;margin-bottom:12px;">' +
      '<strong style="color:var(--text-gold);">デッキ (' + CardSystem.deck.length + '枚)</strong>';
    if (CardSystem.deck.length > 0) {
      html += '<div class="card-grid" style="margin-top:8px;">';
      CardSystem.deck.forEach(card => {
        const ability = CardSystem.getAbility(card);
        html += CardSystem.renderCardHTML(card, true, ability);
      });
      html += '</div>';
    } else {
      html += '<p style="font-size:12px;color:var(--text-secondary);margin-top:4px;">デッキが空です。下のカードから選択してください。</p>';
    }
    html += '</div>';

    // 雇用・配備済みロスター (ガチャで引いたキャラを政治力消費で配備)
    if (CardSystem.hiredCards.length > 0) {
      html += '<div style="background:var(--bg-panel);border:1px solid var(--accent-green);border-radius:8px;padding:10px;margin-bottom:12px;">' +
        '<strong style="color:var(--accent-green);">🎖️ 雇用・配備済み (' + CardSystem.hiredCards.length + '人)</strong>' +
        '<div style="margin-top:6px;">' +
        CardSystem.hiredCards.map(hc =>
          '<span class="mp-player-item" style="border-color:var(--accent-green);">' + DataFetcher.getCountryFlag(hc.country) + ' ' + hc.name +
          ' <span style="color:var(--accent-orange);">(' + hc.rank + ')</span> ' +
          '<button class="diplo-btn" style="background:var(--accent-red);" onclick="CardSystem.fireCard(\'' + hc.id + '\')">解雇</button></span>'
        ).join('') + '</div></div>';
    }

    Object.entries(CardSystem.allCards).forEach(entry => {
      const country = entry[0], cards = entry[1];
      // 国家制限: 自国のカードパックのみ表示 (WORLDパックは無関係)
      if (cards.length === 0 || country === 'WORLD' || country !== myCountry) return;
      html += '<div style="margin-bottom:16px;"><h4 style="color:var(--text-secondary);margin-bottom:6px;">' + DataFetcher.getCountryFlag(country) + ' ' + country + ' パック</h4><div class="card-grid">';
      cards.forEach(card => {
        const inDeck = CardSystem.deck.find(c => c.id === card.id && c.country === card.country);
        const ability = CardSystem.getAbility(card);
        html += CardSystem.renderCardHTML(card, !!inDeck, ability);
      });
      html += '</div></div>';
    });
    html += '</div>';

    if (CardSystem.selectedCard) {
      const card = CardSystem.selectedCard;
      const ability = CardSystem.getAbility(card);
      html += '<div class="card-ability-panel"><h4>' + card.name + ' — ' + ability.name + '</h4>' +
        '<p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">' + ability.desc + '</p>';
      if (ability.type === 'active' && ability.activeName) {
        const onCooldown = CoreEngine.gameState.activeAbilities[card.id];
        html += '<button class="ability-btn" onclick="CardSystem.activateAbility(\'' + card.id + '\')" ' + (onCooldown ? 'disabled' : '') + '>' +
          (onCooldown ? 'クールダウン中' : 'アクティブ発動: ' + ability.activeName) + '</button>';
      } else if (ability.type === 'instant') {
        html += '<button class="instant-card-btn" onclick="CardSystem.activateAbility(\'' + card.id + '\')">使用: ' + ability.name + '</button>';
      } else {
        html += '<p style="font-size:12px;color:var(--accent-green);">パッシブ能力（自動適用中）</p>';
      }
      // 雇用 (ガチャ排出カードを政治力消費で配備)
      if (CardSystem.allCards[card.country] && CardSystem.allCards[card.country].some(c => c.id === card.id)) {
        if (CardSystem.isHired(card.id)) {
          html += '<p style="font-size:12px;color:var(--accent-green);">✔ 雇用済み — 自陣営に配備中</p>';
        } else if (CardSystem.isUnlocked(card.id, card.country)) {
          const cost = CardSystem.HIRE_COST[card.rank] || CardSystem.HIRE_COST.default;
          html += '<button class="instant-card-btn" onclick="CardSystem.hireCard(\'' + card.id + '\',\'' + card.country + '\')">🎖️ 雇用・配備 (政治力 ' + cost + ')</button>';
        } else {
          html += '<p style="font-size:12px;color:var(--text-secondary);">🔒 ' + DataFetcher.getCountryFlag(card.country) + ' ガチャでこのカードを引き当てると雇用できます</p>';
        }
      }
      html += '</div>';
    }

    container.innerHTML = html;
  }

  static renderCardHTML(card, inDeck, ability) {
    const rankClass = 'gc-rank-' + (card.rank || 'R');
    const imgHtml = card.imgUrl
      ? '<img src="' + card.imgUrl + '" onerror="this.style.display=\'none\'" alt="' + card.name + '">'
      : '<div style="width:100%;height:120px;background:var(--bg-panel);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:40px;">' + DataFetcher.getCountryFlag(card.country) + '</div>';
    const abilityBadge = ability && ability.type === 'active' ? '⚡' : ability && ability.type === 'instant' ? '📦' : '🛡️';
    return '<div class="game-card ' + (inDeck ? 'selected' : '') + '" onclick="CardSystem.selectCard(\'' + card.id + '\',\'' + card.country + '\')">' +
      imgHtml + '<div class="gc-name">' + card.name + '</div>' +
      '<div class="gc-rank ' + rankClass + '">' + abilityBadge + ' ' + (card.rank || 'R') + '</div></div>';
  }

  static selectCard(cardId, country) {
    const cards = CardSystem.allCards[country] || [];
    const card = cards.find(c => c.id === cardId);
    if (!card) return;
    const deckIdx = CardSystem.deck.findIndex(c => c.id === cardId && c.country === country);
    if (deckIdx >= 0) {
      CardSystem.deck.splice(deckIdx, 1);
      CardSystem.removeModifiers(cardId);
    } else {
      if (CardSystem.deck.length >= 5) { GameUI.notify('デッキは最大5枚までです。', 'alert'); return; }
      CardSystem.deck.push({ ...card });
      CardSystem.applyModifiers(cardId);
    }
    CardSystem.saveDeck();
    CardSystem.selectedCard = card;
    CardSystem.render();
    MultiplayerManager.broadcast({ type: 'card_select', cardId: cardId, country: country });
  }

  static applyModifiers(cardId) {
    const ability = CardSystem.ABILITIES[cardId] || CardSystem.DEFAULT_GENERAL_ABILITY;
    if (!ability.modifiers) return;
    const mods = CoreEngine.gameState.cardModifiers;
    Object.entries(ability.modifiers).forEach(entry => {
      mods[entry[0]] = (mods[entry[0]] || 0) + entry[1];
    });
    if (ability.modifiers.stabilityBonus) {
      CoreEngine.gameState.stability = Math.min(100, CoreEngine.gameState.stability + ability.modifiers.stabilityBonus);
    }
    CoreEngine.renderStats();
  }

  static removeModifiers(cardId) {
    const ability = CardSystem.ABILITIES[cardId] || CardSystem.DEFAULT_GENERAL_ABILITY;
    if (!ability.modifiers) return;
    const mods = CoreEngine.gameState.cardModifiers;
    Object.entries(ability.modifiers).forEach(entry => {
      mods[entry[0]] = (mods[entry[0]] || 0) - entry[1];
    });
    if (ability.modifiers.stabilityBonus) {
      CoreEngine.gameState.stability = Math.max(0, CoreEngine.gameState.stability - ability.modifiers.stabilityBonus);
    }
    CoreEngine.renderStats();
  }

  static activateAbility(cardId) {
    const ability = CardSystem.ABILITIES[cardId];
    if (!ability) return;
    if (ability.type === 'instant') {
      const s = CoreEngine.gameState;
      if (ability.resource) s.resources[ability.resource] = (s.resources[ability.resource] || 0) + (ability.amount || 0);
      if (ability.extraResource) s.resources[ability.extraResource] = (s.resources[ability.extraResource] || 0) + (ability.extraAmount || 0);
      if (ability.refuel) s.fuel = s.maxFuel;
      CoreEngine.log('カード使用: ' + ability.name);
      GameUI.notify(ability.name + '発動！', 'success');
      CoreEngine.renderStats();
      if (GameUI.currentTab === 'trade') ResourceManager.render();
    } else if (ability.type === 'active') {
      const mods = CoreEngine.gameState.cardModifiers;
      Object.entries(ability.modifiers || {}).forEach(entry => {
        mods[entry[0]] = (mods[entry[0]] || 0) + entry[1];
      });
      CoreEngine.gameState.activeAbilities[cardId] = true;
      CoreEngine.log('アクティブ能力発動: ' + (ability.activeName || ability.name));
      GameUI.notify((ability.activeName || ability.name) + '発動！', 'success');
      CoreEngine.renderStats();
      if (GameUI.currentTab === 'division') DivisionDesigner.render();
      setTimeout(() => {
        Object.entries(ability.modifiers || {}).forEach(entry => {
          mods[entry[0]] = (mods[entry[0]] || 0) - entry[1];
        });
        delete CoreEngine.gameState.activeAbilities[cardId];
        CoreEngine.renderStats();
        if (GameUI.currentTab === 'cards') CardSystem.render();
        if (GameUI.currentTab === 'division') DivisionDesigner.render();
      }, 30000);
      MultiplayerManager.broadcast({ type: 'card_activate', cardId: cardId, abilityName: ability.name });
    }
  }
}

// ==========================================================
// Module 13: ResearchManager — 技術ツリー管理
// ==========================================================
class ResearchManager {
  static techData = {};
  static researchedTech = new Set();
  static researching = {};
  static currentCategory = 'infantry';

  static async init(country) {
    ResearchManager.techData = await DataFetcher.fetchAllTech(country);
    ResearchManager.renderTabs();
    ResearchManager.renderSlots();
    ResearchManager.render();
    CoreEngine.registerTickCallback(() => ResearchManager.onTick());
  }

  static renderTabs() {
    const cats = [
      { id: 'infantry', name: '🪖 歩兵' }, { id: 'armor', name: '🚜 装甲' },
      { id: 'artillery', name: '💥 砲兵' }, { id: 'naval', name: '⚓ 海軍' },
      { id: 'air', name: '✈️ 航空' }, { id: 'engineering', name: '🛠️ 工学' },
      { id: 'industry', name: '🏭 産業' }
    ];
    document.getElementById('research-tabs').innerHTML = cats.map(c =>
      '<button class="research-tab ' + (c.id === ResearchManager.currentCategory ? 'active' : '') + '" onclick="ResearchManager.setCategory(\'' + c.id + '\')">' + c.name + '</button>'
    ).join('');
  }

  static renderSlots() {
    const s = CoreEngine.gameState;
    let html = '';
    for (let i = 1; i <= 5; i++) {
      const locked = i > s.researchSlots;
      const research = ResearchManager.researching[i];
      let label = 'スロット' + i + ': ';
      if (locked) label += '🔒';
      else if (research) {
        const tech = ResearchManager.findTech(research.techId);
        label += tech ? tech.title + ' (' + Math.floor(research.progress/research.total*100) + '%)' : '研究中';
      } else label += '空き';
      html += '<div class="research-slot ' + (locked ? 'locked' : '') + ' ' + (research ? 'active' : '') + '">' + label + '</div>';
    }
    document.getElementById('research-slots').innerHTML = html;
  }

  static setCategory(cat) {
    ResearchManager.currentCategory = cat;
    ResearchManager.renderTabs();
    ResearchManager.render();
  }

  static findTech(techId) {
    for (const cat of Object.values(ResearchManager.techData)) {
      const t = cat.find(t => t.id === techId);
      if (t) return t;
    }
    return null;
  }

  static render() {
    const container = document.getElementById('research-nodes');
    const svg = document.getElementById('research-svg-lines');
    const techs = ResearchManager.techData[ResearchManager.currentCategory] || [];
    container.innerHTML = '';
    svg.innerHTML = '';

    if (techs.length === 0) {
      container.innerHTML = '<p style="color:var(--text-secondary);padding:20px;">技術データがありません。</p>';
      return;
    }

    let svgContent = '';
    techs.forEach(t => {
      if (t.prerequisites) {
        t.prerequisites.forEach(preId => {
          const pre = techs.find(t2 => t2.id === preId);
          if (pre) {
            const x1 = pre.x + 55, y1 = pre.y + 30;
            const x2 = t.x + 55, y2 = t.y + 30;
            const isDone = ResearchManager.researchedTech.has(preId);
            // 直角接続線 (曲線禁止): 垂直→水平→垂直 のみで結ぶ
            const midY = (y1 + y2) / 2;
            svgContent += '<path d="M' + x1 + ',' + y1 + ' L' + x1 + ',' + midY + ' L' + x2 + ',' + midY + ' L' + x2 + ',' + y2 + '" stroke="' + (isDone ? '#4ac46a' : '#3a4a5a') + '" stroke-width="2" fill="none" opacity="0.4"/>';
          }
        });
      }
    });
    svg.innerHTML = svgContent;
    svg.setAttribute('width', '800');
    svg.setAttribute('height', '1600');

    techs.forEach(t => {
      const isResearched = ResearchManager.researchedTech.has(t.id);
      const isResearching = Object.values(ResearchManager.researching).some(r => r.techId === t.id);
      let cls = 'tech-node';
      if (isResearched) cls += ' researched';
      else if (isResearching) cls += ' researching';
      const node = document.createElement('div');
      node.className = cls;
      node.style.left = t.x + 'px';
      node.style.top = t.y + 'px';
      node.innerHTML = '<div class="tn-svg">' + (t.svg || '') + '</div><div class="tn-title">' + t.title + '</div><div class="tn-year">' + (t.year || '') + '</div>';
      node.addEventListener('click', () => ResearchManager.selectTech(t));
      container.appendChild(node);
    });
  }

  static selectTech(tech) {
    if (ResearchManager.researchedTech.has(tech.id)) { GameUI.notify('既に研究済みです。'); return; }
    if (tech.prerequisites && !tech.prerequisites.every(p => ResearchManager.researchedTech.has(p))) {
      GameUI.notify('前提技術が不足しています。', 'alert'); return;
    }
    const s = CoreEngine.gameState;
    for (let i = 1; i <= s.researchSlots; i++) {
      if (!ResearchManager.researching[i]) {
        ResearchManager.researching[i] = { techId: tech.id, progress: 0, total: tech.research_time || 100 };
        CoreEngine.log('研究開始: ' + tech.title);
        GameUI.notify('研究開始: ' + tech.title, 'success');
        ResearchManager.renderSlots();
        ResearchManager.render();
        return;
      }
    }
    GameUI.notify('研究スロットが満杯です。', 'alert');
  }

  static onTick() {
    let changed = false;
    Object.entries(ResearchManager.researching).forEach(entry => {
      const slot = entry[0], research = entry[1];
      research.progress++;
      if (research.progress >= research.total) {
        ResearchManager.researchedTech.add(research.techId);
        delete ResearchManager.researching[slot];
        const tech = ResearchManager.findTech(research.techId);
        if (tech) {
          CoreEngine.log('研究完了: ' + tech.title);
          GameUI.notify('研究完了: ' + tech.title, 'success');
          if (tech.id && tech.id.includes('nuclear')) {
            CoreEngine.gameState.nuclearTechLevel = Math.max(1, CoreEngine.gameState.nuclearTechLevel);
          }
        }
        changed = true;
      }
    });
    if (changed || GameUI.currentTab === 'research') {
      ResearchManager.renderSlots();
      ResearchManager.render();
    }
  }
}

// ==========================================================
// Module 15b: UniqueNationSystems — 7大国の国家固有システム (DLC連携)
//   GER: MEFO手形 / SOV: スターリンのパラノイア / JAP: 陸海軍の対立
//   USA: 連邦議会 / ENG: 帝国会議 / FRA: 政治的二極化 / ITA: 権力の均衡
// ==========================================================
class UniqueNationSystems {
  static init() {
    UniqueNationSystems.ensureDefaults();
    CoreEngine.registerTickCallback(() => UniqueNationSystems.tick());
  }

  static ensureDefaults() {
    const s = CoreEngine.gameState;
    if (!s.nationSystems || Object.keys(s.nationSystems).length === 0) {
      s.nationSystems = UniqueNationSystems.defaultsFor(s.country);
    }
  }

  static defaultsFor(country) {
    const base = {
      GER: { mefoIssued: false, mefoMonthsLeft: 0 },
      SOV: { paranoia: 25 },
      JAP: { armyInfluence: 50 },
      USA: { congressDem: 290, congressRep: 145 },
      ENG: { dominionSupport: 60 },
      FRA: { polarization: 50 },
      ITA: { duceBalance: 65 }
    };
    return JSON.parse(JSON.stringify(base[country] || { generic: true }));
  }

  static tick() {
    const s = CoreEngine.gameState;
    const st = s.nationSystems;
    if (!st) { UniqueNationSystems.ensureDefaults(); return; }
    if (s.country === 'SOV') st.paranoia = Math.min(100, (st.paranoia || 0) + 0.05);
    if (s.country === 'GER' && st.mefoIssued) {
      st.mefoMonthsLeft--;
      if (st.mefoMonthsLeft <= 0) {
        st.mefoIssued = false;
        s.cardModifiers.facilityCostReduction = Math.max(0, (s.cardModifiers.facilityCostReduction || 0) - 0.2);
        GameUI.notify('MEFO手形の返済期限が到来 — 建設ブーストが失効しました', 'alert');
      }
    }
    if (s.country === 'ENG') st.dominionSupport = Math.min(100, (st.dominionSupport || 0) + 0.02);
    if (WindowManager.windows.get('nation')) UniqueNationSystems.render();
  }

  static gauge(value, color) {
    return '<div style="width:100%;height:14px;background:#222;border:1px solid var(--border-mil);border-radius:7px;overflow:hidden;margin:6px 0;">' +
      '<div style="width:' + Math.max(0, Math.min(100, value)) + '%;height:100%;background:' + color + ';"></div></div>';
  }

  static spendPP(cost) {
    if (CoreEngine.gameState.politicalPower < cost) {
      GameUI.notify('政治力が足りません (必要: ' + cost + ')。', 'alert');
      return false;
    }
    CoreEngine.gameState.politicalPower -= cost;
    CoreEngine.renderStats();
    return true;
  }

  static broadcastState() {
    MultiplayerManager.broadcast({ type: 'sync', state: CoreEngine.getSyncState(), date: CoreEngine.gameState.date.toISOString() });
  }

  static render() {
    UniqueNationSystems.ensureDefaults();
    const container = document.getElementById('nation-content');
    if (!container) return;
    const s = CoreEngine.gameState;
    const st = s.nationSystems;
    const names = { GER: 'ドイツ', SOV: 'ソビエト連邦', JAP: '大日本帝国', USA: 'アメリカ合衆国', ENG: 'イギリス', FRA: 'フランス', ITA: 'イタリア' };
    const renderers = {
      GER: UniqueNationSystems.renderGER, SOV: UniqueNationSystems.renderSOV,
      JAP: UniqueNationSystems.renderJAP, USA: UniqueNationSystems.renderUSA,
      ENG: UniqueNationSystems.renderENG, FRA: UniqueNationSystems.renderFRA,
      ITA: UniqueNationSystems.renderITA
    };
    const fn = renderers[s.country];
    container.innerHTML =
      '<div class="sp-section"><h3>🏛️ ' + DataFetcher.getCountryFlag(s.country) + ' ' + (names[s.country] || s.country) + ' 固有システム</h3></div>' +
      (fn ? fn(st) : '<p style="color:var(--text-secondary);">この国には固有システムがありません。</p>');
  }

  /* --- ドイツ: MEFO手形 --- */
  static renderGER(st) {
    let html = '<div class="mp-panel"><h3>📜 MEFO手形 (メフォ紙幣)</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);">再軍備資金を隠蔽した決済手形。発行すると24ヶ月間、特別研究施設の建設コストが20%減少します (期限が来ると自動失効)。</p>';
    if (st.mefoIssued) {
      html += '<p style="color:var(--accent-green);font-size:13px;">✔ 発行中 — 残り約' + Math.ceil(st.mefoMonthsLeft / 30) + 'ヶ月 / 建設コスト -20%</p>';
    } else {
      html += '<button class="mp-btn" onclick="UniqueNationSystems.issueMefo()">MEFO手形を発行 (政治力 50)</button>';
    }
    return html + '</div>';
  }

  static issueMefo() {
    const st = CoreEngine.gameState.nationSystems;
    if (st.mefoIssued) return;
    if (UniqueNationSystems.spendPP(50)) {
      st.mefoIssued = true;
      st.mefoMonthsLeft = 24 * 30;
      CoreEngine.gameState.cardModifiers.facilityCostReduction = (CoreEngine.gameState.cardModifiers.facilityCostReduction || 0) + 0.2;
      GameUI.notify('MEFO手形を発行 — 建設コスト -20% (24ヶ月間)', 'success');
      CoreEngine.log('MEFO手形を発行。隠れた再軍備資金が調達された。');
      UniqueNationSystems.render();
      UniqueNationSystems.broadcastState();
    }
  }

  /* --- ソ連: スターリンのパラノイア --- */
  static renderSOV(st) {
    const p = Math.round(st.paranoia || 0);
    const color = p >= 70 ? 'linear-gradient(90deg,#d4843a,#c44a4a)' : '#8a5a2a';
    return '<div class="mp-panel"><h3>👁️ スターリンのパラノイア</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);">パラノイアは日ごとに蓄積します。70以上で「大粛清」が実行可能 — 政治力+100・安定度+10を得るが、雇用したカードキャラクターが1人粛清される危険があります。</p>' +
      '<div style="font-size:12px;">パラノイア: <strong style="color:' + (p >= 70 ? '#ff4d4d' : '#d4a843') + ';">' + p + ' / 100</strong></div>' +
      UniqueNationSystems.gauge(p, color) +
      '<button class="mp-btn" style="background:var(--accent-red);" onclick="UniqueNationSystems.runPurge()" ' + (p >= 70 ? '' : 'disabled') + '>⚡ 大粛清を実行 (パラノイア70+)</button></div>';
  }

  static runPurge() {
    const st = CoreEngine.gameState.nationSystems;
    if ((st.paranoia || 0) < 70) return;
    st.paranoia = 15;
    CoreEngine.gameState.politicalPower = Math.min(999, CoreEngine.gameState.politicalPower + 100);
    CoreEngine.gameState.stability = Math.min(100, CoreEngine.gameState.stability + 10);
    const purged = CardSystem.purgeRandomCharacter();
    if (purged) {
      GameUI.notify('🔪 ' + purged + ' が粛清されました…', 'alert');
      CoreEngine.log('大粛清: ' + purged + ' が粛清された。');
    } else {
      GameUI.notify('大粛清が完了しました。', 'success');
      CoreEngine.log('大粛清が完了した。');
    }
    CoreEngine.renderStats();
    UniqueNationSystems.render();
    UniqueNationSystems.broadcastState();
  }

  /* --- 大日本帝国: 陸海軍の対立 --- */
  static renderJAP(st) {
    const army = Math.round(st.armyInfluence === undefined ? 50 : st.armyInfluence);
    const navy = 100 - army;
    let html = '<div class="mp-panel"><h3>⚔️ 陸海軍の対立</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);">予算と資源を巡る陸海軍の対立。優勢な軍に応じた恩恵を受けます (陸軍優勢: 戦争協力度+ / 海軍優勢: 船団+燃料+)。シフトには政治力25が必要です。</p>' +
      '<div style="display:flex;gap:8px;font-size:12px;"><div style="flex:1;">🪖 陸軍 <strong style="color:#c44a4a;">' + army + '%</strong></div><div style="flex:1;text-align:right;">⚓ 海軍 <strong style="color:#4a8fc4;">' + navy + '%</strong></div></div>' +
      '<div style="display:flex;height:14px;border:1px solid var(--border-mil);border-radius:7px;overflow:hidden;margin:6px 0;">' +
      '<div style="width:' + army + '%;background:#a03c3c;"></div><div style="width:' + navy + '%;background:#3c6ea0;"></div></div>' +
      '<button class="mp-btn" style="background:var(--accent-red);" onclick="UniqueNationSystems.shiftJAP(-10)">🪖 陸軍を優遇 (PP 25)</button>' +
      '<button class="mp-btn" onclick="UniqueNationSystems.shiftJAP(10)">⚓ 海軍を優遇 (PP 25)</button>' +
      '<p style="font-size:11px;color:var(--text-secondary);margin-top:6px;">現在: ' +
      (army > 60 ? '🪖 陸軍優勢 (戦争協力度ボーナス維持)' : navy > 60 ? '⚓ 海軍優勢 (船団・燃料ボーナス維持)' : '⚖️ 均衡状態 (ボーナスなし)') + '</p></div>';
    return html;
  }

  static shiftJAP(delta) {
    const st = CoreEngine.gameState.nationSystems;
    if (!UniqueNationSystems.spendPP(25)) return;
    st.armyInfluence = Math.max(0, Math.min(100, (st.armyInfluence === undefined ? 50 : st.armyInfluence) + delta));
    const s = CoreEngine.gameState;
    if (delta < 0) {
      s.warSupport = Math.min(100, s.warSupport + 2);
      CoreEngine.log('陸軍を優遇: 戦争協力度+2');
    } else {
      s.convoys += 10;
      s.fuel = Math.min(s.maxFuel, s.fuel + 100);
      CoreEngine.log('海軍を優遇: 船団+10 / 燃料+100');
    }
    UniqueNationSystems.render();
    UniqueNationSystems.broadcastState();
  }

  /* --- アメリカ: 連邦議会 --- */
  static renderUSA(st) {
    const total = (st.congressDem || 0) + (st.congressRep || 0);
    const demPct = Math.round((st.congressDem || 0) / total * 100);
    return '<div class="mp-panel"><h3>🏛️ 連邦議会 (民主の兵器廠)</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);">上下院の議席構成。与党が過半数 (55%+) を維持している間、法案通過により政治力獲得量が増加します。</p>' +
      '<div style="display:flex;gap:8px;font-size:12px;"><div>民主党 <strong style="color:#4a8fc4;">' + (st.congressDem || 0) + '議席</strong></div>' +
      '<div>共和党 <strong style="color:#c44a4a;">' + (st.congressRep || 0) + '議席</strong> — 民主党 ' + demPct + '%</div></div>' +
      '<div style="display:flex;height:14px;border:1px solid var(--border-mil);border-radius:7px;overflow:hidden;margin:6px 0;">' +
      '<div style="width:' + demPct + '%;background:#3c6ea0;"></div><div style="width:' + (100 - demPct) + '%;background:#a03c3c;"></div></div>' +
      '<button class="mp-btn" onclick="UniqueNationSystems.passUSABill()">📜 法案を通過させる (PP 40)</button>' +
      '<p style="font-size:11px;color:var(--text-secondary);margin-top:6px;">過半数維持: ' + (demPct >= 55 ? '✔ 政治力獲得 +0.25/日' : '✖ 議会が分裂中 — ロビー活動が必要') + '</p></div>';
  }

  static passUSABill() {
    const st = CoreEngine.gameState.nationSystems;
    const total = (st.congressDem || 0) + (st.congressRep || 0);
    const demPct = (st.congressDem || 0) / total * 100;
    if (demPct < 55) {
      GameUI.notify('議会が分裂している — ロビー活動 (選挙支援) が必要です。', 'alert');
      return;
    }
    if (UniqueNationSystems.spendPP(40)) {
      CoreEngine.gameState.cardModifiers.politicalPowerGain = (CoreEngine.gameState.cardModifiers.politicalPowerGain || 0) + 0.25;
      GameUI.notify('📜 法案通過 — 政治力獲得量 +0.25/日', 'success');
      CoreEngine.log('連邦議会で法案が通過した。政治力獲得が増加。');
      UniqueNationSystems.render();
      UniqueNationSystems.broadcastState();
    }
  }

  /* --- イギリス: 帝国会議 --- */
  static renderENG(st) {
    const sup = Math.round(st.dominionSupport === undefined ? 60 : st.dominionSupport);
    return '<div class="mp-panel"><h3>🌍 帝国会議 (大英帝国)</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);">自治領・植民地との連携。招集するたびに自治領支持が10消費されます (日ごとに少しずつ回復)。船団と人的資源を獲得。</p>' +
      '<div style="font-size:12px;">自治領支持: <strong style="color:#d4a843;">' + sup + ' / 100</strong></div>' +
      UniqueNationSystems.gauge(sup, '#8a7a3a') +
      '<button class="mp-btn" onclick="UniqueNationSystems.convokeImperial()" ' + (sup >= 10 ? '' : 'disabled') + '>🤝 帝国会議を招集 (PP 40 / 支持10)</button></div>';
  }

  static convokeImperial() {
    const st = CoreEngine.gameState.nationSystems;
    if ((st.dominionSupport === undefined ? 60 : st.dominionSupport) < 10) return;
    if (UniqueNationSystems.spendPP(40)) {
      st.dominionSupport = Math.max(0, st.dominionSupport - 10);
      CoreEngine.gameState.convoys += 25;
      CoreEngine.gameState.manpower += 50000;
      GameUI.notify('🤝 帝国会議 — 船団+25 / 人的資源+50K', 'success');
      CoreEngine.log('帝国会議を招集。自治領からの支援を受けた。');
      CoreEngine.renderStats();
      UniqueNationSystems.render();
      UniqueNationSystems.broadcastState();
    }
  }

  /* --- フランス: 政治的二極化 --- */
  static renderFRA(st) {
    const pol = Math.round(st.polarization === undefined ? 50 : st.polarization);
    const centered = Math.abs(pol - 50) <= 10;
    return '<div class="mp-panel"><h3>⚡ 政治的二極化 (フランス)</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);">人民戦線と右派の対立。どちらかに極端に偏ると安定度が低下し、中道 (45-55) に保つと政治力獲得ボーナスを得ます。</p>' +
      '<div style="display:flex;gap:8px;font-size:12px;"><div>⬅️ 左派</div><div style="flex:1;text-align:center;">中道 (45-55で安定)</div><div>右派 ➡️</div></div>' +
      UniqueNationSystems.gauge(pol, 'linear-gradient(90deg,#a03c5a,#4a5a6a,#3a6a4a)') +
      '<button class="mp-btn" onclick="UniqueNationSystems.shiftFRA(-10)">🚩 人民戦線と組む (PP 30)</button>' +
      '<button class="mp-btn" onclick="UniqueNationSystems.shiftFRA(10)">🛡️ 右派と組む (PP 30)</button>' +
      '<p style="font-size:11px;color:var(--text-secondary);margin-top:6px;">現在: ' + (centered ? '✔ 政治的混乱が収束 — 政治力獲得 +0.25/日' : '⚠️ 政治が二極化中 (安定度ボーナスなし)') + '</p></div>';
  }

  static shiftFRA(delta) {
    const st = CoreEngine.gameState.nationSystems;
    if (!UniqueNationSystems.spendPP(30)) return;
    st.polarization = Math.max(0, Math.min(100, (st.polarization === undefined ? 50 : st.polarization) + delta));
    const s = CoreEngine.gameState;
    s.stability = Math.min(100, Math.max(0, s.stability + (Math.abs(st.polarization - 50) <= 10 ? 5 : -2)));
    UniqueNationSystems.render();
    CoreEngine.renderStats();
    UniqueNationSystems.broadcastState();
  }

  /* --- イタリア: 権力の均衡 --- */
  static renderITA(st) {
    const duce = Math.round(st.duceBalance === undefined ? 65 : st.duceBalance);
    const king = 100 - duce;
    return '<div class="mp-panel"><h3>⚖️ 権力の均衡 (ムッソリーニ vs 国王)</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);">ムッソリーニ優位なら戦争協力度を、国王 (王党派) 優位なら安定度を得られます。どちらに傾けるかが外交・軍事の方針を決めます。</p>' +
      '<div style="display:flex;gap:8px;font-size:12px;"><div>🦅 ムッソリーニ <strong style="color:#5a7a4a;">' + duce + '%</strong></div>' +
      '<div style="flex:1;text-align:right;">👑 国王 <strong style="color:#8a8aaa;">' + king + '%</strong></div></div>' +
      '<div style="display:flex;height:14px;border:1px solid var(--border-mil);border-radius:7px;overflow:hidden;margin:6px 0;">' +
      '<div style="width:' + duce + '%;background:#4a6a3a;"></div><div style="width:' + king + '%;background:#6a6a8a;"></div></div>' +
      '<button class="mp-btn" style="background:var(--accent-orange);" onclick="UniqueNationSystems.shiftITA(-10)">🦅 ムッソリーニを強化 (PP 30)</button>' +
      '<button class="mp-btn" onclick="UniqueNationSystems.shiftITA(10)">👑 国王に譲歩 (PP 30)</button></div>';
  }

  static shiftITA(delta) {
    const st = CoreEngine.gameState.nationSystems;
    if (!UniqueNationSystems.spendPP(30)) return;
    st.duceBalance = Math.max(0, Math.min(100, (st.duceBalance === undefined ? 65 : st.duceBalance) + delta));
    const s = CoreEngine.gameState;
    if (delta < 0) s.warSupport = Math.min(100, s.warSupport + 3);
    else s.stability = Math.min(100, s.stability + 3);
    UniqueNationSystems.render();
    CoreEngine.renderStats();
    UniqueNationSystems.broadcastState();
  }
}

// ==========================================================
// Module 16: SaveLoadManager — セーブ/ロード (スロット + JSON入出力)
//   保存内容: 世界情勢 (資源・工場・政治力等) / 国家方針進捗 /
//   デッキ・雇用カード / 国家固有システム
// ==========================================================
class SaveLoadManager {
  static PREFIX = 'hoi4_save_slot_';

  static collect() {
    const gs = CoreEngine.gameState;
    return {
      version: 3,
      savedAt: new Date().toISOString(),
      core: { ...gs, date: gs.date.toISOString() },
      focus: {
        completed: [...FocusTreeManager.completedFocuses],
        activeFocus: FocusTreeManager.activeFocus,
        progress: FocusTreeManager.focusProgress,
        total: FocusTreeManager.focusDaysTotal
      },
      deck: CardSystem.deck,
      hired: CardSystem.hiredCards,
      dlc: (typeof DLC !== 'undefined' ? DLC.collect() : null)   // DLC拡張状態 (XP/設計/諜報/MIO/講和/特性)
    };
  }

  static save(slot) {
    try {
      const data = SaveLoadManager.collect();
      data.savedAt = new Date().toISOString();
      localStorage.setItem(SaveLoadManager.PREFIX + slot, JSON.stringify(data));
      GameUI.notify('💾 スロット' + slot + 'にセーブしました', 'success');
      CoreEngine.log('スロット' + slot + 'にセーブしました。');
    } catch (e) {
      GameUI.notify('セーブに失敗: ' + e.message, 'alert');
    }
    SaveLoadManager.render();
  }

  static load(slot) {
    let data;
    try {
      data = JSON.parse(localStorage.getItem(SaveLoadManager.PREFIX + slot) || 'null');
    } catch (e) { data = null; }
    if (!data) { GameUI.notify('スロット' + slot + 'は空です。', 'alert'); return; }
    SaveLoadManager.apply(data);
  }

  static apply(data) {
    if (!data || !data.core) { GameUI.notify('セーブデータが不正です。', 'alert'); return; }
    const gs = CoreEngine.gameState;
    CoreEngine.setSpeed(0);
    Object.entries(data.core).forEach(([k, v]) => {
      if (k === 'date') gs.date = new Date(v);
      else if (k === 'cardModifiers') gs.cardModifiers = { ...gs.cardModifiers, ...v };
      else if (k in gs) gs[k] = v;
    });
    if (data.focus) {
      FocusTreeManager.completedFocuses = new Set(data.focus.completed || []);
      FocusTreeManager.activeFocus = data.focus.activeFocus || null;
      FocusTreeManager.focusProgress = data.focus.progress || 0;
      FocusTreeManager.focusDaysTotal = data.focus.total || 0;
    }
    CardSystem.deck = data.deck || [];
    CardSystem.hiredCards = data.hired || [];
    if (data.dlc && typeof DLC !== 'undefined') DLC.apply(data.dlc);   // DLC拡張状態を復元
    CardSystem.saveDeck();
    CardSystem.saveHired();
    UniqueNationSystems.ensureDefaults();
    CoreEngine.renderStats();
    CoreEngine.updateCalendar();
    FocusTreeManager.render();
    CardSystem.render();
    UniqueNationSystems.render();
    MultiplayerManager.broadcast({ type: 'sync', state: CoreEngine.getSyncState(), date: gs.date.toISOString() });
    GameUI.notify('💾 セーブデータをロードしました', 'success');
    CoreEngine.log('セーブデータを読み込みました。');
  }

  static deleteSlot(slot) {
    localStorage.removeItem(SaveLoadManager.PREFIX + slot);
    SaveLoadManager.render();
    GameUI.notify('スロット' + slot + 'を削除しました。');
  }

  static exportSave() {
    const data = SaveLoadManager.collect();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const d = CoreEngine.gameState.date;
    a.download = 'hoi4_save_' + d.getFullYear() + (d.getMonth() + 1 + '').padStart(2, '0') + (d.getDate() + '').padStart(2, '0') + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
    GameUI.notify('セーブデータをJSONで書き出しました', 'success');
  }

  static importSave(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        SaveLoadManager.apply(JSON.parse(reader.result));
        SaveLoadManager.render();
      } catch (e) {
        GameUI.notify('読み込み失敗: 不正なJSONです。', 'alert');
      }
    };
    reader.readAsText(file);
    input.value = '';
  }

  static slotMeta(slot) {
    try {
      const data = JSON.parse(localStorage.getItem(SaveLoadManager.PREFIX + slot) || 'null');
      if (!data || !data.core) return null;
      const d = new Date(data.core.date);
      return {
        date: d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate(),
        country: data.core.country,
        savedAt: new Date(data.savedAt).toLocaleString('ja-JP'),
        deck: (data.deck || []).length,
        hired: (data.hired || []).length
      };
    } catch (e) { return null; }
  }

  static render() {
    const container = document.getElementById('winsave-content');
    if (!container) return;
    let html = '<div class="sp-section"><h3>💾 セーブ / ロード</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);">世界情勢・国家方針進捗・軍隊・資源・所持カードを保存します。スロット3つ + JSONファイル入出力に対応。</p></div>';
    for (let slot = 1; slot <= 3; slot++) {
      const meta = SaveLoadManager.slotMeta(slot);
      html += '<div class="con-queue-item"><div class="cq-top"><strong>スロット ' + slot + '</strong>' +
        '<span>' +
        '<button class="mp-btn" onclick="SaveLoadManager.save(' + slot + ')">セーブ</button> ' +
        '<button class="mp-btn" onclick="SaveLoadManager.load(' + slot + ')" ' + (meta ? '' : 'disabled') + '>ロード</button> ' +
        '<button class="diplo-btn" style="background:var(--accent-red);" onclick="SaveLoadManager.deleteSlot(' + slot + ')" ' + (meta ? '' : 'disabled') + '>削除</button>' +
        '</span></div>' +
        (meta
          ? '<div style="font-size:11px;color:var(--text-secondary);margin-top:4px;">📅 ' + meta.date + ' | ' + DataFetcher.getCountryFlag(meta.country) + ' ' + meta.country +
            ' | 🃏 デッキ' + meta.deck + '枚 / 🎖️ 雇用' + meta.hired + '人 | 保存: ' + meta.savedAt + '</div>'
          : '<div style="font-size:11px;color:var(--text-secondary);margin-top:4px;">空きスロット</div>') +
        '</div>';
    }
    html += '<div class="sp-section" style="margin-top:16px;"><h3>📤 ファイル入出力</h3>' +
      '<button class="mp-btn" onclick="SaveLoadManager.exportSave()">📤 JSONで書き出す</button> ' +
      '<label class="mp-btn" style="display:inline-block;">📥 JSONを読み込む<input type="file" accept=".json" style="display:none;" onchange="SaveLoadManager.importSave(this)"></label>' +
      '<p style="font-size:11px;color:var(--text-secondary);margin-top:6px;">書き出したセーブファイルを他のプレイヤーと共有して、同じ世界から再開できます。</p></div>';
    container.innerHTML = html;
  }
}

// ==========================================================
// Module 17: GameUI — UI管理・ウィンドウ切替・モーダル・通知
// ==========================================================
class GameUI {
  // 現在のタブ = 最前面のウィンドウ (ウィンドウUI化に伴う互換getter)
  static get currentTab() {
    const top = WindowManager.topWindow();
    return top ? top.tab : null;
  }

  static switchTab(tabName) {
    if (tabName === 'map') { WindowManager.closeAll(); return; }
    WindowManager.open(tabName);
  }

  // ウィンドウが開かれた時に対応するパネルを再描画
  static onWindowOpened(tabName) {
    if (tabName === 'special') SpecialProjectManager.render();
    if (tabName === 'nuclear') NuclearManager.render();
    if (tabName === 'construction') ConstructionManager.render();
    if (tabName === 'trade') ResourceManager.render();
    if (tabName === 'diplomacy') DiplomacyManager.render();
    if (tabName === 'cards') CardSystem.render();
    if (tabName === 'division') DivisionDesigner.render();
    if (tabName === 'multiplayer') MultiplayerManager.render();
    if (tabName === 'research') { ResearchManager.renderTabs(); ResearchManager.renderSlots(); ResearchManager.render(); }
    if (tabName === 'focus') FocusTreeManager.render();
    if (tabName === 'nation') UniqueNationSystems.render();
    if (tabName === 'winsave') SaveLoadManager.render();
    if (tabName === 'politics') PoliticsManager.render();
  }

  static onWindowClosed(tabName) { /* focus管理はWindowManagerが行う */ }

  static notify(message, type) {
    const container = document.getElementById('notification-container');
    const notif = document.createElement('div');
    notif.className = 'notification ' + (type === 'alert' ? 'alert' : type === 'success' ? 'success' : '');
    notif.textContent = message;
    container.appendChild(notif);
    setTimeout(() => {
      notif.style.opacity = '0';
      notif.style.transition = 'opacity 0.3s';
      setTimeout(() => notif.remove(), 300);
    }, 4000);
  }

  static openModal(title, bodyHtml) {
    document.getElementById('generic-modal-title').textContent = title;
    document.getElementById('generic-modal-body').innerHTML = bodyHtml;
    document.getElementById('generic-modal-overlay').classList.remove('hidden');
  }

  static closeModal() {
    document.getElementById('generic-modal-overlay').classList.add('hidden');
  }
}

// START SCREEN — シナリオ選択・国家選択 (最初の起動時に表示)
// ==========================================================
class StartScreen {
  static selected = null;
  static NATIONS = [
    { tag: 'GER', name: 'ドイツ', desc: '最強の陸軍。MEFO手形で経済を加速し、カードで得た機甲将軍と電撃戦を展開する。', feature: '陸軍最強・MEFO手形', pp: 120, cf: 22, mf: 18 },
    { tag: 'SOV', name: 'ソビエト連邦', desc: '大粛清と「スターリンのパラノイア」ゲージ。圧倒的な人的資源と戦略的縦深を活かす。', feature: '人的資源最大・パラノイア', pp: 100, cf: 25, mf: 20, manpower: 1800000 },
    { tag: 'JAP', name: '大日本帝国', desc: '「陸海軍の対立」ディシジョン。提督カードを配備して太平洋の制海権を握る。', feature: '海軍強国・陸海軍対立', pp: 90, cf: 15, mf: 14, dockyards: 8 },
    { tag: 'USA', name: 'アメリカ', desc: '「連邦議会」UIで上下院の議席を管理し、大恐慌からの脱出と巨大な工業力を活かす。', feature: '議会UI・工業力最大', pp: 80, cf: 35, mf: 10 },
    { tag: 'ENG', name: 'イギリス', desc: '帝国会議で自治領を連携させ、強力なRAFとシーレーン防衛でドイツに立ち向かう。', feature: '帝国会議・RAF', pp: 100, cf: 28, mf: 12, dockyards: 7 },
    { tag: 'FRA', name: 'フランス', desc: '政治の二極化と安定度管理。マジノ線を延長し、国家方針で大恐慌のデバフを解除する。', feature: 'マジノ線・二極化管理', pp: 80, cf: 18, mf: 10 },
    { tag: 'ITA', name: 'イタリア', desc: '「権力の均衡」UIでムッソリーニと国王の権力バランスを調整し地中海の覇権を狙う。', feature: '権力の均衡UI', pp: 90, cf: 14, mf: 12, dockyards: 5 }
  ];

  static show() {
    const grid = document.getElementById('start-nation-grid');
    grid.innerHTML = '';
    StartScreen.NATIONS.forEach(n => {
      const el = document.createElement('div');
      el.className = 'start-nation-card';
      el.dataset.tag = n.tag;
      el.innerHTML = '<div class="sn-flag">' + DataFetcher.getCountryFlag(n.tag) + '</div>' +
        '<div class="sn-name">' + n.name + ' (' + n.tag + ')</div>' +
        '<div class="sn-desc">' + n.desc + '</div>' +
        '<div class="sn-feature">★ ' + n.feature + '</div>';
      el.addEventListener('click', () => StartScreen.select(n.tag));
      grid.appendChild(el);
    });
    document.getElementById('start-screen').classList.remove('hidden');
  }

  static select(tag) {
    StartScreen.selected = tag;
    document.querySelectorAll('.start-nation-card').forEach(el =>
      el.classList.toggle('active', el.dataset.tag === tag));
    const btn = document.getElementById('start-game-btn');
    btn.disabled = false;
    btn.textContent = '🇩🇪 ' + StartScreen.NATIONS.find(n => n.tag === tag).name + ' でゲーム開始';
  }

  static start() {
    if (!StartScreen.selected) return;
    const n = StartScreen.NATIONS.find(x => x.tag === StartScreen.selected);
    const s = CoreEngine.gameState;
    s.country = n.tag;
    s.politicalPower = n.pp;
    s.civilianFactories = n.cf;
    s.militaryFactories = n.mf;
    if (n.dockyards) s.dockyards = n.dockyards;
    if (n.manpower) s.manpower = n.manpower;
    document.getElementById('start-screen').classList.add('hidden');
    initGame(n.tag);
  }
}

// ==========================================================
// INITIALIZATION — ゲーム起動
// ==========================================================
async function initGame() {
  CoreEngine.init();
  CoreEngine.updateCalendar();
  CoreEngine.registerTickCallback(() => BattleManager.onTick());          // 戦闘進行
  CoreEngine.registerTickCallback(() => BattleManager.maybeEnemyOffensive()); // 敵軍の偶発侵攻
  MapRenderer.init();            // 全画面操作マップ (hoi4-history公式データ) — 非同期で読み込み
  BattlePlanManager.init();      // 軍集団パネル・作戦指揮
  ConstructionManager.init();   // 建設キュー
  await FocusTreeManager.init(CoreEngine.gameState.country);
  await ResearchManager.init(CoreEngine.gameState.country);
  await SpecialProjectManager.init();
  await NuclearManager.init();
  ResourceManager.init();
  DiplomacyManager.init();
  await CardSystem.init();
  PoliticsManager.init();
  PoliticsManager.render();
  CheatConsole.init();
  MultiplayerManager.init();
  UniqueNationSystems.init();
  if (typeof NewsManager !== 'undefined') NewsManager.init();   // ニュースイベント (世界の出来事を報道)
  if (typeof AIManager !== 'undefined') AIManager.init();       // 非プレイヤー国のAI自動操作 (史実準拠)
  if (typeof DLC !== 'undefined') DLC.onGameStart();   // 全DLC拡張 (ドクトリン/兵器設計/諜報/MIO・国際市場/講和会議/将軍特性)
  CardSystem.deck.forEach(card => CardSystem.applyModifiers(card.id));
  CoreEngine.renderStats();
  CoreEngine.renderWorldTension();
  CoreEngine.log(CoreEngine.gameState.country + ' — ゲームを開始しました。速度ボタンで時間を進めてください。');
  GameUI.notify('Hearts of Iron IV × 将軍カードゲーム 開始！', 'success');
}

window.addEventListener('DOMContentLoaded', () => StartScreen.show());
