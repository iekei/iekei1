// Module 5: NuclearManager — 核攻撃システム
// ==========================================================
class NuclearManager {
  static selectedTarget = null;

  static async init() {
    NuclearManager.render();
    CoreEngine.registerTickCallback(() => NuclearManager.onTick());
  }

  static onTick() {
    const s = CoreEngine.gameState;
    if (s.nuclearReactorLevel > 0 && s.nuclearTechLevel > 0) {
      s.nuclearStockpile += s.nuclearReactorLevel * 0.01;
    }
    if (GameUI.currentTab === 'nuclear') NuclearManager.render();
  }

  static render() {
    const s = CoreEngine.gameState;
    const canStrike = NuclearManager.canStrike();
    const container = document.getElementById('nuclear-content');

    container.innerHTML =
      '<div class="nuclear-panel"><h3>☢️ 核兵器ステータス</h3>' +
      '<div class="nuclear-stat"><span class="ns-label">核爆弾備蓄数</span><span class="ns-value">' + Math.floor(s.nuclearStockpile) + '</span></div>' +
      '<div class="nuclear-stat"><span class="ns-label">原子炉レベル</span><span class="ns-value">' + s.nuclearReactorLevel + '</span></div>' +
      '<div class="nuclear-stat"><span class="ns-label">核技術レベル</span><span class="ns-value">' + s.nuclearTechLevel + '</span></div>' +
      '<div class="nuclear-stat"><span class="ns-label">制空権</span><span class="ns-value">' + s.airSupremacy + '% / 75%必要</span></div>' +
      '<div class="nuclear-stat"><span class="ns-label">戦略爆撃機</span><span class="ns-value">' + s.strategicBombers + '機</span></div></div>' +

      '<div class="nuclear-panel"><h3>🏭 核施設建設</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">原子炉を建設して核爆弾を生産します。核技術研究が必要です。</p>' +
      '<button class="sp-btn" onclick="NuclearManager.buildReactor()" ' + (s.civilianFactories < 5 ? 'disabled' : '') + '>原子炉建設 (民需工廠5消費) — 現在Lv.' + s.nuclearReactorLevel + '</button>' +
      '<button class="sp-btn" onclick="NuclearManager.researchNuclear()" ' + (s.politicalPower < 30 ? 'disabled' : '') + ' style="margin-left:8px;">核技術研究 (PP30消費) — 現在Lv.' + s.nuclearTechLevel + '</button></div>' +

      '<div class="nuclear-panel" style="border-color:' + (canStrike ? 'var(--accent-red)' : 'var(--border-mil)') + ';"><h3>💥 核攻撃</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">' +
      '核攻撃には以下の条件が必要です：<br>' +
      '✓ 制空権75%以上 — 現在: ' + s.airSupremacy + '% ' + (s.airSupremacy >= 75 ? '✅' : '❌') + '<br>' +
      '✓ 戦略爆撃機配備 — ' + (s.strategicBombers > 0 ? '✅' : '❌') + ' (' + s.strategicBombers + '機)<br>' +
      '✓ 核爆弾備蓄1以上 — ' + (s.nuclearStockpile >= 1 ? '✅' : '❌') + ' (' + Math.floor(s.nuclearStockpile) + '個)</p>' +
      '<button class="nuclear-btn" onclick="NuclearManager.launchStrike()" ' + (!canStrike ? 'disabled' : '') + '>☢️ 核攻撃を実行</button></div>' +

      '<div class="nuclear-panel"><h3>🎯 ターゲット選択</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);">敵国の主要都市・工業地帯を攻撃対象として選択できます。</p>' +
      '<div id="nuke-targets" style="margin-top:8px;">' + NuclearManager.renderTargets() + '</div></div>';
  }

  static renderTargets() {
    // stateId は game/mapdata/states.json (cbrzeczysz/hoi4-history) 由来
    const targets = [
      { id: '126', name: 'ロンドン', country: 'ENG', damage: '高' },
      { id: '16', name: 'パリ', country: 'FRA', damage: '高' },
      { id: '219', name: 'モスクワ', country: 'SOV', damage: '极高' },
      { id: '386', name: 'ワシントン', country: 'USA', damage: '极高' },
      { id: '282', name: '東京', country: 'JAP', damage: '高' },
      { id: '64', name: 'ベルリン', country: 'GER', damage: '极高' }
    ];
    return targets.map(t =>
      '<div style="display:inline-block;background:var(--bg-panel-light);border:1px solid var(--border-mil);border-radius:6px;padding:8px 12px;margin:4px;cursor:pointer;font-size:12px;" onclick="NuclearManager.selectTarget(\'' + t.id + '\',\'' + t.name + '\')">' +
      DataFetcher.getCountryFlag(t.country) + ' ' + t.name + ' (被害予測: ' + t.damage + ')</div>'
    ).join('');
  }

  static selectTarget(id, name) {
    NuclearManager.selectedTarget = { id: id, name: name };
    GameUI.notify('ターゲット選択: ' + name);
  }

  static canStrike() {
    const s = CoreEngine.gameState;
    return s.airSupremacy >= 75 && s.strategicBombers > 0 && s.nuclearStockpile >= 1;
  }

  static buildReactor() {
    const s = CoreEngine.gameState;
    if (s.civilianFactories < 5) { GameUI.notify('民需工廠が不足しています。', 'alert'); return; }
    s.civilianFactories -= 5;
    s.nuclearReactorLevel++;
    CoreEngine.log('原子炉を建設しました (Lv.' + s.nuclearReactorLevel + ')');
    GameUI.notify('原子炉建設完了！', 'success');
    CoreEngine.renderStats();
    NuclearManager.render();
  }

  static researchNuclear() {
    const s = CoreEngine.gameState;
    if (s.politicalPower < 30) { GameUI.notify('政治力が不足しています。', 'alert'); return; }
    s.politicalPower -= 30;
    s.nuclearTechLevel++;
    if (s.nuclearTechLevel === 1) s.strategicBombers += 10;
    CoreEngine.log('核技術を研究しました (Lv.' + s.nuclearTechLevel + ')');
    GameUI.notify('核技術研究完了！', 'success');
    CoreEngine.renderStats();
    NuclearManager.render();
  }

  static launchStrike() {
    if (!NuclearManager.canStrike()) { GameUI.notify('核攻撃の条件を満たしていません。', 'alert'); return; }
    if (!NuclearManager.selectedTarget) { GameUI.notify('ターゲットを選択してください。', 'alert'); return; }
    const s = CoreEngine.gameState;
    s.nuclearStockpile -= 1;

    NuclearManager.playNukeAnimation();

    const targetName = NuclearManager.selectedTarget.name;
    s.stability = Math.max(0, s.stability - 5);
    s.warSupport = Math.min(100, s.warSupport + 20);
    s.airSupremacy = Math.max(0, s.airSupremacy - 20);

    // マップ上の州に核爆発エフェクト + 施設破壊 (組織力壊滅)
    MapRenderer.addNukeEffectAtState(NuclearManager.selectedTarget.id);
    const hitState = MapRenderer.states[NuclearManager.selectedTarget.id];
    if (hitState) {
      if (hitState.b) {
        Object.keys(hitState.b).forEach(k => { hitState.b[k] = Math.floor(hitState.b[k] * 0.3); });
      }
      hitState.supply = 0;
      MapRenderer.invalidateModes();
    }

    CoreEngine.log('💥 核攻撃実行！' + targetName + 'に原子爆弾を投下！');
    GameUI.notify('核攻撃: ' + targetName + 'に投下完了！', 'alert');
    // 世界に衝撃を与える核投下 → ニュースイベントとして全世界に配信
    if (typeof NewsManager !== 'undefined') {
      NewsManager.fireCustom({
        icon: '☢️', title: '地球揺るがす新型爆弾 — ' + targetName + 'に投下',
        body: '単一の爆弾が' + targetName + 'を破壊しました。この「原子爆弾」の威力に世界は戦慄しています。核の時代の幕開けです。',
        reactions: ['恐怖だ…これが新時代か', '研究を急げ!', 'この戦争は終わるだろう']
      });
    }

    MultiplayerManager.broadcast({
      type: 'nuclear_strike',
      target: targetName,
      attacker: CoreEngine.gameState.country
    });

    CoreEngine.renderStats();
    setTimeout(() => NuclearManager.render(), 2500);
  }

  static playNukeAnimation() {
    const overlay = document.createElement('div');
    overlay.className = 'nuke-animation';
    overlay.innerHTML = '<div class="nuke-flash"></div><div class="nuke-cloud"><div class="nuke-stem"></div></div>';
    document.body.appendChild(overlay);
    document.body.classList.add('screen-shake');

    const telop = document.createElement('div');
    telop.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10000;color:#ff3333;font-size:48px;font-weight:900;text-shadow:0 0 20px #f00;animation:nukeFlash 0.5s ease-out;';
    telop.textContent = '⚠️ 核攻撃警報 ⚠️';
    document.body.appendChild(telop);

    setTimeout(() => {
      overlay.remove();
      telop.remove();
      document.body.classList.remove('screen-shake');

  static onNuclearStrike(data) {

    GameUI.notify('核攻撃警報: ' + data.target + 'が核攻撃を受けました！', 'alert');
  }
}

// ==========================================================
// Module 6: WindowManager — OS風ウィンドウ管理（ドラッグ・リサイズ・zIndex）
// ==========================================================
class WindowManager {
  static windows = new Map(); // tab -> win object
  static zTop = 100;
  static cascade = 0;

  static open(tab) {
    let win = WindowManager.windows.get(tab);
    if (win) {
      win.el.classList.remove('minimized');
      WindowManager.focus(win);
      return win.el;
    }
    const tpl = document.getElementById('tpl-' + tab);
    if (!tpl) return null;

    const el = document.createElement('div');
    el.className = 'os-window';
    const w = Math.min(parseInt(tpl.dataset.w) || 700, document.getElementById('window-layer').offsetWidth - 20);
    const h = Math.min(parseInt(tpl.dataset.h) || 500, document.getElementById('window-layer').offsetHeight - 20);
    const off = (WindowManager.cascade++ % 8) * 28;
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.style.left = Math.min(90 + off, document.getElementById('window-layer').offsetWidth - w - 8) + 'px';
    el.style.top = Math.min(30 + off, document.getElementById('window-layer').offsetHeight - h - 8) + 'px';

    el.innerHTML =
      '<div class="os-titlebar"><span class="os-title">' + (tpl.dataset.title || tab) + '</span>' +
      '<span class="os-ctrl-group">' +
      '<button class="os-ctrl min" title="最小化">−</button>' +
      '<button class="os-ctrl max" title="最大化">▢</button>' +
      '<button class="os-ctrl close" title="閉じる">✕</button></span></div>' +
      '<div class="os-body"></div>' +
      '<div class="os-resize-handle"></div>';

    const body = el.querySelector('.os-body');
    body.appendChild(tpl); // move template content into the window

    document.getElementById('window-layer').appendChild(el);

    win = { tab: tab, el: el, minimized: false, maximized: false, prevRect: null };
    WindowManager.windows.set(tab, win);

    el.addEventListener('mousedown', () => WindowManager.focus(win));
    el.querySelector('.os-ctrl.min').addEventListener('click', () => WindowManager.minimize(tab));
    el.querySelector('.os-ctrl.max').addEventListener('click', () => WindowManager.toggleMaximize(tab));
    el.querySelector('.os-ctrl.close').addEventListener('click', () => WindowManager.close(tab));
    WindowManager.setupDrag(win);
    WindowManager.setupResize(win);
    WindowManager.focus(win);
    WindowManager.updateRail();
    GameUI.onWindowOpened(tab);
    return el;
  }

  static close(tab) {
    const win = WindowManager.windows.get(tab);
    if (!win) return;
    const tpl = document.getElementById('tpl-' + tab);
    if (tpl) document.getElementById('window-templates').appendChild(tpl);
    win.el.remove();
    WindowManager.windows.delete(tab);
    WindowManager.updateRail();
    GameUI.onWindowClosed(tab);
  }

  static closeAll() {
    [...WindowManager.windows.keys()].forEach(tab => WindowManager.close(tab));
  }

  static minimize(tab) {
    const win = WindowManager.windows.get(tab);
    if (!win) return;
    win.minimized = !win.minimized;
    win.el.classList.toggle('minimized', win.minimized);
  }

  static toggleMaximize(tab) {
    const win = WindowManager.windows.get(tab);
    if (!win) return;
    win.maximized = !win.maximized;
    win.el.classList.toggle('maximized', win.maximized);
  }

  static focus(win) {
    win.el.style.zIndex = ++WindowManager.zTop;
    WindowManager.windows.forEach(w => w.el.classList.toggle('focused', w === win));
  }

  static topWindow() {
    let top = null, z = -1;
    WindowManager.windows.forEach(w => {
      if (w.minimized) return;
      const wz = parseInt(w.el.style.zIndex) || 0;
      if (wz > z) { z = wz; top = w; }
    });
    return top;
  }

  static isOpen(tab) { return WindowManager.windows.has(tab); }

  static updateRail() {
    document.querySelectorAll('.win-btn[data-tab]').forEach(btn => {
      btn.classList.toggle('open', WindowManager.windows.has(btn.dataset.tab));
    });
  }

  static setupDrag(win) {
    const titlebar = win.el.querySelector('.os-titlebar');
    let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
    titlebar.addEventListener('mousedown', (e) => {
      if (e.target.closest('.os-ctrl')) return;
      if (win.maximized) return;
      dragging = true; sx = e.clientX; sy = e.clientY;
      ox = parseInt(win.el.style.left); oy = parseInt(win.el.style.top);
      e.preventDefault();
    });
    document.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      win.el.style.left = Math.max(0, ox + e.clientX - sx) + 'px';
      win.el.style.top = Math.max(0, oy + e.clientY - sy) + 'px';
    });
    document.addEventListener('mouseup', () => { dragging = false; });
  }

  static setupResize(win) {
    const handle = win.el.querySelector('.os-resize-handle');
    let resizing = false, sx = 0, sy = 0, ow = 0, oh = 0;
    handle.addEventListener('mousedown', (e) => {
      if (win.maximized) return;
      resizing = true; sx = e.clientX; sy = e.clientY;
      ow = win.el.offsetWidth; oh = win.el.offsetHeight;
      e.preventDefault(); e.stopPropagation();
    });
    document.addEventListener('mousemove', (e) => {
      if (!resizing) return;
      win.el.style.width = Math.max(260, ow + e.clientX - sx) + 'px';
      win.el.style.height = Math.max(120, oh + e.clientY - sy) + 'px';
    });
    document.addEventListener('mouseup', () => { resizing = false; });
  }
}

// ==========================================================
// Module 7: MapRenderer — HoI4風詳細マップ描画 (provinces.bmp + 州データ)
// データソース: cbrzeczysz/hoi4-history (map/definition.csv, history/states/*.txt)
// ==========================================================
class MapRenderer {
  static canvas = null;
  static ctx = null;
  static ready = false;
  static cam = { x: 0, y: 0, scale: 0.4 };
  static srcCanvas = null;      // full-res provinces bitmap canvas
  static provinces = null;      // {terr:[], types:[], p:{id:[r,g,b,typeIdx,coastal,terrIdx]}}
  static states = null;        // {stateId:{name,owner,provinces,vp,b,supply}}
  static provToState = new Map();
  static colorToProv = new Map();  // u32 color -> province id
  static idMap = null;            // Uint16Array: pixel -> province id (0 = none)
  static mapW = 0; static mapH = 0;
  static stateCenter = new Map();  // stateId -> [x, y]
  static provCentroid = new Map(); // provId -> [x, y]
  static mode = 'political';
  static modeCache = {};          // mode -> canvas
  static selectedStateId = null;
  static selectedProvId = null;
  static nukeEffects = [];
  static MIN_SCALE = 0.15; static MAX_SCALE = 16;

  // HoI4風 地形パレット
  static TERRAIN_COLORS = {
    plains: [150, 160, 100], forest: [95, 120, 75], hills: [140, 122, 88],
    mountains: [122, 100, 84], desert: [196, 172, 110], marsh: [100, 118, 92],
    jungle: [80, 110, 60], urban: [130, 120, 115], tundra: [150, 150, 140],
    taiga: [100, 110, 100], steppe: [168, 158, 104], savanna: [160, 150, 90],
    ice: [220, 230, 235], lakes: [60, 110, 150], ocean: [40, 80, 110], unknown: [120, 120, 120]
  };

  static async init() {
    MapRenderer.canvas = document.getElementById('map-canvas');
    MapRenderer.ctx = MapRenderer.canvas.getContext('2d');
    MapRenderer.resize();
    window.addEventListener('resize', () => MapRenderer.resize());
    MapRenderer.setupModeToolbar();
    MapRenderer.setupInteraction();
    CoreEngine.registerTickCallback(() => MapRenderer.onTick());

    try {
      await MapRenderer.loadMapData();
      MapRenderer.buildPixelIndex();
      MapRenderer.buildAdjacency();   // 隣接マップ (前線スナップ用)
      MapRenderer.computeCentroids();
      MapRenderer.centerOn(CoreEngine.gameState.country);
      MapRenderer.ready = true;
      document.getElementById('map-loading').classList.add('hidden');
      MapRenderer.renderLegend();
      MapRenderer.startRenderLoop();
      ConstructionManager.onMapReady();
      BattlePlanManager.onMapReady();
    } catch (e) {
      console.error('MapRenderer init failed:', e);
      document.getElementById('map-loading-text').textContent =
        '地図データの読み込みに失敗しました: ' + e.message + ' — 他のウィンドウは利用可能です。';
      document.querySelector('#map-loading .spinner').style.display = 'none';
    }
  }

  static async loadMapData() {
    const [provData, stateData] = await Promise.all([
      DataFetcher.fetchJSON(DataFetcher.MAPDATA_PROVINCES),
      DataFetcher.fetchJSON(DataFetcher.MAPDATA_STATES)
    ]);
    if (!provData || !stateData) throw new Error('マップ定義JSONが見つかりません');
    MapRenderer.provinces = provData;
    MapRenderer.states = stateData;

    // province -> state lookup & color -> province lookup
    Object.entries(stateData).forEach(([sid, st]) => {
      st.provinces.forEach(pid => MapRenderer.provToState.set(pid, sid));
    });
    Object.entries(provData.p).forEach(([pid, p]) => {
      // BUG FIX: bit演算は符号付きint32になるため >>> 0 で unsigned に正規化する。
      // これがないと Uint32Array (常に正の値) のルックアップが一切一致せず、
      // 全ピクセルが「未認識」扱いになり陸地が描画されない。
      const key = ((255 << 24) | (p[2] << 16) | (p[1] << 8) | p[0]) >>> 0;
      MapRenderer.colorToProv.set(key, parseInt(pid));
    });

    // Load the official provinces bitmap (local first, then cbrzeczysz/hoi4-history raw)
    const loadBmp = (src, fallback) => new Promise((resolve, reject) => {
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = () => resolve(im);
      im.onerror = () => {
        if (fallback && src !== fallback) { im.src = fallback; }
        else reject(new Error('provinces.bmp の取得に失敗'));
      };
      im.src = src;
    });
    const img = await loadBmp(DataFetcher.MAP_BMP_URL, DataFetcher.MAP_BMP_URL_FALLBACK);
    MapRenderer.mapW = img.width; MapRenderer.mapH = img.height;
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    c.getContext('2d').drawImage(img, 0, 0);
    MapRenderer.srcCanvas = c;
  }

  static buildPixelIndex() {
    const img = MapRenderer.srcCanvas.getContext('2d').getImageData(0, 0, MapRenderer.mapW, MapRenderer.mapH);
    const src = new Uint32Array(img.data.buffer);
    const idMap = new Uint16Array(MapRenderer.mapW * MapRenderer.mapH);
    for (let i = 0; i < src.length; i++) {
      const pid = MapRenderer.colorToProv.get(src[i]);
      if (pid) idMap[i] = pid;
    }
    MapRenderer.idMap = idMap;
  }

  static computeCentroids() {
    // downsample 1/4 で走査し、プロビンス重心を算出
    const q = 4;
    const w = Math.floor(MapRenderer.mapW / q), h = Math.floor(MapRenderer.mapH / q);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(MapRenderer.srcCanvas, 0, 0, w, h);
    const data = c.getContext('2d').getImageData(0, 0, w, h).data;
    const sumX = new Map(), sumY = new Map(), cnt = new Map();
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        const u32 = ((255 << 24) | (data[i + 2] << 16) | (data[i + 1] << 8) | data[i]) >>> 0;
        const pid = MapRenderer.colorToProv.get(u32);
        if (!pid) continue;
        sumX.set(pid, (sumX.get(pid) || 0) + x);
        sumY.set(pid, (sumY.get(pid) || 0) + y);
        cnt.set(pid, (cnt.get(pid) || 0) + 1);
      }
    }
    cnt.forEach((n, pid) => {
      MapRenderer.provCentroid.set(pid, [sumX.get(pid) / n * q, sumY.get(pid) / n * q]);
    });
    // 州の中心 = 最大VPプロビンスの重心 or 平均
    Object.entries(MapRenderer.states).forEach(([sid, st]) => {
      let best = null, bestVp = -1;
      Object.keys(st.vp || {}).forEach(pid => {
        const v = st.vp[pid];
        if (v > bestVp && MapRenderer.provCentroid.has(parseInt(pid))) { bestVp = v; best = parseInt(pid); }
      });
      if (!best) {
        let sx = 0, sy = 0, n = 0;
        st.provinces.forEach(pid => {
          const cen = MapRenderer.provCentroid.get(pid);
          if (cen) { sx += cen[0]; sy += cen[1]; n++; }
        });
        if (n > 0) best = null, MapRenderer.stateCenter.set(sid, [sx / n, sy / n]);
      }
      if (best) MapRenderer.stateCenter.set(sid, MapRenderer.provCentroid.get(best));
    });
  }

  static ownerOf(pid) {
    const sid = MapRenderer.provToState.get(pid);
    if (!sid) return null;
    return (MapRenderer.states[sid] || {}).owner || null;
  }

  static stateOf(pid) { return MapRenderer.provToState.get(pid) || null; }

  static provinceAt(wx, wy) {
    if (!MapRenderer.idMap) return null;
    const x = Math.floor(wx), y = Math.floor(wy);
    if (x < 0 || y < 0 || x >= MapRenderer.mapW || y >= MapRenderer.mapH) return null;
    return MapRenderer.idMap[y * MapRenderer.mapW + x] || null;
  }

  static centerOn(tag) {
    // 指定国の州の中心座標にカメラを合わせる
    const centers = [];
    Object.entries(MapRenderer.states).forEach(([sid, st]) => {
      if (st.owner === tag) {
        const c = MapRenderer.stateCenter.get(sid);
        if (c) centers.push(c);
      }
    });
    if (centers.length === 0) return;
    let cx = 0, cy = 0;
    centers.forEach(c => { cx += c[0]; cy += c[1]; });
    cx /= centers.length; cy /= centers.length;
    const cw = MapRenderer.canvas.width, ch = MapRenderer.canvas.height;
    const scale = Math.max(1.5, Math.min(4, cw / 900));
    MapRenderer.cam.scale = scale;
    MapRenderer.cam.x = cw / 2 - cx * scale;
    MapRenderer.cam.y = ch / 2 - cy * scale;
  }

  static setupModeToolbar() {
    document.querySelectorAll('.map-mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        MapRenderer.setMode(btn.dataset.mode);
      });
    });
  }

  static setMode(mode) {
    MapRenderer.mode = mode;
    document.querySelectorAll('.map-mode-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === mode);
    });
    MapRenderer.renderLegend();
  }

  static invalidateModes() {
    MapRenderer.modeCache = {};
    MapRenderer.borderCache.clear(); // 占領で国境が変わるため再計算
  }

  // ---- プロビンス隣接マップ & 国境プロビンス (前線スナップ用) ----
  static provNeighbors = new Map();   // provId -> Set(隣接provId)
  static borderCache = new Map();     // playerTag -> [{pid, x, y}] 他国に面した自国陸地プロビンス

  static buildAdjacency() {
    // 全ピクセルを走査し隣接プロビンス対を収集
    const W = MapRenderer.mapW, H = MapRenderer.mapH, idm = MapRenderer.idMap;
    const nb = new Map();
    const add = (a, b) => {
      if (!a || !b || a === b) return;
      let s = nb.get(a);
      if (!s) { s = new Set(); nb.set(a, s); }
      s.add(b);
    };
    for (let y = 0; y < H; y++) {
      const row = y * W;
      for (let x = 0; x < W; x++) {
        const i = row + x, id = idm[i];
        if (!id) continue;
        if (x + 1 < W) add(id, idm[i + 1]);
        if (y + 1 < H) add(id, idm[i + W]);
      }
    }
    MapRenderer.provNeighbors = nb;
  }

  static isBorderProvince(pid, playerTag) {
    const typeNames = MapRenderer.provinces.types;
    const pd = MapRenderer.provinces.p[pid];
    if (!pd || typeNames[pd[3]] !== 'land') return false;       // 陸地のみ
    if (MapRenderer.ownerOf(pid) !== playerTag) return false;   // 自国領のみ
    const set = MapRenderer.provNeighbors.get(pid);
    if (!set) return false;
    for (const n of set) {
      const npd = MapRenderer.provinces.p[n];
      if (!npd || typeNames[npd[3]] !== 'land') continue;       // 海は除く (陸の国境のみ)
      const no = MapRenderer.ownerOf(n);
      if (no && no !== playerTag) return true;                  // 他国に面している
    }
    return false;
  }

  // 他国に面した自国プロビンス一覧 (前線設定の候補)
  static borderProvinceList(playerTag) {
    if (MapRenderer.borderCache.has(playerTag)) return MapRenderer.borderCache.get(playerTag);
    const list = [];
    Object.keys(MapRenderer.provinces.p).forEach(k => {
      const pid = parseInt(k);
      if (MapRenderer.isBorderProvince(pid, playerTag)) {
        const c = MapRenderer.provCentroid.get(pid);
        if (c) list.push({ pid: pid, x: c[0], y: c[1] });
      }
    });
    MapRenderer.borderCache.set(playerTag, list);
    return list;
  }

  // 他国に面した自国州ID一覧 (敵軍侵攻候補)
  static borderStateList(playerTag) {
    const sids = new Set();
    MapRenderer.borderProvinceList(playerTag).forEach(bp => {
      const sid = MapRenderer.provToState.get(bp.pid);
      if (sid) sids.add(String(sid));
    });
    return [...sids];
  }

  // 座標を最寄りの国境プロビンス重心へスナップ (maxDist以内)
  static snapToBorderProvince(pt, playerTag, maxDist) {
    const list = MapRenderer.borderProvinceList(playerTag);
    let best = null, bestD = maxDist || 120;
    list.forEach(bp => {
      const d = Math.hypot(bp.x - pt[0], bp.y - pt[1]);
      if (d < bestD) { bestD = d; best = bp; }
    });
    return best ? [best.x, best.y] : null;
  }

  // ---- 州同士の陸地隣接関係 (攻撃チェーン・AI戦争で使用) — 所有の変化に依存しないためキャッシュ可 ----
  static stateAdjacency = null;
  static buildStateAdjacency() {
    if (MapRenderer.stateAdjacency) return MapRenderer.stateAdjacency;
    const adj = new Map();
    const add = (a, b) => {
      if (!adj.has(a)) adj.set(a, new Set());
      adj.get(a).add(b);
    };
    if (MapRenderer.provNeighbors) {
      const typeNames = MapRenderer.provinces.types;
      MapRenderer.provNeighbors.forEach((set, pid) => {
        const sA = MapRenderer.provToState.get(pid);
        if (sA == null) return;
        set.forEach(n => {
          const npd = MapRenderer.provinces.p[n];
          if (!npd || typeNames[npd[3]] !== 'land') return;   // 陸の国境のみ
          const sB = MapRenderer.provToState.get(n);
          if (sB == null || sB === sA) return;
          add(String(sA), String(sB));
          add(String(sB), String(sA));
        });
      });
    }
    MapRenderer.stateAdjacency = adj;
    return adj;
  }

  // ---- マップモードごとのキャンバスを生成 (州の所有色・地形・境界線描画) ----
  static getModeCanvas(mode) {
    if (MapRenderer.modeCache[mode]) return MapRenderer.modeCache[mode];
    const W = MapRenderer.mapW, H = MapRenderer.mapH;
    const srcImg = MapRenderer.srcCanvas.getContext('2d').getImageData(0, 0, W, H);
    const src = new Uint32Array(srcImg.data.buffer);
    const out = new Uint32Array(src.length);
    const idMap = MapRenderer.idMap;
    const player = CoreEngine.gameState.country;
    const states = MapRenderer.states;
    const provToState = MapRenderer.provToState;

    // プロビンスごとの塗り色 (u32) を事前計算
    const provColor = new Uint32Array(14000);
    const p = MapRenderer.provinces.p;
    const terrNames = MapRenderer.provinces.terr;
    const typeNames = MapRenderer.provinces.types;
    Object.entries(p).forEach(([pid, pd]) => {
      const id = parseInt(pid);
      const type = typeNames[pd[3]];
      let rgb;
      if (mode === 'terrain') {
        const tc = MapRenderer.TERRAIN_COLORS[terrNames[pd[5]]] || MapRenderer.TERRAIN_COLORS.unknown;
        rgb = (type === 'sea') ? [38, 70, 100] : (type === 'lake') ? [50, 90, 130] : tc;
      } else if (mode === 'political' || mode === 'construction' || mode === 'air' || mode === 'naval') {
        if (type === 'sea') rgb = [30, 58, 82];
        else if (type === 'lake') rgb = [42, 76, 110];
        else {
          const owner = MapRenderer.ownerOf(id);
          if (owner) rgb = DataFetcher.countryColor(owner);
          else rgb = [110, 110, 100];
          // 地形による濃淡 (HoI4風の質感)
          const shade = 0.82 + ((pd[5] * 7) % 5) * 0.09;
          rgb = [Math.min(255, rgb[0] * shade) | 0, Math.min(255, rgb[1] * shade) | 0, Math.min(255, rgb[2] * shade) | 0];
          if (mode !== 'political' && owner !== player) {
            rgb = [rgb[0] * 0.55 | 0, rgb[1] * 0.55 | 0, rgb[2] * 0.55 | 0];
            if (mode === 'air' && owner) rgb = [rgb[0], rgb[1] * 0.5 | 0, rgb[2] * 0.5 | 0];
          }
        }
      } else if (mode === 'supply') {
        if (type === 'sea') rgb = [24, 46, 66];
        else if (type === 'lake') rgb = [42, 76, 110];
        else {
          const sid = provToState.get(id);
          const st = sid ? states[sid] : null;
          const sup = st ? (st.supply || 0) : 0;
          const owner = st ? st.owner : null;
          if (owner !== player) rgb = [70, 70, 70];
          else {
            const t = Math.min(1, sup / 12);
            rgb = [160 - t * 140 | 0, 60 + t * 120 | 0, 60];
          }
        }
      } else rgb = [100, 100, 100];

      provColor[id] = (255 << 24) | (rgb[2] << 16) | (rgb[1] << 8) | rgb[0];
    });

    // 州ごとの所有者 (州境・国境判定用)
    const stateOwner = new Map(Object.entries(states).map(([sid, st]) => [sid, st.owner]));

    for (let y = 0; y < H; y++) {
      const row = y * W;
      for (let x = 0; x < W; x++) {
        const i = row + x;
        const id = idMap[i];
        if (!id) { out[i] = (255 << 24) | (82 << 16) | (58 << 8) | 30; continue; }
        let c = provColor[id];

        // 境界線: 右・下の隣接ピクセルと比較 (プロビンス/州/国境)
        const rId = x + 1 < W ? idMap[i + 1] : 0;
        const dId = y + 1 < H ? idMap[i + W] : 0;
        if (rId !== id || dId !== id) {
          const nb = rId !== id ? rId : dId;
          if (nb) {
            const sA = provToState.get(id), sB = provToState.get(nb);
            const oA = sA ? stateOwner.get(sA) : null, oB = sB ? stateOwner.get(sB) : null;
            const isSea = typeNames[p[id][3]] === 'sea' || typeNames[p[nb][3]] === 'sea';
            let dark;
            if (oA !== oB && sA !== sB) dark = isSea ? 0.35 : 0.55;      // 国境 (太く暗く)
            else if (sA !== sB) dark = 0.3;                               // 州境
            else dark = 0.13;                                             // プロビンス境
            const r = c & 255, g = (c >> 8) & 255, b = (c >> 16) & 255;
            const f = 1 - dark;
            c = (255 << 24) | (((b * f) | 0) << 16) | (((g * f) | 0) << 8) | ((r * f) | 0);
          }
        }
        out[i] = c;
      }
    }

    const modeCanvas = document.createElement('canvas');
    modeCanvas.width = W; modeCanvas.height = H;
    const mctx = modeCanvas.getContext('2d');
    const outImg = mctx.createImageData(W, H);
    new Uint32Array(outImg.data.buffer).set(out);
    mctx.putImageData(outImg, 0, 0);
    MapRenderer.modeCache[mode] = modeCanvas;
    return modeCanvas;
  }

  static resize() {
    if (!MapRenderer.canvas) return;
    MapRenderer.canvas.width = MapRenderer.canvas.offsetWidth;
    MapRenderer.canvas.height = MapRenderer.canvas.offsetHeight;
  }

  static setupInteraction() {
    const c = MapRenderer.canvas;
    let panning = false, moved = 0, sx = 0, sy = 0, lx = 0, ly = 0;
    let rightMoved = 0, rightDown = false;

    c.addEventListener('mousedown', (e) => {
      if (e.button === 0) {
        panning = true; moved = 0;
        sx = lx = e.clientX; sy = ly = e.clientY;
      } else if (e.button === 2) {
        rightDown = true; rightMoved = 0;
        const wp = MapRenderer.screenToWorld(e.offsetX, e.offsetY);
        if (e.shiftKey) BattlePlanManager.startArrowDrag(wp);
        else BattlePlanManager.startFrontDrag(wp);
      }
    });
    c.addEventListener('mousemove', (e) => {
      if (panning) {
        const dx = e.clientX - lx, dy = e.clientY - ly;
        moved += Math.abs(dx) + Math.abs(dy);
        MapRenderer.cam.x += dx; MapRenderer.cam.y += dy;
        lx = e.clientX; ly = e.clientY;
      } else if (rightDown && BattlePlanManager.dragMode) {
        rightMoved += Math.abs(e.movementX || 0) + Math.abs(e.movementY || 0);
        BattlePlanManager.onDragMove(MapRenderer.screenToWorld(e.offsetX, e.offsetY));
      }
      // 戦闘マーカーのホバーツールチップ
      BattleManager.handleHover(e.clientX, e.clientY);
    });
    c.addEventListener('mouseup', (e) => {
      if (e.button === 0 && panning) {
        panning = false;
        if (moved < 6) {
          const wp = MapRenderer.screenToWorld(e.offsetX, e.offsetY);
          const pid = MapRenderer.provinceAt(wp[0], wp[1]);
          if (!pid) return;
          // 海軍/空軍モード: クリックだけで任務海域・空域を指定
          if (BattlePlanManager.activeForce !== 'army') {
            BattlePlanManager.handleZoneClick(pid, wp);
          }
          MapRenderer.selectProvince(pid);
        }
      } else if (e.button === 2) {
        const wasDragMode = BattlePlanManager.dragMode;
        if (wasDragMode) BattlePlanManager.endDrag();
        // 右クリック (ドラッグなし) で他国の領土なら外交画面を開く
        if (rightDown && rightMoved < 6) {
          const wp = MapRenderer.screenToWorld(e.offsetX, e.offsetY);
          const pid = MapRenderer.provinceAt(wp[0], wp[1]);
          const owner = pid ? MapRenderer.ownerOf(pid) : null;
          const player = CoreEngine.gameState.country;
          if (owner && owner !== player) DiplomacyManager.openFor(owner);
        }
        rightDown = false;
      }
    });
    c.addEventListener('mouseleave', () => {
      panning = false;
      if (BattlePlanManager.dragMode) BattlePlanManager.endDrag();
    });
    c.addEventListener('contextmenu', (e) => e.preventDefault());
    c.addEventListener('wheel', (e) => {
      e.preventDefault();
      const cam = MapRenderer.cam;
      const factor = e.deltaY > 0 ? 0.85 : 1.18;
      const wx = (e.offsetX - cam.x) / cam.scale, wy = (e.offsetY - cam.y) / cam.scale;
      cam.scale = Math.max(MapRenderer.MIN_SCALE, Math.min(MapRenderer.MAX_SCALE, cam.scale * factor));
      cam.x = e.offsetX - wx * cam.scale;
      cam.y = e.offsetY - wy * cam.scale;
    }, { passive: false });
  }

  static screenToWorld(sx, sy) {
    const cam = MapRenderer.cam;
    return [(sx - cam.x) / cam.scale, (sy - cam.y) / cam.scale];
  }

  static worldToScreen(wx, wy) {
    const cam = MapRenderer.cam;
    return [wx * cam.scale + cam.x, wy * cam.scale + cam.y];
  }

  static selectProvince(pid) {
    MapRenderer.selectedProvId = pid;
    const sid = MapRenderer.stateOf(pid);
    MapRenderer.selectedStateId = sid;
    const st = sid ? MapRenderer.states[sid] : null;
    const pd = MapRenderer.provinces.p[pid];
    const terr = pd ? MapRenderer.provinces.terr[pd[5]] : '不明';
    const coastal = pd && pd[4] ? '沿岸' : '内陸';
    const overlay = document.getElementById('map-info-overlay');
    if (st) {
      const owner = st.owner || '無所属';
      const b = st.b || {};
      overlay.innerHTML =
        '<strong>' + DataFetcher.getCountryFlag(owner) + ' ' + st.name + '</strong><br>' +
        '<span style="color:var(--text-secondary);font-size:11px;">所有国: ' + owner + ' | 州ID: ' + sid + '</span><br>' +
        '<span style="color:var(--text-secondary);font-size:11px;">地形: ' + terr + ' (' + coastal + ') | 補給: ' + (st.supply || 0) + '</span><br>' +
        '<span style="color:var(--text-gold);font-size:11px;">🏭民需' + (b.industrial_complex || 0) +
        ' ⚙️軍需' + (b.arms_factory || 0) + ' ⚓工廠' + (b.dockyard || 0) +
        ' ✈️飛行場' + (b.air_base || 0) + ' 🛤️' + (b.infrastructure || 0) + '</span>';
      ConstructionManager.selectState(sid);
    } else {
      overlay.innerHTML = '<strong>海域</strong><br><span style="color:var(--text-secondary);font-size:11px;">プロビンスID: ' + pid + '</span>';
    }
  }

  static annexCountry(tag) {
    const player = CoreEngine.gameState.country;
    let count = 0;
    Object.values(MapRenderer.states).forEach(st => {
      if (st.owner === tag) { st.owner = player; count++; }
    });
    MapRenderer.invalidateModes();
    return count;
  }

  static captureState(sid, newOwner) {
    const st = MapRenderer.states[sid];
    if (!st) return false;
    st.owner = newOwner;
    MapRenderer.invalidateModes();
    return true;
  }

  static addNukeEffectAtState(sid) {
    const c = MapRenderer.stateCenter.get(String(sid));
    if (c) MapRenderer.nukeEffects.push({ x: c[0], y: c[1], life: 0, maxLife: 120 });
  }

  static startRenderLoop() {
    const loop = () => {
      if (MapRenderer.ready) MapRenderer.render();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  static render() {
    if (!MapRenderer.ctx || !MapRenderer.ready) return;
    const ctx = MapRenderer.ctx;
    const cam = MapRenderer.cam;
    ctx.fillStyle = '#0d1419';
    ctx.fillRect(0, 0, MapRenderer.canvas.width, MapRenderer.canvas.height);

    let modeCanvas = MapRenderer.modeCache[MapRenderer.mode];
    if (!modeCanvas) modeCanvas = MapRenderer.getModeCanvas(MapRenderer.mode);

    ctx.imageSmoothingEnabled = cam.scale < 1.5;
    ctx.drawImage(modeCanvas, cam.x, cam.y, MapRenderer.mapW * cam.scale, MapRenderer.mapH * cam.scale);

    // 州名ラベル (ズームイン時)
    if (cam.scale >= 2.2 && (MapRenderer.mode === 'political' || MapRenderer.mode === 'construction')) {
      ctx.font = Math.max(9, Math.min(13, 11 / cam.scale * 2)) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      MapRenderer.stateCenter.forEach((c, sid) => {
        const st = MapRenderer.states[sid];
        if (!st) return;
        const s = MapRenderer.worldToScreen(c[0], c[1]);
        ctx.fillText(st.name, s[0] + 1, s[1] + 1);
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.fillText(st.name, s[0], s[1]);
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
      });
    }

    // 建設マップモード: 自国州の建物アイコン表示
    if (MapRenderer.mode === 'construction') {
      const player = CoreEngine.gameState.country;
      MapRenderer.stateCenter.forEach((c, sid) => {
        const st = MapRenderer.states[sid];
        if (!st || st.owner !== player) return;
        const b = st.b || {};
        const icons = [];
        if (b.industrial_complex) icons.push('🏭' + b.industrial_complex);
        if (b.arms_factory) icons.push('⚙️' + b.arms_factory);
        if (b.dockyard) icons.push('⚓' + b.dockyard);
        if (b.air_base) icons.push('✈️' + b.air_base);
        if (!icons.length) return;
        const s = MapRenderer.worldToScreen(c[0], c[1]);
        if (s[0] < -60 || s[1] < -30 || s[0] > MapRenderer.canvas.width + 60 || s[1] > MapRenderer.canvas.height + 30) return;
        ctx.font = Math.max(10, Math.min(16, 12 / cam.scale)) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        const txt = icons.join(' ');
        const tw = ctx.measureText(txt).width;
        ctx.fillRect(s[0] - tw / 2 - 3, s[1] - 6, tw + 6, 16);
        ctx.fillStyle = '#fff';
        ctx.fillText(txt, s[0], s[1] + 6);
      });
      // 建設中の州を緑で強調表示
      ConstructionManager.queue.forEach(item => {
        const c = MapRenderer.stateCenter.get(String(item.stateId));
        if (!c) return;
        const s = MapRenderer.worldToScreen(c[0], c[1]);
        ctx.strokeStyle = 'rgba(74,196,106,0.9)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(s[0], s[1], 14, 0, Math.PI * 2);
        ctx.stroke();
      });
    }

    // 選択州の強調
    if (MapRenderer.selectedStateId && MapRenderer.stateCenter.has(MapRenderer.selectedStateId)) {
      const c = MapRenderer.stateCenter.get(MapRenderer.selectedStateId);
      const s = MapRenderer.worldToScreen(c[0], c[1]);
      const pulse = 10 + Math.sin(Date.now() / 300) * 4;
      ctx.strokeStyle = '#d4a843';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(s[0], s[1], pulse, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 前線・攻撃矢印・師団マーカー描画
    BattlePlanManager.drawOverlay(ctx, MapRenderer.cam, MapRenderer.worldToScreen);

    // 戦闘マーカー (優勢=緑 / 均等=黄 / 劣勢=赤)
    BattleManager.draw(ctx, MapRenderer.worldToScreen);

    // 核攻撃エフェクト
    MapRenderer.nukeEffects.forEach(n => {
      const prog = n.life / n.maxLife;
      const s = MapRenderer.worldToScreen(n.x, n.y);
      const radius = prog * 70;
      ctx.strokeStyle = 'rgba(255,' + (Math.floor(120 * (1 - prog))) + ',0,' + (1 - prog) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(s[0], s[1], radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(220,220,220,' + ((1 - prog) * 0.45) + ')';
      ctx.beginPath();
      ctx.arc(s[0], s[1] - radius * 0.4, radius * 0.35, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  static renderLegend() {
    const legends = {
      political: [['#5a5a5a','自国 (ドイツ)'],['#b22222','ソ連'],['#506eaa','連合国'],['#64964a','イタリア'],['#443a52','海']],
      terrain: [['#96a064','平原'],['#5f784b','森林'],['#8c7a58','丘陵'],['#7a6454','山岳'],['#647660','湿地'],['#c4ac6e','砂漠']],
      construction: [['#96a064','自国 (建設可能)'],['#404040','他国'],['#4ac46a','建設中の州']],
      supply: [['#a03c3c','補給不足'],['#7c9040','普通'],['#3cc464','補給良好']],
      air: [['#404040','制空権なし'],['#506eaa','自国空域']],
      naval: [['#1e3a52','海域'],['#404040','他国沿岸']]
    };
    const items = legends[MapRenderer.mode] || [];
    document.getElementById('map-legend').innerHTML =
      items.map(l => '<div class="map-legend-item"><div class="map-legend-color" style="background:' + l[1] + '"></div>' + l[0] + '</div>').join('') +
      '<div style="margin-top:4px;font-size:10px;color:var(--text-secondary);">cbrzeczysz/hoi4-history 公式マップデータ</div>';
  }

  static onTick() {
    MapRenderer.nukeEffects = MapRenderer.nukeEffects.filter(n => {
      n.life++;
      return n.life < n.maxLife;
    });
    BattlePlanManager.onTick();
  }
}

// ==========================================================
// Module 8: BattlePlanManager — 前線・攻撃作戦指揮 (Frontline & Offensive)
// ==========================================================
class BattlePlanManager {
  static armies = [];
  static selectedArmyId = null;
  static dragMode = null;      // 'front' | 'arrow' | 'area'
  static dragPoints = [];
  // ---- 海軍/空軍オーダー (DLC拡張): 陸軍と同じマップ操作で哨戒・攻撃エリアを設定 ----
  static activeForce = 'army';   // 'army' | 'navy' | 'air'
  static navy = [];
  static air = [];
  static selectedUnitId = null;
  static missions = {
    navy: [{ id: 'patrol', label: '哨戒' }, { id: 'strike', label: '攻撃' }, { id: 'escort', label: '通商護衛' }, { id: 'shore', label: '艦砲射撃' }],
    air: [{ id: 'air_sup', label: '制空' }, { id: 'ground', label: '対地攻撃' }, { id: 'patrol', label: '哨戒' }, { id: 'strategic', label: '戦略爆撃' }]
  };
  static activeMission = { navy: 'patrol', air: 'air_sup' };

  static setForce(f) {
    BattlePlanManager.activeForce = f;
    if (f === 'army' && !BattlePlanManager.selectedArmyId) BattlePlanManager.selectedArmyId = (BattlePlanManager.armies[0] || {}).id || null;
    if (f !== 'army') {
      const units = f === 'navy' ? BattlePlanManager.navy : BattlePlanManager.air;
      if (!BattlePlanManager.selectedUnitId && units.length) BattlePlanManager.selectedUnitId = units[0].id;
    }
    BattlePlanManager.renderPanel();
  }

  static selectedUnit() {
    const units = BattlePlanManager.activeForce === 'navy' ? BattlePlanManager.navy : BattlePlanManager.air;
    return units.find(u => u.id === BattlePlanManager.selectedUnitId) || null;
  }

  static selectUnit(id) {
    BattlePlanManager.selectedUnitId = id;
    BattlePlanManager.renderPanel();
  }

  static setMission(m) {
    BattlePlanManager.activeMission[BattlePlanManager.activeForce] = m;
  }

  static setupNavalAir() {
    const player = CoreEngine.gameState.country;
    const centers = Object.values(MapRenderer.states)
      .filter(st => st.owner === player)
      .map(st => MapRenderer.stateCenter.get(Object.keys(st.vp || {})[0]))
      .filter(Boolean);
    const base = centers[0] || [MapRenderer.mapW / 2, MapRenderer.mapH / 2];
    // 艦隊 ×2 / 航空集団 ×2
    BattlePlanManager.navy = [1, 2].map(i => ({
      id: 'nav' + i, name: '第' + i + '艦隊', type: 'navy', base: [base[0] + i * 40, base[1] + 60],
      area: null, target: null, mission: 'patrol', executing: false, progress: 0, strength: 100
    }));
    BattlePlanManager.air = [1, 2].map(i => ({
      id: 'air' + i, name: '第' + i + '航空集団', type: 'air', base: [base[0] - i * 40, base[1] - 60],
      area: null, target: null, mission: 'air_sup', executing: false, progress: 0, strength: 100
    }));
  }

  static init() {
    BattlePlanManager.renderPanel();
  }

  static onMapReady() {
    // 自国の州から2個軍集団を編成 (師団は CoreEngine.gameState.divisions から配分)
    BattlePlanManager.armies = [];
    const player = CoreEngine.gameState.country;
    const homeStates = Object.entries(MapRenderer.states)
      .filter(([sid, st]) => st.owner === player)
      .sort((a, b) => Math.max(0, ...Object.values(b[1].vp || {})) - Math.max(0, ...Object.values(a[1].vp || {})));
    const centers = homeStates.map(([sid]) => MapRenderer.stateCenter.get(sid)).filter(Boolean);
    const divs = CoreEngine.gameState.divisions;
    const perArmy = Math.max(1, Math.floor(divs / 2));
    for (let a = 0; a < 2; a++) {
      const base = centers[a % Math.max(1, centers.length)] || [MapRenderer.mapW / 2, MapRenderer.mapH / 2];
      BattlePlanManager.armies.push({
        id: a + 1, name: '第' + (a + 1) + '軍集団', base: base,
        divisions: Array.from({ length: perArmy }, (_, i) => ({
          id: a * perArmy + i + 1, org: 60, maxOrg: 60,
          x: base[0] + (i - perArmy / 2) * 8, y: base[1] + (i % 3) * 8
        })),
        frontline: null, arrow: null, executing: false, progress: 0, targetState: null
      });
    }
    BattlePlanManager.selectedArmyId = 1;
    BattlePlanManager.setupNavalAir();
    BattlePlanManager.renderPanel();
  }

  static selectArmy(id) {
    BattlePlanManager.selectedArmyId = id;
    BattlePlanManager.renderPanel();
  }

  static selectedArmy() {
    return BattlePlanManager.armies.find(a => a.id === BattlePlanManager.selectedArmyId) || null;
  }

  // ---- 攻撃チェーン構築: 前線 (自国領に隣接する敵州) から目標州まで、
  //      陸路で連続する敵州のみを辿る。飛び地・中立国経由は不可。 ----
  static buildAttackChain(targetSid) {
    MapRenderer.buildStateAdjacency();
    const player = CoreEngine.gameState.country;
    const gs = CoreEngine.gameState;
    const states = MapRenderer.states;
    if (!states[targetSid]) return [];
    // 目標から逆方向に BFS: 自国領 or 開戦済みの敵領のみ通過できる
    const prev = new Map();
    prev.set(targetSid, null);
    const q = [targetSid];
    while (q.length) {
      const cur = q.shift();
      (MapRenderer.stateAdjacency.get(String(cur)) || []).forEach(n => {
        if (prev.has(n)) return;
        const st = states[n];
        if (!st) return;
        if (st.owner === player || gs.atWar.includes(st.owner)) {
          prev.set(n, cur);
          q.push(n);
        }
        // 中立国・自国以外の味方領は通れない (飛び地跳躍の防止)
      });
    }
    // チェーンの起点 = 「自国領に隣接する敵州」のうち目標までが最短の州。
    // これが無ければ前線から陸路で到達できない (飛び地) ので攻撃不可。
    let bestStart = null, bestLen = Infinity;
    prev.forEach((p, n) => {
      if (!states[n] || states[n].owner === player) return;
      // 起点は自国領に直接隣接していなければならない (前線から広げる)
      const nbrs = MapRenderer.stateAdjacency.get(String(n)) || [];
      const touchesPlayer = [...nbrs].some(m => states[m] && states[m].owner === player);
      if (!touchesPlayer) return;
      let len = 0, c = n;
      while (c !== null && c !== targetSid) { c = prev.get(c); len++; }
      if (len < bestLen) { bestLen = len; bestStart = n; }
    });
    if (bestStart == null) return [];   // 前線から陸路で到達できない = 飛び地
    const chain = [];
    let c = bestStart;
    while (c != null) { chain.push(c); c = prev.get(c); }
    return chain;   // [最初に攻める敵州, ..., 目標州] — 前線から段階的に進撃
  }

  // ---- 前線描画 (右ドラッグ) / 海軍・空軍: マップクリックで任務海域・空域を指定 ----
  static startFrontDrag(worldPt) {
    if (BattlePlanManager.activeForce === 'army') {
      const army = BattlePlanManager.selectedArmy();
      if (!army) { GameUI.notify('軍集団パネルから軍集団を選択してください。', 'alert'); return; }
      BattlePlanManager.dragMode = 'front';
    } else {
      // 海軍/空軍はドラッグではなく海域・空域の左クリックで指定する
      const unit = BattlePlanManager.selectedUnit();
      if (!unit) { GameUI.notify('パネルから部隊を選択してください。', 'alert'); return; }
      GameUI.notify(unit.type === 'navy' ? '⚓ 海域を左クリックして任務を割り当ててください。' : '✈️ 空域を左クリックして行動を指示してください。', 'alert');
      return;
    }
    BattlePlanManager.dragPoints = [worldPt];
  }

  // ---- 海軍/空軍: 海域・空域クリック → 任務割り当て + 紹介ウィンドウ ----
  static handleZoneClick(pid, wp) {
    const unit = BattlePlanManager.selectedUnit();
    if (!unit) return false;
    const typeNames = MapRenderer.provinces.types;
    const pd = MapRenderer.provinces.p[pid];
    const type = pd ? typeNames[pd[3]] : null;
    if (unit.type === 'navy' && type !== 'sea' && type !== 'lake') {
      GameUI.notify('⚓ 海軍は海域をクリックしてください (陸地は割り当てできません)。', 'alert');
      return false;
    }
    unit.zone = { pid: pid, x: wp[0], y: wp[1], mission: BattlePlanManager.activeMission[unit.type] };
    unit.area = null; unit.target = null; unit.executing = false; unit.progress = 0;
    BattlePlanManager.showZoneInfo(unit, pid);
    CoreEngine.log(unit.name + 'を' + (unit.type === 'navy' ? '海域' : '空域') + ' (プロビンス' + pid + ') に配備しました。');
    MultiplayerManager.broadcast({ type: 'force_zone', force: unit.type, id: unit.id, zone: unit.zone });
    return true;
  }

  // ---- 海域・空域の紹介ウィンドウ ----
  static showZoneInfo(unit, pid) {
    const typeNames = MapRenderer.provinces.types;
    const pd = MapRenderer.provinces.p[pid];
    const type = pd ? typeNames[pd[3]] : '不明';
    const terr = pd ? MapRenderer.provinces.terr[pd[5]] : '不明';
    const isSea = type === 'sea' || type === 'lake';
    const unitsHere = [...BattlePlanManager.navy, ...BattlePlanManager.air].filter(u => u.zone && u.zone.pid === pid);
    const html =
      '<div style="text-align:center;margin-bottom:10px;font-size:34px;">' + (isSea ? '🌊' : '☁️') + '</div>' +
      '<h3 style="color:var(--text-gold);text-align:center;margin-bottom:8px;">' + (isSea ? '海域' : '空域') + ' プロビンス ' + pid + '</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);text-align:center;margin-bottom:10px;">' +
      (isSea
        ? '艦隊を配備できる海域です。哨戒・攻撃・通商護衛の任務を実行できます。'
        : '航空部隊を行動させる空域です。制空・対地攻撃・哨戒の任務を実行できます。') +
      '</p>' +
      '<div style="background:var(--bg-panel-light);border:1px solid var(--border-mil);border-radius:8px;padding:10px;font-size:12px;line-height:1.8;">' +
      '<div>種別: ' + (isSea ? '🌊 海域 (' + type + ')' : '☁️ 空域 (陸上)') + '</div>' +
      '<div>地形: ' + terr + ' / 沿岸: ' + (pd && pd[4] ? 'はい' : 'いいえ') + '</div>' +
      '<div>配備中: ' + (unitsHere.length
        ? unitsHere.map(u => u.name + ' (' + (BattlePlanManager.missions[u.type].find(m => m.id === u.zone.mission) || {}).label + ')').join(', ')
        : 'なし') + '</div>' +
      '</div>' +
      '<div style="margin-top:10px;text-align:center;">' +
      '<button class="army-btn" onclick="BattlePlanManager.execute(\'' + unit.id + '\')">▶ この' + (isSea ? '海域' : '空域') + 'で任務開始</button> ' +
      '<button class="army-btn" style="background:var(--bg-panel-light)" onclick="BattlePlanManager.clearFront(\'' + unit.id + '\')">✕ 解除</button>' +
      '</div>';
    GameUI.openModal('⚓ ' + unit.name + ' — ' + (isSea ? '海域' : '空域') + '情報', html);
  }

  // ---- 攻撃矢印 (Shift+右ドラッグ) / 海軍・空軍: 攻撃目標の指定 ----
  static startArrowDrag(worldPt) {
    if (BattlePlanManager.activeForce === 'army') {
      const army = BattlePlanManager.selectedArmy();
      if (!army) { GameUI.notify('軍集団パネルから軍集団を選択してください。', 'alert'); return; }
    } else {
      const unit = BattlePlanManager.selectedUnit();
      if (!unit) { GameUI.notify('パネルから部隊を選択してください。', 'alert'); return; }
    }
    BattlePlanManager.dragMode = 'arrow';
    BattlePlanManager.dragPoints = [worldPt];
  }

  static onDragMove(worldPt) {
    const last = BattlePlanManager.dragPoints[BattlePlanManager.dragPoints.length - 1];
    const d = Math.hypot(worldPt[0] - last[0], worldPt[1] - last[1]);
    if (d > 6) BattlePlanManager.dragPoints.push(worldPt);
  }

  static endDrag() {
    const isLand = BattlePlanManager.activeForce === 'army';
    const unit = isLand ? null : BattlePlanManager.selectedUnit();
    if ((isLand ? !BattlePlanManager.selectedArmy() : !unit) || BattlePlanManager.dragPoints.length < 2) {
      BattlePlanManager.dragMode = null;
      return;
    }
    if (BattlePlanManager.dragMode === 'area') {
      // 海軍/空軍: ドラッグ2点を対角とする矩形エリア (哨戒・制空・攻撃範囲)
      const a = BattlePlanManager.dragPoints[0], b = BattlePlanManager.dragPoints[BattlePlanManager.dragPoints.length - 1];
      const anyProv = MapRenderer.provinceAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
      if (!anyProv) {
        GameUI.notify('エリアは地図上で描画してください。', 'alert');
      } else {
        unit.area = { x1: Math.min(a[0], b[0]), y1: Math.min(a[1], b[1]), x2: Math.max(a[0], b[0]), y2: Math.max(a[1], b[1]) };
        unit.mission = BattlePlanManager.activeMission[BattlePlanManager.activeForce];
        unit.progress = 0;
        const mLabel = (BattlePlanManager.missions[BattlePlanManager.activeForce].find(m => m.id === unit.mission) || {}).label;
        CoreEngine.log(unit.name + 'に' + mLabel + 'エリアを設定しました。');
        GameUI.notify('エリア設定完了 (' + mLabel + ') — ▶ ミッション開始で実行');
        MultiplayerManager.broadcast({ type: 'force_area', force: unit.type, id: unit.id, area: unit.area, mission: unit.mission });
      }
    } else if (BattlePlanManager.dragMode === 'front') {
      // 前線は「他国に面した自国領土」にしか置けない。
      // ドラッグ点を国境プロビンス (自国領 & 陸の国境あり) に自動スナップする。
      const player = CoreEngine.gameState.country;
      const snapped = [];
      let dropped = 0;
      BattlePlanManager.dragPoints.forEach(pt => {
        const pid = MapRenderer.provinceAt(pt[0], pt[1]);
        let pt2 = null;
        if (pid && MapRenderer.isBorderProvince(pid, player)) {
          const c = MapRenderer.provCentroid.get(pid);
          if (c) pt2 = c.slice();
        } else {
          // 国境外の点は最寄りの国境プロビンスへスナップ (近すぎる点は破棄)
          pt2 = MapRenderer.snapToBorderProvince(pt, player, 90);
          if (pt2) dropped++;
        }
        if (pt2) {
          const last = snapped[snapped.length - 1];
          if (!last || Math.hypot(last[0] - pt2[0], last[1] - pt2[1]) > 4) snapped.push(pt2);
        }
      });
      if (snapped.length < 2) {
        GameUI.notify('前線は他国に面した自国領土にのみ設定できます。', 'alert');
      } else {
        const army = BattlePlanManager.selectedArmy();
        army.frontline = snapped;
        CoreEngine.log(army.name + 'の前線を国境に設定しました (' + snapped.length + '点' + (dropped ? ' / ' + dropped + '点をスナップ' : '') + ')。');
        GameUI.notify('前線設定完了 (国境にスナップ' + (dropped ? ' — ' + dropped + '点補正' : '') + ') — Shift+右ドラッグで攻撃矢印を描けます', 'success');
        MultiplayerManager.broadcast({ type: 'battle_front', army: army.id, points: snapped });
      }
    } else if (BattlePlanManager.dragMode === 'arrow') {
      const to = BattlePlanManager.dragPoints[BattlePlanManager.dragPoints.length - 1];
      const toPid = MapRenderer.provinceAt(to[0], to[1]);
      if (!isLand) {
        // 海軍/空軍: 攻撃・爆撃目標 (海域プロビンスも可)
        if (!toPid) { GameUI.notify('攻撃目標は地図上のプロビンスに指定してください。', 'alert'); }
        else {
          unit.target = { pid: toPid, x: to[0], y: to[1] };
          unit.mission = BattlePlanManager.activeMission[BattlePlanManager.activeForce];
          unit.progress = 0;
          const mLabel = (BattlePlanManager.missions[BattlePlanManager.activeForce].find(m => m.id === unit.mission) || {}).label;
          CoreEngine.log(unit.name + 'の' + mLabel + '目標を設定しました。');
          GameUI.notify('目標設定完了 (' + mLabel + ')', 'success');
          MultiplayerManager.broadcast({ type: 'force_target', force: unit.type, id: unit.id, pid: toPid, mission: unit.mission });
        }
      } else {
        const army = BattlePlanManager.selectedArmy();
        const from = army.frontline
          ? army.frontline[Math.floor(army.frontline.length / 2)]
          : BattlePlanManager.dragPoints[0];
        const sid = toPid ? MapRenderer.stateOf(toPid) : null;
        const target = sid ? MapRenderer.states[sid] : null;
        if (!target) { GameUI.notify('攻撃目標は陸上の州に指定してください。', 'alert'); }
        else if (target.owner === CoreEngine.gameState.country) {
          GameUI.notify('自国の州は攻撃目標にできません。', 'alert');
        } else {
          // 攻撃チェーンを構築 (飛び地への跳躍を禁止):
          // 前線に接する敵州から目標州まで、陸路でつながった州を順に踏んでいく
          const chain = BattlePlanManager.buildAttackChain(sid);
          army.arrow = { from: from, to: to };
          army.targetState = sid;
          army.chain = chain;
          army.chainIdx = 0;
          army.progress = 0;
          if (chain.length > 0) {
            const firstTarget = MapRenderer.states[chain[0]];
            CoreEngine.log(army.name + 'の攻撃作戦を描きました: → ' + target.name + ' (前線から' + chain.length + '州を段階的に進撃 — 最初: ' + (firstTarget ? firstTarget.name : '') + ')');
            GameUI.notify('攻撃矢印設定: ' + target.name + ' — 前線から段階的に戦線を広げます (最初: ' + (firstTarget ? firstTarget.name : '?') + ')', 'success');
          } else {
            CoreEngine.log(army.name + 'の攻撃目標は陸路で接続されていません (飛び地への跳躍は不可)');
            GameUI.notify('⛔ 攻撃目標が前線から陸路でつながっていません (飛び地には攻撃できません)', 'alert');
          }
          MultiplayerManager.broadcast({ type: 'battle_arrow', army: army.id, from: from, to: to, state: sid });
        }
      }
    }
    BattlePlanManager.dragMode = null;
    BattlePlanManager.dragPoints = [];
    BattlePlanManager.renderPanel();
  }

  static clearFront(armyId) {
    // 海軍/空軍ユニットの場合はエリア・目標を解除
    if (typeof armyId === 'string' && (armyId.startsWith('nav') || armyId.startsWith('air'))) {
      const unit = [...BattlePlanManager.navy, ...BattlePlanManager.air].find(u => u.id === armyId);
      if (!unit) return;
      unit.area = null; unit.target = null; unit.zone = null; unit.executing = false; unit.progress = 0;
      BattlePlanManager.renderPanel();
      return;
    }
    const army = BattlePlanManager.armies.find(a => a.id === armyId);
    if (!army) return;
    army.frontline = null;
    army.arrow = null;
    army.targetState = null;
    army.executing = false;
    BattlePlanManager.renderPanel();
  }

  static execute(armyId) {
    // 海軍/空軍: ミッション実行 (哨戒・制空・攻撃)
    if (typeof armyId === 'string' && (armyId.startsWith('nav') || armyId.startsWith('air'))) {
      const unit = [...BattlePlanManager.navy, ...BattlePlanManager.air].find(u => u.id === armyId);
      if (!unit) return;
      if (!unit.zone && !unit.area && !unit.target) {
        GameUI.notify(unit.type === 'navy' ? '先に海域を左クリックして指定してください。' : '先に空域を左クリックして指定してください。', 'alert');
        return;
      }
      if (unit.zone) unit.mission = unit.zone.mission;
      unit.executing = true;
      unit.progress = 0;
      CoreEngine.log(unit.name + 'がミッションを開始: ' + unit.mission);
      GameUI.notify('✈️ ミッション開始！', 'success');
      MultiplayerManager.broadcast({ type: 'force_execute', force: unit.type, id: unit.id });
      BattlePlanManager.renderPanel();
      return;
    }
    const army = BattlePlanManager.armies.find(a => a.id === armyId);
    if (!army) return;
    if (!army.arrow || !army.targetState) {
      GameUI.notify('攻撃矢印を先に描いてください (Shift+右ドラッグ)。', 'alert');
      return;
    }
    if (army.divisions.every(d => d.org <= 5)) {
      GameUI.notify('師団の組織力が回復するまで待ってください。', 'alert');
      return;
    }
    const target = MapRenderer.states[army.targetState];
    const targetOwner = target ? target.owner : null;
    if (targetOwner && !CoreEngine.gameState.atWar.includes(targetOwner)) {
      GameUI.notify('⚔️ ' + targetOwner + 'とは開戦していません。先に宣戦布告してください。', 'alert');
      return;
    }
    // 攻撃チェーン: 前線に接する敵州から順に段階的に進撃 (飛び地跳躍の禁止)
    if (!army.chain || army.chain.length === 0) {
      army.chain = BattlePlanManager.buildAttackChain(army.targetState);
    }
    if (!army.chain || army.chain.length === 0) {
      GameUI.notify('⛔ 攻撃目標が前線から陸路でつながっていません (飛び地には攻撃できません)', 'alert');
      return;
    }
    const firstSid = army.chain[0];
    const firstSt = MapRenderer.states[firstSid];
    if (!firstSt || !CoreEngine.gameState.atWar.includes(firstSt.owner)) {
      GameUI.notify('⚔️ ' + (firstSt ? firstSt.owner : '?') + 'とは開戦していません。先に宣戦布告してください。', 'alert');
      return;
    }
    army.executing = true;
    army.progress = 0;
    // 戦闘を開始 (勝敗・占領は BattleManager が解決 — 勝つと次の州へ前進する)
    const firstProv = (firstSt.provinces && firstSt.provinces[0]) || null;
    const toPid = MapRenderer.provinceAt(army.arrow.to[0], army.arrow.to[1]);
    BattleManager.startOffensive(army, toPid || firstProv, firstSid);
    CoreEngine.log(army.name + 'が作戦を開始: まず ' + (firstSt.name || '州' + firstSid) + 'へ進撃 (全' + army.chain.length + '州計画)！');
    MultiplayerManager.broadcast({ type: 'battle_execute', army: army.id });
    BattlePlanManager.renderPanel();
  }

  static abort(armyId) {
    if (typeof armyId === 'string' && (armyId.startsWith('nav') || armyId.startsWith('air'))) {
      const unit = [...BattlePlanManager.navy, ...BattlePlanManager.air].find(u => u.id === armyId);
      if (!unit) return;
      unit.executing = false;
      unit.progress = 0;
      CoreEngine.log(unit.name + 'のミッションを中止しました。');
      BattlePlanManager.renderPanel();
      return;
    }
    const army = BattlePlanManager.armies.find(a => a.id === armyId);
    if (!army) return;
    army.executing = false;
    army.progress = 0;
    army.chain = null;
    // 進行中の戦闘も取り消す
    BattleManager.battles = BattleManager.battles.filter(b => b.attackerArmyId !== army.id);
    CoreEngine.log(army.name + 'の作戦を中止しました。');
    BattlePlanManager.renderPanel();
  }

  // ---- 海軍/空軍の継続的行動効果 (毎ゲーム日) ----
  static applyForceAction(unit) {
    if (!unit.zone || !MapRenderer.ready) return;
    const gs = CoreEngine.gameState;
    const player = gs.country;
    // 任務区域に近い敵の州 (開戦国のみ) を探す
    const typeNames = MapRenderer.provinces.types;
    let target = null, bestD = 260;
    Object.entries(MapRenderer.states).forEach(([sid, st]) => {
      if (!gs.atWar.includes(st.owner)) return;
      const c = MapRenderer.stateCenter.get(String(sid));
      if (!c) return;
      const d = Math.hypot(c[0] - unit.zone.x, c[1] - unit.zone.y);
      if (d < bestD) { bestD = d; target = { sid: sid, st: st, c: c }; }
    });
    if (!target) return;
    const st = target.st;
    st.b = st.b || {};
    // 空軍「戦略爆撃」: 敵の工場施設を破壊していく
    if (unit.type === 'air' && unit.mission === 'strategic') {
      const targets = ['arms_factory', 'industrial_complex', 'infrastructure'];
      const key = targets[Math.floor(unit.progress / 30) % targets.length];
      if (unit.progress % 25 < 1.2 && (st.b[key] || 0) > 0) {
        st.b[key]--;
        MapRenderer.invalidateModes();
        CoreEngine.log('💥 戦略爆撃: ' + st.name + 'の' + key + 'を破壊 (' + st.b[key] + 'レベル残り)');
        GameUI.notify('✈️ 戦略爆撃成功: ' + st.name + ' の施設を破壊！', 'success');
        MultiplayerManager.broadcast({ type: 'bomb', state: target.sid, key: key });
      }
    }
    // 海軍「艦砲射撃」: 沿岸州の要塞・施設を砲撃
    if (unit.type === 'navy' && unit.mission === 'shore') {
      const pd = MapRenderer.provinces.p[unit.zone.pid];
      const isSea = pd && (typeNames[pd[3]] === 'sea' || typeNames[pd[3]] === 'lake');
      if (isSea && (st.b.fort || 0) > 0 && unit.progress % 30 < 1.2) {
        st.b.fort--;
        MapRenderer.invalidateModes();
        CoreEngine.log('💥 艦砲射撃: ' + st.name + 'の要塞を破壊 (残り' + st.b.fort + ')');
        GameUI.notify('⚓ 艦砲射撃成功: ' + st.name + ' の要塞を破壊！', 'success');
        MultiplayerManager.broadcast({ type: 'bomb', state: target.sid, key: 'fort' });
      }
    }
    // 海軍「攻撃」: 敵輸送船団を攻撃 (護衛を持つ国がいれば相殺)
    if (unit.type === 'navy' && unit.mission === 'strike' && unit.progress % 40 < 1.2) {
      CoreEngine.log('⚔️ ' + unit.name + 'が敵輸送船団を攻撃しました。');
    }
    // 空軍「制空」: 制空権をじわじわ獲得
    if (unit.type === 'air' && unit.mission === 'air_sup') {
      gs.airSupremacy = Math.min(100, (gs.airSupremacy || 0) + 0.3);
    }
    // 海軍「哨戒」: 制海権をじわじわ獲得
    if (unit.type === 'navy' && unit.mission === 'patrol') {
      gs.navalSupremacy = Math.min(100, (gs.navalSupremacy || 0) + 0.3);
    }
  }

  // 海軍/空軍ミッション完了時の効果
  static completeForceMission(unit) {
    const gs = CoreEngine.gameState;
    gs.xp[unit.type === 'navy' ? 'navy' : 'air'] += 15;
    if (unit.type === 'navy') {
      if (unit.mission === 'patrol') gs.navalSupremacy = Math.min(100, (gs.navalSupremacy || 0) + 20);
      if (unit.mission === 'escort') gs.convoys = (gs.convoys || 0) + 30;
      if (unit.mission === 'strike') gs.warSupport = Math.min(100, gs.warSupport + 2);
    } else {
      if (unit.mission === 'air_sup') gs.airSupremacy = Math.min(100, (gs.airSupremacy || 0) + 25);
      if (unit.mission === 'ground') gs.warSupport = Math.min(100, gs.warSupport + 3);
      if (unit.mission === 'patrol') gs.airSupremacy = Math.min(100, (gs.airSupremacy || 0) + 10);
    }
    CoreEngine.log('🏆 ' + unit.name + 'のミッション完了: ' + unit.mission);
    GameUI.notify('ミッション完了！ XP+15', 'success');
    MultiplayerManager.broadcast({ type: 'force_complete', force: unit.type, id: unit.id, mission: unit.mission });
  }

  static onTick() {
    if (!MapRenderer.ready) return;
    BattlePlanManager.armies.forEach(army => {
      if (army.executing) {
        // 師団が矢印に沿って前進 (アニメ用に師団座標を矢印経路へ補間)
        const t = Math.min(1, army.progress / 100);
        army.divisions.forEach((d, i) => {
          if (d.org > 0) {
            d.x = army.arrow.from[0] + (army.arrow.to[0] - army.arrow.from[0]) * t + (i % 2 ? 6 : -6);
            d.y = army.arrow.from[1] + (army.arrow.to[1] - army.arrow.from[1]) * t + (i % 2 ? 6 : -6);
            d.org = Math.max(0, d.org - 0.4);
          }
        });
        const speed = army.divisions.filter(d => d.org > 0).length;
        army.progress += Math.max(0.5, speed * 0.3);
        // 戦闘の勝敗は BattleManager (battle.js) が解決 — 進行度を戦闘に同期
        const bt = BattleManager.battles.find(b => b.attackerArmyId === army.id);
        if (bt) {
          army.progress = Math.max(army.progress, Math.min(100, bt.progress * 100));
        } else if (army.progress >= 100) {
          // 戦闘が紐付かない場合 (遠隔プレイヤー起因など) は単に進撃を完了
          army.executing = false;
          army.progress = 0;
        }
      } else {
        // 待機中は組織力が回復
        army.divisions.forEach(d => {
          d.org = Math.min(d.maxOrg, d.org + 0.2);
          // 拠点へ徐々に帰還
          d.x += (army.base[0] + (d.id % 5) * 8 - d.x) * 0.02;
          d.y += (army.base[1] + (d.id % 3) * 8 - d.y) * 0.02;
        });
      }
    });
    // 海軍/空軍ミッションの進行 (DLC拡張)
    const gs = CoreEngine.gameState;
    [...BattlePlanManager.navy, ...BattlePlanManager.air].forEach(unit => {
      if (unit.executing) {
        unit.progress += 1.2;
        BattlePlanManager.applyForceAction(unit);
        if (unit.progress >= 100) {
          unit.executing = false;
          unit.progress = 0;
          BattlePlanManager.completeForceMission(unit);
        }
      }
    });
    if (BattlePlanManager.armies.some(a => a.executing) && gs.xp) gs.xp.army += 0.5;
    BattlePlanManager.renderPanelThrottled();
  }

  static renderPanelThrottled() {
    if (!BattlePlanManager._lastRender || Date.now() - BattlePlanManager._lastRender > 2000) {
      BattlePlanManager.renderPanel();
    }
  }

  static renderPanel() {
    BattlePlanManager._lastRender = Date.now();
    const el = document.getElementById('army-panel');
    if (!el) return;
    if (!MapRenderer.ready) {
      el.innerHTML = '<h4>⚔️ 軍集団</h4><div class="army-info">地図読込後に編成されます</div>';
      return;
    }
    // 陸軍/海軍/空軍 切替タブ
    let html = '<h4>⚔️ 作戦指揮パネル</h4><div style="display:flex;gap:4px;margin-bottom:6px;">' +
      [['army', '🪖 陸軍'], ['navy', '⚓ 海軍'], ['air', '✈️ 空軍']].map(([f, l]) =>
        '<button class="army-btn' + (BattlePlanManager.activeForce === f ? '' : '" style="background:var(--bg-panel-light)') + '" onclick="BattlePlanManager.setForce(\'' + f + '\')">' + l + '</button>').join('') +
      '</div>';
    // 海軍/空軍ユニット行
    if (BattlePlanManager.activeForce !== 'army') {
      const force = BattlePlanManager.activeForce;
      const units = force === 'navy' ? BattlePlanManager.navy : BattlePlanManager.air;
      const missionOpts = BattlePlanManager.missions[force].map(m => '<option value="' + m.id + '" ' + (BattlePlanManager.activeMission[force] === m.id ? 'selected' : '') + '>' + m.label + '</option>').join('');
      units.forEach(unit => {
        html += '<div class="army-row ' + (unit.id === BattlePlanManager.selectedUnitId ? 'selected' : '') + '" onclick="BattlePlanManager.selectUnit(\'' + unit.id + '\')">' +
          '<div class="army-name">' + (unit.type === 'navy' ? '⚓ ' : '✈️ ') + unit.name + (unit.id === BattlePlanManager.selectedUnitId ? ' ✅' : '') + '</div>' +
          '<div class="army-info">' +
          (unit.type === 'navy' ? '任務: <select style="background:#1a222c;color:#fff;border:1px solid #3a4a5a;font-size:10px;" onclick="event.stopPropagation()" onchange="BattlePlanManager.setMission(this.value)">' + missionOpts + '</select>' : '任務: <select style="background:#1a222c;color:#fff;border:1px solid #3a4a5a;font-size:10px;" onclick="event.stopPropagation()" onchange="BattlePlanManager.setMission(this.value)">' + missionOpts + '</select>') +
          ' | ' + (unit.zone ? '区域✅' : (unit.area ? 'エリア✅' : 'エリア—')) + ' | ' + (unit.target ? '目標✅' : '目標—') + '</div>' +
          (unit.executing
            ? '<div class="army-info" style="color:var(--accent-red)">実行中... ' + Math.floor(unit.progress) + '%</div>' +
              '<button class="army-btn abort" onclick="BattlePlanManager.abort(\'' + unit.id + '\')">⛔ 中止</button>'
            : '<button class="army-btn" onclick="BattlePlanManager.execute(\'' + unit.id + '\')">▶ ミッション開始</button>') +
          '<button class="army-btn" style="background:var(--bg-panel-light)" onclick="BattleManager_clearFront(\'' + unit.id + '\')">✕ 解除</button>' +
          '</div>';
      });
      html += '<div style="font-size:10px;color:var(--text-secondary);margin-top:4px;">マップ上で左クリック=海域・空域を指定 (紹介ウィンドウが開きます)</div>';
      el.innerHTML = html;
      return;
    }
    BattlePlanManager.armies.forEach(army => {
      const org = army.divisions.reduce((s, d) => s + d.org, 0);
      const maxOrg = army.divisions.reduce((s, d) => s + d.maxOrg, 0);
      html += '<div class="army-row ' + (army.id === BattlePlanManager.selectedArmyId ? 'selected' : '') + '" onclick="BattlePlanManager.selectArmy(' + army.id + ')">' +
        '<div class="army-name">' + army.name + (army.id === BattlePlanManager.selectedArmyId ? ' ✅' : '') + '</div>' +
        '<div class="army-info">師団 ' + army.divisions.length + '個 | ' +
        (army.frontline ? '前線✅' : '前線—') + ' | ' +
        (army.arrow ? '矢印✅' : '矢印—') + '</div>' +
        '<div class="army-orgbar"><div class="army-orgbar-fill" style="width:' + (org / maxOrg * 100) + '%"></div></div>' +
        (army.executing
          ? '<div class="army-info" style="color:var(--accent-red)">作戦実行中... ' + Math.floor(army.progress) + '%</div>' +
            '<button class="army-btn abort" onclick="BattlePlanManager.abort(' + army.id + ')">⛔ 中止</button>'
          : '<button class="army-btn" onclick="BattlePlanManager.execute(' + army.id + ')" ' + (army.arrow ? '' : 'disabled') + '>▶ 作戦開始</button>') +
        '<button class="army-btn" style="background:var(--bg-panel-light)" onclick="BattleManager_clearFront(' + army.id + ')">✕ 前線</button>' +
        '</div>';
    });
    html += '<div style="font-size:10px;color:var(--text-secondary);margin-top:4px;">マップ上で右ドラッグ=前線 / Shift+右ドラッグ=攻撃矢印</div>';
    el.innerHTML = html;
  }

  // ---- Canvasオーバーレイ描画: 前線・矢印・師団 ----
  static drawOverlay(ctx, cam, worldToScreen) {
    if (!MapRenderer.ready) return;
    const drawPolyline = (pts, color, width, dash) => {
      if (!pts || pts.length < 2) return;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      if (dash) ctx.setLineDash(dash);
      ctx.beginPath();
      pts.forEach((pt, i) => {
        const s = worldToScreen(pt[0], pt[1]);
        if (i === 0) ctx.moveTo(s[0], s[1]); else ctx.lineTo(s[0], s[1]);
      });
      ctx.stroke();
      ctx.setLineDash([]);
    };

    BattlePlanManager.armies.forEach(army => {
      // 前線 (緑の光線)
      if (army.frontline) {
        ctx.save();
        ctx.shadowColor = '#4ac46a';
        ctx.shadowBlur = 8;
        drawPolyline(army.frontline, 'rgba(125,232,122,0.95)', Math.max(2, 3));
        ctx.restore();
      }
      // 攻撃チェーン (残りの進撃経路: 破線の金線 — 段階的に広がる戦線)
      if (army.chain && army.chain.length > 0) {
        const pts = army.chain.map(sid => MapRenderer.stateCenter.get(String(sid))).filter(Boolean);
        drawPolyline(pts, 'rgba(212,168,67,0.85)', 2, [6, 6]);
      }
      // 攻撃矢印 (赤)
      if (army.arrow) {
        const from = worldToScreen(army.arrow.from[0], army.arrow.from[1]);
        const to = worldToScreen(army.arrow.to[0], army.arrow.to[1]);
        ctx.strokeStyle = 'rgba(255,90,90,0.95)';
        ctx.fillStyle = 'rgba(255,90,90,0.95)';
        ctx.lineWidth = Math.max(2, 3);
        ctx.beginPath();
        ctx.moveTo(from[0], from[1]);
        ctx.lineTo(to[0], to[1]);
        ctx.stroke();
        // 矢尻
        const ang = Math.atan2(to[1] - from[1], to[0] - from[0]);
        const size = 10;
        ctx.beginPath();
        ctx.moveTo(to[0], to[1]);
        ctx.lineTo(to[0] - size * Math.cos(ang - 0.5), to[1] - size * Math.sin(ang - 0.5));
        ctx.lineTo(to[0] - size * Math.cos(ang + 0.5), to[1] - size * Math.sin(ang + 0.5));
        ctx.closePath();
        ctx.fill();
        if (army.executing) {
          // 進行度
          ctx.strokeStyle = '#d4a843';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(to[0], to[1], 8, -Math.PI / 2, -Math.PI / 2 + army.progress / 100 * Math.PI * 2);
          ctx.stroke();
        }
      }
      // 師団マーカー (NATO風歩兵記号 + 組織力バー) — マップ上で常に確認できる
      army.divisions.forEach(d => {
        const s = worldToScreen(d.x, d.y);
        if (s[0] < -30 || s[1] < -30 || s[0] > ctx.canvas.width + 30 || s[1] > ctx.canvas.height + 30) return;
        const selected = army.id === BattlePlanManager.selectedArmyId;
        const w = 16, h = 13;
        // 本体 (NATO歩兵記号: 矩形 + 斜め十字)
        ctx.fillStyle = selected ? 'rgba(212,168,67,0.95)' : 'rgba(90,110,140,0.92)';
        ctx.fillRect(s[0] - w / 2, s[1] - h / 2, w, h);
        ctx.strokeStyle = '#0a0c0f';
        ctx.lineWidth = 1;
        ctx.strokeRect(s[0] - w / 2, s[1] - h / 2, w, h);
        ctx.beginPath();
        ctx.moveTo(s[0] - w / 2, s[1] - h / 2); ctx.lineTo(s[0] + w / 2, s[1] + h / 2);
        ctx.moveTo(s[0] + w / 2, s[1] - h / 2); ctx.lineTo(s[0] - w / 2, s[1] + h / 2);
        ctx.stroke();
        // 組織力バー
        ctx.fillStyle = '#222';
        ctx.fillRect(s[0] - w / 2, s[1] - h / 2 - 5, w, 3);
        ctx.fillStyle = d.org / d.maxOrg > 0.5 ? '#4ac46a' : '#e0c040';
        ctx.fillRect(s[0] - w / 2, s[1] - h / 2 - 5, w * (d.org / d.maxOrg), 3);
        // 軍集団番号 (選択中のみ)
        if (selected) {
          ctx.fillStyle = '#d4a843';
          ctx.font = 'bold 9px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(army.name, s[0], s[1] - h / 2 - 7);
        }
      });
    });

    // 海軍/空軍オーバーレイ: 哨戒・制空エリア (矩形=直線のみ) と部隊マーカー
    [...BattlePlanManager.navy, ...BattlePlanManager.air].forEach(unit => {
      const navy = unit.type === 'navy';
      const lineColor = navy ? 'rgba(90,160,255,0.95)' : 'rgba(120,200,255,0.95)';
      if (unit.area) {
        const a = worldToScreen(unit.area.x1, unit.area.y1);
        const b = worldToScreen(unit.area.x2, unit.area.y2);
        ctx.save();
        ctx.fillStyle = navy ? 'rgba(90,160,255,0.12)' : 'rgba(120,200,255,0.10)';
        ctx.strokeStyle = lineColor;
        ctx.lineWidth = 2;
        if (unit.executing) { ctx.setLineDash([6, 4]); ctx.shadowColor = lineColor; ctx.shadowBlur = 6; }
        // 水平/垂直の直線のみで矩形を描画
        ctx.beginPath();
        ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(a[0], b[1]); ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.restore();
        if (unit.executing) {
          const prog = Math.min(1, unit.progress / 100);
          ctx.strokeStyle = '#d4a843';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(b[0] - (b[0] - a[0]) * prog, a[1]);
          ctx.lineTo(b[0], a[1]);
          ctx.stroke();
        }
      }
      // 任務海域・空域 (クリック指定) のマーカー
      if (unit.zone) {
        const z = worldToScreen(unit.zone.x, unit.zone.y);
        const zc = navy ? 'rgba(90,160,255,0.95)' : 'rgba(120,200,255,0.95)';
        ctx.save();
        ctx.strokeStyle = zc;
        ctx.lineWidth = 2;
        if (unit.executing) { ctx.setLineDash([5, 3]); ctx.shadowColor = zc; ctx.shadowBlur = 6; }
        ctx.beginPath();
        ctx.arc(z[0], z[1], 14, 0, Math.PI * 2);
        ctx.stroke();
        if (unit.executing) {
          ctx.fillStyle = 'rgba(212,168,67,0.9)';
          ctx.beginPath();
          ctx.arc(z[0], z[1], 14, -Math.PI / 2, -Math.PI / 2 + Math.min(1, unit.progress / 100) * Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
        ctx.fillStyle = zc;
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        const mObj = (BattlePlanManager.missions[unit.type].find(m => m.id === unit.zone.mission) || {});
        ctx.fillText((navy ? '⚓ ' : '✈️ ') + (mObj.label || unit.zone.mission), z[0], z[1] - 18);
      }
      if (unit.target) {
        const t = worldToScreen(unit.target.x, unit.target.y);
        ctx.strokeStyle = 'rgba(255,90,90,0.95)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(t[0], t[1], 10, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(t[0] - 7, t[1] - 7); ctx.lineTo(t[0] + 7, t[1] + 7);
        ctx.moveTo(t[0] + 7, t[1] - 7); ctx.lineTo(t[0] - 7, t[1] + 7);
        ctx.stroke();
      }
      // 部隊マーカー (⚓/✈️)
      const bs = worldToScreen(unit.base[0], unit.base[1]);
      ctx.fillStyle = navy ? 'rgba(90,160,255,0.95)' : 'rgba(120,200,255,0.95)';
      ctx.fillRect(bs[0] - 7, bs[1] - 5, 14, 10);
      ctx.strokeStyle = '#0a0c0f';
      ctx.strokeRect(bs[0] - 7, bs[1] - 5, 14, 10);
      ctx.fillStyle = '#0a0c0f';
      ctx.font = '8px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(navy ? 'NAVY' : 'AIR', bs[0], bs[1] + 3);
    });

    // ドラッグ中のプレビュー (直線のみ)
    if (BattlePlanManager.dragMode && BattlePlanManager.dragPoints.length > 1) {
      const color = BattlePlanManager.dragMode === 'front' ? 'rgba(125,232,122,0.8)' : BattlePlanManager.dragMode === 'area' ? 'rgba(90,160,255,0.8)' : 'rgba(255,90,90,0.8)';
      if (BattlePlanManager.dragMode === 'area') {
        const a = BattlePlanManager.dragPoints[0];
        const b = BattlePlanManager.dragPoints[BattlePlanManager.dragPoints.length - 1];
        const s1 = worldToScreen(Math.min(a[0], b[0]), Math.min(a[1], b[1]));
        const s2 = worldToScreen(Math.max(a[0], b[0]), Math.max(a[1], b[1]));
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.strokeRect(s1[0], s1[1], s2[0] - s1[0], s2[1] - s1[1]);
        ctx.setLineDash([]);
      } else {
        drawPolyline(BattlePlanManager.dragPoints, color, 2, [8, 4]);
      }
    }
  }
}

// グローバルヘルパー (パネルのHTML onclickから参照)
function BattleManager_clearFront(armyId) { BattlePlanManager.clearFront(armyId); }

// ==========================================================
// Module 9: ConstructionManager — 建設 (民需/軍需工場・飛行場・要塞等)
// ==========================================================
class ConstructionManager {
  static BUILDINGS = [
    { id: 'industrial_complex', name: '民需工場', icon: '🏭', cost: 300, gameKey: 'civilianFactories' },
    { id: 'arms_factory', name: '軍需工場', icon: '⚙️', cost: 360, gameKey: 'militaryFactories' },
    { id: 'dockyard', name: '海軍工廠', icon: '⚓', cost: 330, gameKey: 'dockyards' },
    { id: 'air_base', name: '飛行場', icon: '✈️', cost: 240 },
    { id: 'infrastructure', name: 'インフラ', icon: '🛤️', cost: 200, max: 5 },
    { id: 'land_fort', name: '陸軍要塞', icon: '🛡️', cost: 250, max: 5 },
    { id: 'coastal_bunker', name: '沿岸要塞', icon: '🌊', cost: 250, max: 5 },
    { id: 'supply_hub', name: '補給ハブ', icon: '📦', cost: 400, max: 3 },
    { id: 'nuclear_reactor', name: '原子炉', icon: '☢️', cost: 600, max: 1 }
  ];
  static queue = [];  // {stateId, building, progress, factories}
  static selectedStateId = null;

  static init() {
    CoreEngine.registerTickCallback(() => ConstructionManager.onTick());
  }

  static onMapReady() { ConstructionManager.render(); }

  static selectState(sid) {
    ConstructionManager.selectedStateId = sid;
    if (WindowManager.isOpen('construction')) ConstructionManager.render();
  }

  static maxLevel(b) {
    return b.max || (b.id === 'industrial_complex' ? 25 : 20);
  }

  static render() {
    const container = document.getElementById('construction-content');
    if (!container) return;
    const s = CoreEngine.gameState;
    const player = s.country;
    const sid = ConstructionManager.selectedStateId;
    const st = sid ? MapRenderer.states[sid] : null;

    let html = '<div class="sp-section"><h3>🏗️ 建設 (Construction)</h3>' +
      '<p style="color:var(--text-secondary);font-size:12px;">マップ上の州をクリックして選択 → 施設を建設キューに追加します。' +
      'キュー各項目に民需工場（最大15個/スロット）を割り当てると建設が速くなります。</p></div>';
