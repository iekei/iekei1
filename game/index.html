class DivisionDesigner {
  static grid = Array(5).fill(null).map(() => Array(5).fill(null));
  static selectedBattalion = null;
  static availableBattalions = [
    { id: 'infantry', name: '歩兵', icon: '🪖', attack: 10, defense: 20, org: 60 },
    { id: 'artillery', name: '砲兵', icon: '💥', attack: 25, defense: 5, org: 10 },
    { id: 'armor', name: '戦車', icon: '🚜', attack: 30, defense: 15, org: 40 },
    { id: 'anti_tank', name: '対戦車', icon: '🎯', attack: 15, defense: 8, org: 15 },
    { id: 'anti_air', name: '対空', icon: '🛡️', attack: 8, defense: 10, org: 15 },
    { id: 'engineer', name: '工兵', icon: '🔧', attack: 5, defense: 25, org: 30 },
    { id: 'recon', name: '偵察', icon: '🔭', attack: 8, defense: 12, org: 25 }
  ];
  static specialBattalions = [];

  static init() { DivisionDesigner.render(); }

  static unlockSpecialBattalion(sciId) {
    const specialBatts = {
      boris_stechkin: { id: 'jet_fighter', name: 'ジェット戦闘機', icon: '✈️', attack: 40, defense: 20, org: 30 },
      sergey_korolyov: { id: 'v2_rocket', name: 'V2ロケット', icon: '🚀', attack: 50, defense: 0, org: 5 },
      igor_kurchatov: { id: 'nuke_battalion', name: '核部隊', icon: '☢️', attack: 99, defense: 10, org: 10 },
      vladimir_kotelnikov: { id: 'land_battleship', name: '陸上戦艦', icon: '🛳️', attack: 45, defense: 40, org: 50 }
    };
    const batt = specialBatts[sciId];
    if (batt && !DivisionDesigner.specialBattalions.find(b => b.id === batt.id)) {
      DivisionDesigner.specialBattalions.push(batt);
      GameUI.notify('特別大隊解除: ' + batt.name + '！', 'success');
    }
  }

  static render() {
    const container = document.getElementById('division-content');
    const allBatts = [...DivisionDesigner.availableBattalions, ...DivisionDesigner.specialBattalions];

    let html = '<div class="sp-section"><h3>⚔️ 師団編成エディター (5×5)</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;">左の大隊を選択し、グリッドをクリックして配置します。</p>' +
      '<div class="division-grid-container"><div><div class="division-grid" id="division-grid">';

    for (let y = 0; y < 5; y++) {
      for (let x = 0; x < 5; x++) {
        const cell = DivisionDesigner.grid[y][x];
        const cls = cell ? 'division-cell filled' : 'division-cell';
        const icon = cell ? cell.icon : '';
        html += '<div class="' + cls + '" onclick="DivisionDesigner.toggleCell(' + x + ',' + y + ')">' + icon + '</div>';
      }
    }
    html += '</div><button class="sp-btn" onclick="DivisionDesigner.clearGrid()" style="margin-top:8px;">グリッドをクリア</button></div>';

    html += '<div class="division-battalion-list"><h4 style="color:var(--text-gold);margin-bottom:6px;">大隊選択</h4>';
    allBatts.forEach(b => {
      const isSpecial = DivisionDesigner.specialBattalions.find(sb => sb.id === b.id);
      html += '<div class="battalion-option" onclick="DivisionDesigner.selectBattalion(\'' + b.id + '\')">' +
        b.icon + ' ' + b.name + (isSpecial ? ' <span style="color:var(--accent-green);">★</span>' : '') + '</div>';
    });
    html += '</div>';

    const stats = DivisionDesigner.calculateStats();
    html += '<div class="division-stats"><h4 style="color:var(--text-gold);margin-bottom:6px;">師団ステータス</h4>' +
      '<div class="division-stat-row"><span>攻撃力</span><span style="color:var(--accent-red);">' + stats.attack + '</span></div>' +
      '<div class="division-stat-row"><span>防御力</span><span style="color:var(--accent-green);">' + stats.defense + '</span></div>' +
      '<div class="division-stat-row"><span>組織力</span><span style="color:var(--accent-blue);">' + stats.org + '</span></div>' +
      '<div class="division-stat-row"><span>大隊数</span><span>' + stats.count + '</span></div>' +
      '<div class="division-stat-row"><span>機甲速度ボーナス</span><span>' + (CoreEngine.gameState.cardModifiers.armorSpeed > 0 ? '+' : '') + (CoreEngine.gameState.cardModifiers.armorSpeed * 100) + '%</span></div>' +
      '<div class="division-stat-row"><span>歩兵防御ボーナス</span><span>' + (CoreEngine.gameState.cardModifiers.infantryDefense > 0 ? '+' : '') + (CoreEngine.gameState.cardModifiers.infantryDefense * 100) + '%</span></div>' +
      '</div></div></div>';

    container.innerHTML = html;
  }

  static selectBattalion(battId) {
    const allBatts = [...DivisionDesigner.availableBattalions, ...DivisionDesigner.specialBattalions];
    DivisionDesigner.selectedBattalion = allBatts.find(b => b.id === battId) || null;
    GameUI.notify(DivisionDesigner.selectedBattalion ? '選択: ' + DivisionDesigner.selectedBattalion.name : '選択解除');
  }

  static toggleCell(x, y) {
    if (DivisionDesigner.grid[y][x]) {
      DivisionDesigner.grid[y][x] = null;
    } else if (DivisionDesigner.selectedBattalion) {
      DivisionDesigner.grid[y][x] = { ...DivisionDesigner.selectedBattalion };
    }
    DivisionDesigner.render();
  }

  static clearGrid() {
    DivisionDesigner.grid = Array(5).fill(null).map(() => Array(5).fill(null));
    DivisionDesigner.render();
  }

  static calculateStats() {
    let attack = 0, defense = 0, org = 0, count = 0;
    DivisionDesigner.grid.forEach(row => {
      row.forEach(cell => {
        if (cell) {
          let cellAttack = cell.attack;
          let cellDefense = cell.defense;
          if (cell.id === 'armor') cellAttack *= (1 + (CoreEngine.gameState.cardModifiers.armorBreakthrough || 0));
          if (cell.id === 'infantry') cellDefense *= (1 + (CoreEngine.gameState.cardModifiers.infantryDefense || 0));
          attack += cellAttack;
          defense += cellDefense;
          org += cell.org;
          count++;
        }
      });
    });
    if (count > 0) org = Math.floor(org / count);
    return { attack: Math.floor(attack), defense: Math.floor(defense), org: org, count: count };
  }
}

// ==========================================================
// Module 10: CheatConsole — コンソールチート機能
// ==========================================================
class CheatConsole {
  static history = [];
  static historyIdx = -1;

  static init() {
    document.addEventListener('keydown', (e) => {
      if (e.key === '`' || (e.key === '@' && e.shiftKey) || (e.key === '^' && e.shiftKey) || e.key === '~') {
        if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
          e.preventDefault();
          CheatConsole.toggle();
        }
      }
    });
  }

  static toggle() {
    const el = document.getElementById('cheat-console');
    if (el.classList.contains('hidden')) {
      el.classList.remove('hidden');
      el.classList.remove('collapsed');
      document.getElementById('cheat-console-input').focus();
    } else {
      el.classList.toggle('collapsed');
    }
  }

  static handleInput(e) {
    if (e.key === 'Enter') {
      const cmd = e.target.value.trim();
      if (cmd) {
        CheatConsole.execute(cmd);
        CheatConsole.history.push(cmd);
        CheatConsole.historyIdx = CheatConsole.history.length;
      }
      e.target.value = '';
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (CheatConsole.historyIdx > 0) {
        CheatConsole.historyIdx--;
        e.target.value = CheatConsole.history[CheatConsole.historyIdx] || '';
      }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (CheatConsole.historyIdx < CheatConsole.history.length - 1) {
        CheatConsole.historyIdx++;
        e.target.value = CheatConsole.history[CheatConsole.historyIdx] || '';
      } else {
        CheatConsole.historyIdx = CheatConsole.history.length;
        e.target.value = '';
      }
    }
  }

  static output(msg, isError) {
    const out = document.getElementById('cheat-console-output');
    const line = document.createElement('div');
    line.className = 'cheat-output-line' + (isError ? ' cheat-error' : '');
    line.textContent = '> ' + msg;
    out.appendChild(line);
    out.scrollTop = out.scrollHeight;
  }

  static execute(cmd) {
    const parts = cmd.toLowerCase().split(/\s+/);
    const command = parts[0];
    const s = CoreEngine.gameState;

    switch (command) {
      case 'nuke':
        var nukeCount = parseInt(parts[1]) || 1;
        s.nuclearStockpile += nukeCount;
        CheatConsole.output('核爆弾 +' + nukeCount + ' (現在: ' + Math.floor(s.nuclearStockpile) + ')');
        CoreEngine.renderStats();
        break;
      case 'pp':
        var ppVal = parseInt(parts[1]) || 100;
        s.politicalPower += ppVal;
        CheatConsole.output('政治力 +' + ppVal + ' (現在: ' + Math.floor(s.politicalPower) + ')');
        CoreEngine.renderStats();
        break;
      case 'manpower':
        var mpVal = parseInt(parts[1]) || 1000000;
        s.manpower += mpVal;
        CheatConsole.output('人的資源 +' + mpVal + ' (現在: ' + s.manpower + ')');
        CoreEngine.renderStats();
        break;
      case 'ic':
        s.civilianFactories += 10;
        s.militaryFactories += 10;
        CheatConsole.output('工廠 +10C/+10M (現在: ' + s.civilianFactories + 'C/' + s.militaryFactories + 'M)');
        CoreEngine.renderStats();
        break;
      case 'it':
        CheatConsole.output('全技術研究を即座に完了します（チート）');
        if (ResearchManager.techData) {
          Object.values(ResearchManager.techData).forEach(cat => {
            cat.forEach(t => ResearchManager.researchedTech.add(t.id));
          });
          ResearchManager.render();
        }
        break;
      case 'focus.autocomplete':
        FocusTreeManager.autocomplete = !FocusTreeManager.autocomplete;
        CheatConsole.output('focus.autocomplete = ' + (FocusTreeManager.autocomplete ? 'ON' : 'OFF'));
        FocusTreeManager.render();
        break;
      case 'focus.nochecks':
        FocusTreeManager.noChecks = !FocusTreeManager.noChecks;
        CheatConsole.output('focus.nochecks = ' + (FocusTreeManager.noChecks ? 'ON' : 'OFF'));
        FocusTreeManager.render();
        break;
      case 'allowdiplo':
        CheatConsole.output('allowdiplo = ON (外交制限解除)');
        DiplomacyManager.countries.forEach(c => c.relation = Math.max(c.relation, 50));
        DiplomacyManager.render();
        break;
      case 'annex':
        var annexCountry = parts[1] ? parts[1].toUpperCase() : '';
        if (annexCountry && DiplomacyManager.countries.find(c => c.id === annexCountry)) {
          CheatConsole.output(annexCountry + 'を併合しました（チート）');
          MapRenderer.provinces = MapRenderer.provinces.filter(p => p.country !== annexCountry);
          MapRenderer.render();
          GameUI.notify(annexCountry + 'を併合しました', 'alert');
        } else {
          CheatConsole.output('国名コードが無効: ' + annexCountry, true);
        }
        break;
      case 'tag':
        var tagCountry = parts[1] ? parts[1].toUpperCase() : '';
        if (tagCountry && DataFetcher.getCountryFlag(tagCountry) !== '🏳️') {
          s.country = tagCountry;
          CheatConsole.output('プレイヤー国を' + tagCountry + 'に変更しました');
          CoreEngine.renderStats();
          FocusTreeManager.init(tagCountry);
        } else {
          CheatConsole.output('無効な国コード: ' + tagCountry, true);
        }
        break;
      case 'stability':
        s.stability = Math.min(100, Math.max(0, parseInt(parts[1]) || 100));
        CheatConsole.output('安定度を' + s.stability + 'に設定');
        CoreEngine.renderStats();
        break;
      case 'warsupport':
        s.warSupport = Math.min(100, Math.max(0, parseInt(parts[1]) || 100));
        CheatConsole.output('戦争協力度を' + s.warSupport + 'に設定');
        CoreEngine.renderStats();
        break;
      case 'research':
        s.researchSlots = 5;
        CheatConsole.output('研究スロットを5に設定');
        break;
      case 'help':
        CheatConsole.output('利用可能コマンド: nuke [数値], pp [数値], manpower [数値], ic, it, focus.autocomplete, focus.nochecks, allowdiplo, annex [国コード], tag [国コード], stability [数値], warsupport [数値], research');
        break;
      default:
        CheatConsole.output('不明なコマンド: ' + command + ' (helpで一覧表示)', true);
    }
  }
}

// ==========================================================
// Module 11: MultiplayerManager — PeerJS P2Pマルチプレイ
// ==========================================================
class MultiplayerManager {
  static peer = null;
  static connections = {};
  static roomId = null;
  static isHost = false;
  static playerId = null;
  static connected = false;

  static init() {
    MultiplayerManager.playerId = 'p' + Math.random().toString(36).substring(2, 8);
    MultiplayerManager.render();
  }

  static render() {
    const container = document.getElementById('multiplayer-content');
    container.innerHTML =
      '<div class="mp-panel"><h3>🌐 P2Pマルチプレイ (PeerJS)</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;">ルームIDを共有してクロスデバイスでプレイできます。サーバーレス直接通信（PeerJS）を使用します。</p>' +
      '<div style="margin-bottom:8px;"><label style="font-size:12px;color:var(--text-secondary);">ルームID: </label>' +
      '<input type="text" class="mp-input" id="mp-room-id" placeholder="ルームIDを入力"></div>' +
      '<button class="mp-btn" onclick="MultiplayerManager.hostRoom()">ルーム作成 (ホスト)</button>' +
      '<button class="mp-btn" onclick="MultiplayerManager.joinRoom()">ルームに参加</button>' +
      '<button class="mp-btn" onclick="MultiplayerManager.disconnect()" style="background:var(--accent-red);">切断</button>' +
      '<div class="mp-status" id="mp-status">未接続</div>' +
      '<div class="mp-player-list" id="mp-player-list"></div></div>' +
      '<div class="mp-panel"><h3>📡 同期情報</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);">ゲーム時間・速度・国家方針進行・特別研究進捗・カード発動・核攻撃が全プレイヤー間で同期されます。</p>' +
      '<div style="margin-top:8px;font-size:12px;"><div>プレイヤーID: <strong>' + MultiplayerManager.playerId + '</strong></div>' +
      '<div>接続状態: <strong id="mp-conn-state">未接続</strong></div></div></div>';
  }

  static hostRoom() {
    const roomIdInput = document.getElementById('mp-room-id');
    const roomId = roomIdInput.value.trim() || ('hoi4-' + Math.random().toString(36).substring(2, 8));
    MultiplayerManager.roomId = roomId;
    MultiplayerManager.isHost = true;
    MultiplayerManager.setStatus('ルーム作成中...', false);
    MultiplayerManager.peer = new Peer('hoi4game-' + roomId, { debug: 1 });

    MultiplayerManager.peer.on('open', (id) => {
      MultiplayerManager.connected = true;
      MultiplayerManager.setStatus('ホスト開始 (ID: ' + id + ')', true);
      document.getElementById('mp-indicator').textContent = '👥 ホスト';
      GameUI.notify('ルーム作成完了！ID: ' + roomId);
      MultiplayerManager.updatePlayerList();
    });

    MultiplayerManager.peer.on('connection', (conn) => {
      const peerId = conn.peer;
      MultiplayerManager.connections[peerId] = conn;
      conn.on('open', () => {
        MultiplayerManager.setStatus('プレイヤー接続: ' + peerId, true);
        MultiplayerManager.updatePlayerList();
        conn.send({ type: 'sync', state: CoreEngine.getSyncState(), date: CoreEngine.gameState.date.toISOString() });
      });
      conn.on('data', (data) => MultiplayerManager.onData(data, peerId));
      conn.on('close', () => {
        delete MultiplayerManager.connections[peerId];
        MultiplayerManager.setStatus('プレイヤー切断: ' + peerId, false);
        MultiplayerManager.updatePlayerList();
      });
    });

    MultiplayerManager.peer.on('error', (err) => {
      MultiplayerManager.setStatus('エラー: ' + err.type, false);
    });
  }

  static joinRoom() {
    const roomIdInput = document.getElementById('mp-room-id');
    const roomId = roomIdInput.value.trim();
    if (!roomId) { GameUI.notify('ルームIDを入力してください。', 'alert'); return; }
    MultiplayerManager.roomId = roomId;
    MultiplayerManager.isHost = false;
    MultiplayerManager.setStatus('接続中...', false);
    MultiplayerManager.peer = new Peer({ debug: 1 });

    MultiplayerManager.peer.on('open', (myId) => {
      const conn = MultiplayerManager.peer.connect('hoi4game-' + roomId, { reliable: true });
      MultiplayerManager.connections[conn.peer] = conn;
      conn.on('open', () => {
        MultiplayerManager.connected = true;
        MultiplayerManager.setStatus('接続完了 (ルーム: ' + roomId + ')', true);
        document.getElementById('mp-indicator').textContent = '👥 接続中';
        GameUI.notify('ルームに参加しました: ' + roomId);
        MultiplayerManager.updatePlayerList();
      });
      conn.on('data', (data) => MultiplayerManager.onData(data, conn.peer));
      conn.on('close', () => {
        delete MultiplayerManager.connections[conn.peer];
        MultiplayerManager.setStatus('ホストから切断されました', false);
        document.getElementById('mp-indicator').textContent = '👥 単独';
      });
    });

    MultiplayerManager.peer.on('error', (err) => {
      MultiplayerManager.setStatus('エラー: ' + err.type, false);
    });
  }

  static disconnect() {
    Object.values(MultiplayerManager.connections).forEach(conn => conn.close());
    MultiplayerManager.connections = {};
    if (MultiplayerManager.peer) { MultiplayerManager.peer.destroy(); MultiplayerManager.peer = null; }
    MultiplayerManager.connected = false;
    MultiplayerManager.setStatus('切断しました', false);
    document.getElementById('mp-indicator').textContent = '👥 単独';
    MultiplayerManager.updatePlayerList();
  }

  static setStatus(msg, isConnected) {
    const el = document.getElementById('mp-status');
    if (el) el.textContent = msg;
    const stateEl = document.getElementById('mp-conn-state');
    if (stateEl) stateEl.textContent = isConnected ? '接続中' : '未接続';
  }

  static updatePlayerList() {
    const el = document.getElementById('mp-player-list');
    if (!el) return;
    let html = '<div class="mp-player-item">' + MultiplayerManager.playerId + ' (自分' + (MultiplayerManager.isHost ? '・ホスト' : '') + ')</div>';
    Object.keys(MultiplayerManager.connections).forEach(peerId => {
      html += '<div class="mp-player-item">' + peerId + '</div>';
    });
    el.innerHTML = html;
  }

  static broadcast(data) {
    if (!MultiplayerManager.connected) return;
    Object.values(MultiplayerManager.connections).forEach(conn => {
      try { conn.send(data); } catch (e) {}
    });
  }

  static onData(data, fromPeer) {
    if (!data || !data.type) return;
    switch (data.type) {
      case 'sync':
        if (data.state) CoreEngine.applySyncState(data.state);
        if (data.date) CoreEngine.gameState.date = new Date(data.date);
        CoreEngine.updateCalendar();
        CoreEngine.renderStats();
        break;
      case 'tick':
        if (data.state) CoreEngine.applySyncState(data.state);
        if (data.date) CoreEngine.gameState.date = new Date(data.date);
        CoreEngine.updateCalendar();
        break;
      case 'speed':
        CoreEngine.setSpeed(data.speed);
        break;
      case 'focus_select':
        FocusTreeManager.activeFocus = data.focusId;
        FocusTreeManager.render();
        break;
      case 'focus_complete':
        FocusTreeManager.completeFocus(data.focusId);
        break;
      case 'sp_hire':
        if (!SpecialProjectManager.projects[data.sciId]) {
          SpecialProjectManager.projects[data.sciId] = { phase: 'feasibility', progress: 0, factories: 0, completed: false };
          SpecialProjectManager.render();
        }
        break;
      case 'sp_phase':
        if (SpecialProjectManager.projects[data.sciId]) {
          SpecialProjectManager.projects[data.sciId].phase = data.phase;
          SpecialProjectManager.render();
        }
        break;
      case 'nuclear_strike':
        NuclearManager.onNuclearStrike(data);
        break;
      case 'card_activate':
        CoreEngine.log('他プレイヤーがカード「' + data.abilityName + '」を発動しました');
        GameUI.notify('他プレイヤー: ' + data.abilityName + '発動', 'alert');
        break;
      case 'faction_create':
        if (!DiplomacyManager.factions.find(f => f.name === data.faction.name)) {
          DiplomacyManager.factions.push(data.faction);
          DiplomacyManager.render();
        }
        break;
      case 'faction_join':
        var f = DiplomacyManager.factions.find(f => f.name === data.factionName);
        if (f && !f.members.includes(data.countryId)) f.members.push(data.countryId);
        DiplomacyManager.render();
        break;
      case 'lend_lease':
        DiplomacyManager.lendLeaseContracts.push({ from: 'remote', to: data.to, equipment: data.equipment, amount: data.amount });
        DiplomacyManager.render();
        break;
      case 'trade':
        CoreEngine.log('他プレイヤーが貿易を実行しました');
        break;
    }
  }
}

// ==========================================================
// Module 12: CardSystem — 将軍カード・固有能力・インスタント資源カード
// ==========================================================
class CardSystem {
  static allCards = {};
  static deck = [];
  static selectedCard = null;
  static localStorageKey = 'hoi4_card_game_deck';

  static ABILITIES = {
    'hitler': { type: 'passive', name: '国家の象徴', desc: '政治力獲得量+0.5、安定度+10%', modifiers: { politicalPowerGain: 0.5, stabilityBonus: 10 } },
    'stalin': { type: 'passive', name: '鉄の意志', desc: '安定度+15%、戦争協力度+10%', modifiers: { stabilityBonus: 15 } },
    'hermann': { type: 'passive', name: '特別研究の推進者', desc: '特別研究進行速度+30%、施設建設コスト-20%', modifiers: { specialProjectSpeed: 0.3, facilityCostReduction: 0.2 } },
    'rommel': { type: 'active', name: '電撃作戦', desc: '機甲速度+15%、突破+20%（アクティブ）', modifiers: { armorSpeed: 0.15, armorBreakthrough: 0.20 }, activeName: '電撃作戦' },
    'guderian': { type: 'active', name: '電撃戦', desc: '機甲速度+20%、突破+15%（アクティブ）', modifiers: { armorSpeed: 0.20, armorBreakthrough: 0.15 }, activeName: '電撃戦' },
    'mstein': { type: 'active', name: '奇襲作戦', desc: '計画ボーナス+25%（アクティブ）', modifiers: {}, activeName: '奇襲作戦' },
    'rundstedt': { type: 'passive', name: '老練の指揮', desc: '全師団防御+10%', modifiers: {} },
    'tukhachevsky': { type: 'active', name: '一歩も引くな', desc: '歩兵防御+25%（アクティブ）', modifiers: { infantryDefense: 0.25 }, activeName: '一歩も引くな' },
    'yamamoto': { type: 'active', name: 'Z作戦', desc: '海軍攻撃力+20%（アクティブ）', modifiers: {}, activeName: 'Z作戦' },
    'yamashita': { type: 'active', name: 'マレー電撃戦', desc: '機甲速度+15%（アクティブ）', modifiers: { armorSpeed: 0.15 }, activeName: 'マレー電撃戦' },
    'oil': { type: 'instant', name: '石油備蓄解放', desc: '燃料全回復＋石油+50', resource: 'oil', amount: 50, refuel: true },
    'rubber': { type: 'instant', name: '合成ゴム緊急生産', desc: 'ゴム+24', resource: 'rubber', amount: 24 },
    'steel': { type: 'instant', name: '戦時金属増産指示', desc: '鉄+30、タングステン+30', resource: 'steel', amount: 30, extraResource: 'tungsten', extraAmount: 30 },
    'tungsten': { type: 'instant', name: 'タングステン備蓄', desc: 'タングステン+30', resource: 'tungsten', amount: 30 },
    'chromium': { type: 'instant', name: 'クロム備蓄', desc: 'クロム+30', resource: 'chromium', amount: 30 },
    'aluminum': { type: 'instant', name: 'アルミニウム備蓄', desc: 'アルミニウム+30', resource: 'aluminum', amount: 30 },
    'coal': { type: 'instant', name: '石炭備蓄', desc: '石炭+30', resource: 'coal', amount: 30 }
  };

  static DEFAULT_GENERAL_ABILITY = { type: 'passive', name: '指揮能力', desc: '全師団攻撃力+5%', modifiers: {} };

  static async init() {
    CardSystem.allCards = await DataFetcher.fetchAllCards();
    CardSystem.loadDeck();
    CardSystem.render();
  }

  static loadDeck() {
    try {
      const saved = localStorage.getItem(CardSystem.localStorageKey);
      if (saved) CardSystem.deck = JSON.parse(saved);
    } catch (e) { CardSystem.deck = []; }
  }

  static saveDeck() {
    localStorage.setItem(CardSystem.localStorageKey, JSON.stringify(CardSystem.deck));
  }

  static getAbility(card) {
    if (!card) return null;
    return CardSystem.ABILITIES[card.id] || CardSystem.DEFAULT_GENERAL_ABILITY;
  }

  static render() {
    const container = document.getElementById('cards-content');
    let html = '<div class="card-deck-area"><h3>🃏 将軍・指導者カードデッキ</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">カードをクリックしてデッキに編成します。編成したカードの固有能力がゲームに適用されます。</p>';

    html += '<div style="background:var(--bg-panel);border:1px solid var(--text-gold);border-radius:8px;padding:10px;margin-bottom:12px;">' +
      '<strong style="color:var(--text-gold);">デッキ (' + CardSystem.deck.length + '枚)</strong>';
    if (CardSystem.deck.length > 0) {
      html += '<div class="card-grid" style="margin-top:8px;">';
      CardSystem.deck.forEach(card => {
        const ability = CardSystem.getAbility(card);
        html += CardSystem.renderCardHTML(card, true, ability);
      });
      html += '</div>';
    } else {
      html += '<p style="font-size:12px;color:var(--text-secondary);margin-top:4px;">デッキが空です。下のカードから選択してください。</p>';
    }
    html += '</div>';

    Object.entries(CardSystem.allCards).forEach(entry => {
      const country = entry[0], cards = entry[1];
      if (cards.length === 0) return;
      html += '<div style="margin-bottom:16px;"><h4 style="color:var(--text-secondary);margin-bottom:6px;">' + DataFetcher.getCountryFlag(country) + ' ' + country + ' パック</h4><div class="card-grid">';
      cards.forEach(card => {
        const inDeck = CardSystem.deck.find(c => c.id === card.id && c.country === card.country);
        const ability = CardSystem.getAbility(card);
        html += CardSystem.renderCardHTML(card, !!inDeck, ability);
      });
      html += '</div></div>';
    });
    html += '</div>';

    if (CardSystem.selectedCard) {
      const card = CardSystem.selectedCard;
      const ability = CardSystem.getAbility(card);
      html += '<div class="card-ability-panel"><h4>' + card.name + ' — ' + ability.name + '</h4>' +
        '<p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">' + ability.desc + '</p>';
      if (ability.type === 'active' && ability.activeName) {
        const onCooldown = CoreEngine.gameState.activeAbilities[card.id];
        html += '<button class="ability-btn" onclick="CardSystem.activateAbility(\'' + card.id + '\')" ' + (onCooldown ? 'disabled' : '') + '>' +
          (onCooldown ? 'クールダウン中' : 'アクティブ発動: ' + ability.activeName) + '</button>';
      } else if (ability.type === 'instant') {
        html += '<button class="instant-card-btn" onclick="CardSystem.activateAbility(\'' + card.id + '\')">使用: ' + ability.name + '</button>';
      } else {
        html += '<p style="font-size:12px;color:var(--accent-green);">パッシブ能力（自動適用中）</p>';
      }
      html += '</div>';
    }

    container.innerHTML = html;
  }

  static renderCardHTML(card, inDeck, ability) {
    const rankClass = 'gc-rank-' + (card.rank || 'R');
    const imgHtml = card.imgUrl
      ? '<img src="' + card.imgUrl + '" onerror="this.style.display=\'none\'" alt="' + card.name + '">'
      : '<div style="width:100%;height:120px;background:var(--bg-panel);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:40px;">' + DataFetcher.getCountryFlag(card.country) + '</div>';
    const abilityBadge = ability && ability.type === 'active' ? '⚡' : ability && ability.type === 'instant' ? '📦' : '🛡️';
    return '<div class="game-card ' + (inDeck ? 'selected' : '') + '" onclick="CardSystem.selectCard(\'' + card.id + '\',\'' + card.country + '\')">' +
      imgHtml + '<div class="gc-name">' + card.name + '</div>' +
      '<div class="gc-rank ' + rankClass + '">' + abilityBadge + ' ' + (card.rank || 'R') + '</div></div>';
  }

  static selectCard(cardId, country) {
    const cards = CardSystem.allCards[country] || [];
    const card = cards.find(c => c.id === cardId);
    if (!card) return;
    const deckIdx = CardSystem.deck.findIndex(c => c.id === cardId && c.country === country);
    if (deckIdx >= 0) {
      CardSystem.deck.splice(deckIdx, 1);
      CardSystem.removeModifiers(cardId);
    } else {
      if (CardSystem.deck.length >= 5) { GameUI.notify('デッキは最大5枚までです。', 'alert'); return; }
      CardSystem.deck.push({ ...card });
      CardSystem.applyModifiers(cardId);
    }
    CardSystem.saveDeck();
    CardSystem.selectedCard = card;
    CardSystem.render();
    MultiplayerManager.broadcast({ type: 'card_select', cardId: cardId, country: country });
  }

  static applyModifiers(cardId) {
    const ability = CardSystem.ABILITIES[cardId] || CardSystem.DEFAULT_GENERAL_ABILITY;
    if (!ability.modifiers) return;
    const mods = CoreEngine.gameState.cardModifiers;
    Object.entries(ability.modifiers).forEach(entry => {
      mods[entry[0]] = (mods[entry[0]] || 0) + entry[1];
    });
    if (ability.modifiers.stabilityBonus) {
      CoreEngine.gameState.stability = Math.min(100, CoreEngine.gameState.stability + ability.modifiers.stabilityBonus);
    }
    CoreEngine.renderStats();
  }

  static removeModifiers(cardId) {
    const ability = CardSystem.ABILITIES[cardId] || CardSystem.DEFAULT_GENERAL_ABILITY;
    if (!ability.modifiers) return;
    const mods = CoreEngine.gameState.cardModifiers;
    Object.entries(ability.modifiers).forEach(entry => {
      mods[entry[0]] = (mods[entry[0]] || 0) - entry[1];
    });
    if (ability.modifiers.stabilityBonus) {
      CoreEngine.gameState.stability = Math.max(0, CoreEngine.gameState.stability - ability.modifiers.stabilityBonus);
    }
    CoreEngine.renderStats();
  }

  static activateAbility(cardId) {
    const ability = CardSystem.ABILITIES[cardId];
    if (!ability) return;
    if (ability.type === 'instant') {
      const s = CoreEngine.gameState;
      if (ability.resource) s.resources[ability.resource] = (s.resources[ability.resource] || 0) + (ability.amount || 0);
      if (ability.extraResource) s.resources[ability.extraResource] = (s.resources[ability.extraResource] || 0) + (ability.extraAmount || 0);
      if (ability.refuel) s.fuel = s.maxFuel;
      CoreEngine.log('カード使用: ' + ability.name);
      GameUI.notify(ability.name + '発動！', 'success');
      CoreEngine.renderStats();
      if (GameUI.currentTab === 'trade') ResourceManager.render();
    } else if (ability.type === 'active') {
      const mods = CoreEngine.gameState.cardModifiers;
      Object.entries(ability.modifiers || {}).forEach(entry => {
        mods[entry[0]] = (mods[entry[0]] || 0) + entry[1];
      });
      CoreEngine.gameState.activeAbilities[cardId] = true;
      CoreEngine.log('アクティブ能力発動: ' + (ability.activeName || ability.name));
      GameUI.notify((ability.activeName || ability.name) + '発動！', 'success');
      CoreEngine.renderStats();
      if (GameUI.currentTab === 'division') DivisionDesigner.render();
      setTimeout(() => {
        Object.entries(ability.modifiers || {}).forEach(entry => {
          mods[entry[0]] = (mods[entry[0]] || 0) - entry[1];
        });
        delete CoreEngine.gameState.activeAbilities[cardId];
        CoreEngine.renderStats();
        if (GameUI.currentTab === 'cards') CardSystem.render();
        if (GameUI.currentTab === 'division') DivisionDesigner.render();
      }, 30000);
      MultiplayerManager.broadcast({ type: 'card_activate', cardId: cardId, abilityName: ability.name });
    }
  }
}

// ==========================================================
// Module 13: ResearchManager — 技術ツリー管理
// ==========================================================
class ResearchManager {
  static techData = {};
  static researchedTech = new Set();
  static researching = {};
  static currentCategory = 'infantry';

  static async init(country) {
    ResearchManager.techData = await DataFetcher.fetchAllTech(country);
    ResearchManager.renderTabs();
    ResearchManager.renderSlots();
    ResearchManager.render();
    CoreEngine.registerTickCallback(() => ResearchManager.onTick());
  }

  static renderTabs() {
    const cats = [
      { id: 'infantry', name: '🪖 歩兵' }, { id: 'armor', name: '🚜 装甲' },
      { id: 'artillery', name: '💥 砲兵' }, { id: 'naval', name: '⚓ 海軍' },
      { id: 'air', name: '✈️ 航空' }, { id: 'engineering', name: '🛠️ 工学' },
      { id: 'industry', name: '🏭 産業' }
    ];
    document.getElementById('research-tabs').innerHTML = cats.map(c =>
      '<button class="research-tab ' + (c.id === ResearchManager.currentCategory ? 'active' : '') + '" onclick="ResearchManager.setCategory(\'' + c.id + '\')">' + c.name + '</button>'
    ).join('');
  }

  static renderSlots() {
    const s = CoreEngine.gameState;
    let html = '';
    for (let i = 1; i <= 5; i++) {
      const locked = i > s.researchSlots;
      const research = ResearchManager.researching[i];
      let label = 'スロット' + i + ': ';
      if (locked) label += '🔒';
      else if (research) {
        const tech = ResearchManager.findTech(research.techId);
        label += tech ? tech.title + ' (' + Math.floor(research.progress/research.total*100) + '%)' : '研究中';
      } else label += '空き';
      html += '<div class="research-slot ' + (locked ? 'locked' : '') + ' ' + (research ? 'active' : '') + '">' + label + '</div>';
    }
    document.getElementById('research-slots').innerHTML = html;
  }

  static setCategory(cat) {
    ResearchManager.currentCategory = cat;
    ResearchManager.renderTabs();
    ResearchManager.render();
  }

  static findTech(techId) {
    for (const cat of Object.values(ResearchManager.techData)) {
      const t = cat.find(t => t.id === techId);
      if (t) return t;
    }
    return null;
  }

  static render() {
    const container = document.getElementById('research-nodes');
    const svg = document.getElementById('research-svg-lines');
    const techs = ResearchManager.techData[ResearchManager.currentCategory] || [];
    container.innerHTML = '';
    svg.innerHTML = '';

    if (techs.length === 0) {
      container.innerHTML = '<p style="color:var(--text-secondary);padding:20px;">技術データがありません。</p>';
      return;
    }

    let svgContent = '';
    techs.forEach(t => {
      if (t.prerequisites) {
        t.prerequisites.forEach(preId => {
          const pre = techs.find(t2 => t2.id === preId);
          if (pre) {
            const x1 = pre.x + 55, y1 = pre.y + 30;
            const x2 = t.x + 55, y2 = t.y + 30;
            const isDone = ResearchManager.researchedTech.has(preId);
            svgContent += '<path d="M' + x1 + ',' + y1 + ' C' + x1 + ',' + ((y1+y2)/2) + ' ' + x2 + ',' + ((y1+y2)/2) + ' ' + x2 + ',' + y2 + '" stroke="' + (isDone ? '#4ac46a' : '#3a4a5a') + '" stroke-width="2" fill="none" opacity="0.4"/>';
          }
        });
      }
    });
    svg.innerHTML = svgContent;
    svg.setAttribute('width', '800');
    svg.setAttribute('height', '1600');

    techs.forEach(t => {
      const isResearched = ResearchManager.researchedTech.has(t.id);
      const isResearching = Object.values(ResearchManager.researching).some(r => r.techId === t.id);
      let cls = 'tech-node';
      if (isResearched) cls += ' researched';
      else if (isResearching) cls += ' researching';
      const node = document.createElement('div');
      node.className = cls;
      node.style.left = t.x + 'px';
      node.style.top = t.y + 'px';
      node.innerHTML = '<div class="tn-svg">' + (t.svg || '') + '</div><div class="tn-title">' + t.title + '</div><div class="tn-year">' + (t.year || '') + '</div>';
      node.addEventListener('click', () => ResearchManager.selectTech(t));
      container.appendChild(node);
    });
  }

  static selectTech(tech) {
    if (ResearchManager.researchedTech.has(tech.id)) { GameUI.notify('既に研究済みです。'); return; }
    if (tech.prerequisites && !tech.prerequisites.every(p => ResearchManager.researchedTech.has(p))) {
      GameUI.notify('前提技術が不足しています。', 'alert'); return;
    }
    const s = CoreEngine.gameState;
    for (let i = 1; i <= s.researchSlots; i++) {
      if (!ResearchManager.researching[i]) {
        ResearchManager.researching[i] = { techId: tech.id, progress: 0, total: tech.research_time || 100 };
        CoreEngine.log('研究開始: ' + tech.title);
        GameUI.notify('研究開始: ' + tech.title, 'success');
        ResearchManager.renderSlots();
        ResearchManager.render();
        return;
      }
    }
    GameUI.notify('研究スロットが満杯です。', 'alert');
  }

  static onTick() {
    let changed = false;
    Object.entries(ResearchManager.researching).forEach(entry => {
      const slot = entry[0], research = entry[1];
      research.progress++;
      if (research.progress >= research.total) {
        ResearchManager.researchedTech.add(research.techId);
        delete ResearchManager.researching[slot];
        const tech = ResearchManager.findTech(research.techId);
        if (tech) {
          CoreEngine.log('研究完了: ' + tech.title);
          GameUI.notify('研究完了: ' + tech.title, 'success');
          if (tech.id && tech.id.includes('nuclear')) {
            CoreEngine.gameState.nuclearTechLevel = Math.max(1, CoreEngine.gameState.nuclearTechLevel);
          }
        }
        changed = true;
      }
    });
    if (changed || GameUI.currentTab === 'research') {
      ResearchManager.renderSlots();
      ResearchManager.render();
    }
  }
}

// ==========================================================
// Module 14: GameUI — UI管理・タブ切り替え・モーダル・通知
// ==========================================================
class GameUI {
  static currentTab = 'focus';

  static switchTab(tabName) {
    GameUI.currentTab = tabName;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tabName);
    });
    document.querySelectorAll('.tab-content').forEach(content => {
      content.classList.toggle('active', content.id === 'tab-' + tabName);
    });
    if (tabName === 'map') setTimeout(() => MapRenderer.resize(), 100);
    if (tabName === 'special') SpecialProjectManager.render();
    if (tabName === 'nuclear') NuclearManager.render();
    if (tabName === 'trade') ResourceManager.render();
    if (tabName === 'diplomacy') DiplomacyManager.render();
    if (tabName === 'cards') CardSystem.render();
    if (tabName === 'division') DivisionDesigner.render();
    if (tabName === 'multiplayer') MultiplayerManager.render();
    if (tabName === 'research') { ResearchManager.renderTabs(); ResearchManager.renderSlots(); ResearchManager.render(); }
  }

  static notify(message, type) {
    const container = document.getElementById('notification-container');
    const notif = document.createElement('div');
    notif.className = 'notification ' + (type === 'alert' ? 'alert' : type === 'success' ? 'success' : '');
    notif.textContent = message;
    container.appendChild(notif);
    setTimeout(() => {
      notif.style.opacity = '0';
      notif.style.transition = 'opacity 0.3s';
      setTimeout(() => notif.remove(), 300);
    }, 4000);
  }

  static openModal(title, bodyHtml) {
    document.getElementById('generic-modal-title').textContent = title;
    document.getElementById('generic-modal-body').innerHTML = bodyHtml;
    document.getElementById('generic-modal-overlay').classList.remove('hidden');
  }

  static closeModal() {
    document.getElementById('generic-modal-overlay').classList.add('hidden');
  }
}

// ==========================================================
// INITIALIZATION — ゲーム起動
// ==========================================================
async function initGame() {
  CoreEngine.init();
  CoreEngine.updateCalendar();
  await FocusTreeManager.init(CoreEngine.gameState.country);
  await ResearchManager.init(CoreEngine.gameState.country);
  await SpecialProjectManager.init();
  await NuclearManager.init();
  MapRenderer.init();
  ResourceManager.init();
  DiplomacyManager.init();
  await CardSystem.init();
  CheatConsole.init();
  MultiplayerManager.init();
  CardSystem.deck.forEach(card => CardSystem.applyModifiers(card.id));
  CoreEngine.log('ゲームを開始しました。速度ボタンで時間を進めてください。');
  GameUI.notify('Hearts of Iron IV × 将軍カードゲーム 開始！', 'success');
}

window.addEventListener('DOMContentLoaded', initGame);
</script>
