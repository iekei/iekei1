<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>HOI4 Style Focus Tree System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- トップバー (ステータス & 日時・速度操作) -->
  <header id="top-bar">
    <div class="stats-group">
      <div class="stat-item">安定度: <span id="val-stability">85 / 100</span></div>
      <div class="stat-item">戦争協力度: <span id="val-war-support">60 / 100</span></div>
      <div class="stat-item">攻撃性: <span id="val-aggression">42 / 100</span></div>
      <div class="stat-item">政治力: <span id="val-pp">120 / 100</span></div>
    </div>

    <!-- カレンダー & 時間速度変更コントローラー -->
    <div class="time-control-group">
      <div id="calendar-display">1936年1月1日</div>
      <div class="speed-buttons">
        <button id="btn-pause" class="speed-btn active">⏸️</button>
        <button class="speed-btn" data-speed="1">1速</button>
        <button class="speed-btn" data-speed="2">2速</button>
        <button class="speed-btn" data-speed="3">3速</button>
        <button class="speed-btn" data-speed="4">4速</button>
        <button class="speed-btn" data-speed="5">5速</button>
      </div>
    </div>
  </header>

  <!-- ログエリア -->
  <div id="log-banner">
    <span id="typewriter-text">1936年1月1日 - 世界情勢の監視を開始...</span>
  </div>

  <!-- 国家方針ツリー表示領域 (ドラッグ＆ズーム可能) -->
  <main id="tree-container">
    <div id="tree-viewport">
      <svg id="svg-lines"></svg>
      <div id="focus-nodes"></div>
    </div>
  </main>

  <!-- ツールチップ -->
  <div id="nf-tooltip" class="hidden">
    <div id="tooltip-title"></div>
    <div id="tooltip-time"></div>
    <div id="tooltip-effect"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
