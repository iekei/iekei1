    if (!st) {
      html += '<div class="con-state-card"><h4>州未選択</h4><div class="con-state-info">マップ上で自国の州をクリックしてください。</div></div>';
    } else {
      const isOwn = st.owner === player;
      html += '<div class="con-state-card"><h4>' + DataFetcher.getCountryFlag(st.owner || '???') + ' ' + st.name + '</h4>' +
        '<div class="con-state-info">所有国: ' + (st.owner || '無所属') + ' | 分類: ' + (st.category || '-') +
        ' | 人的資源: ' + (st.manpower || 0).toLocaleString() + ' | 補給: ' + (st.supply || 0) + '</div>';
      if (!isOwn) {
        html += '<div class="con-state-info" style="color:var(--accent-red);">⚠️ 自国の州ではありません — 建設できません。</div>';
      } else {
        ConstructionManager.BUILDINGS.forEach(b => {
          const level = (st.b && st.b[b.id]) || 0;
          const maxL = ConstructionManager.maxLevel(b);
          html += '<div class="con-building-row">' +
            '<span class="cb-name">' + b.icon + ' ' + b.name + '</span>' +
            '<span class="cb-level">Lv.' + level + '/' + maxL + '</span>' +
            '<button class="con-build-btn" onclick="ConstructionManager.enqueue(\'' + b.id + '\')" ' +
            (level >= maxL ? 'disabled' : '') + '>建設 (' + b.cost + '日)</button></div>';
        });
      }
      html += '</div>';
    }

    // 建設キュー
    html += '<div class="sp-section"><h3>📋 建設キュー</h3>';
    if (ConstructionManager.queue.length === 0) {
      html += '<p style="color:var(--text-secondary);font-size:12px;">キューは空です。</p>';
    } else {
      const totalAllocated = ConstructionManager.queue.reduce((t, q) => t + q.factories, 0);
      html += '<div class="con-state-info">割り当て済み民需工場: ' + totalAllocated + ' / ' + Math.floor(s.civilianFactories) + '</div>';
      ConstructionManager.queue.forEach((q, idx) => {
        const b = ConstructionManager.BUILDINGS.find(x => x.id === q.building);
        const stq = MapRenderer.states[q.stateId];
        html += '<div class="con-queue-item"><div class="cq-top">' +
          '<span>' + (b ? b.icon : '') + ' ' + (b ? b.name : q.building) + ' — ' + (stq ? stq.name : '州' + q.stateId) + '</span>' +
          '<span style="display:flex;align-items:center;gap:4px;">' +
          '<select class="con-factory-select" onchange="ConstructionManager.setFactories(' + idx + ', this.value)">';
          for (let f = 1; f <= 15; f++) {
            html += '<option value="' + f + '" ' + (q.factories === f ? 'selected' : '') + '>' + f + '工廠</option>';
          }
          html += '</select>' +
          '<button class="con-build-btn" style="background:var(--accent-red)" onclick="ConstructionManager.cancel(' + idx + ')">✕</button></span></div>' +
          '<div class="cq-progress"><div class="cq-progress-fill" style="width:' + (q.progress / q.cost * 100) + '%"></div></div>' +
          '<div style="font-size:10px;color:var(--text-secondary);">' + Math.floor(q.progress) + ' / ' + q.cost + ' 日 (' + Math.ceil((q.cost - q.progress) / q.factories) + '日で完成)</div></div>';
      });
    }
    html += '</div>';

    container.innerHTML = html;
  }

  static enqueue(buildingId) {
    const s = CoreEngine.gameState;
    const sid = ConstructionManager.selectedStateId;
    const st = sid ? MapRenderer.states[sid] : null;
    if (!st) { GameUI.notify('州を選択してください。', 'alert'); return; }
    if (st.owner !== s.country) { GameUI.notify('自国の州のみ建設可能です。', 'alert'); return; }
    const b = ConstructionManager.BUILDINGS.find(x => x.id === buildingId);
    if (!b) return;
    if (!st.b) st.b = {};
    const level = st.b[b.id] || 0;
    if (level >= ConstructionManager.maxLevel(b)) { GameUI.notify('最大レベルに達しています。', 'alert'); return; }
    if (ConstructionManager.queue.length >= 10) { GameUI.notify('建設キューが満杯です。', 'alert'); return; }
    ConstructionManager.queue.push({ stateId: sid, building: buildingId, progress: 0, factories: 1 });
    CoreEngine.log(st.name + 'に' + b.name + 'の建設を開始しました。');
    GameUI.notify('建設キュー追加: ' + b.name);
    ConstructionManager.render();
    MultiplayerManager.broadcast({ type: 'construction_add', state: sid, building: buildingId });
  }

  static setFactories(idx, val) {
    const q = ConstructionManager.queue[idx];
    if (!q) return;
    const others = ConstructionManager.queue.reduce((t, item, i) => i === idx ? t : t + item.factories, 0);
    const avail = Math.max(1, Math.floor(CoreEngine.gameState.civilianFactories) - others);
    q.factories = Math.max(1, Math.min(15, parseInt(val) || 1, avail));
    ConstructionManager.render();
  }

  static cancel(idx) {
    ConstructionManager.queue.splice(idx, 1);
    ConstructionManager.render();
  }

  static onTick() {
    if (!MapRenderer.ready) return;
    let changed = false;
    ConstructionManager.queue.forEach(q => {
      q.progress += q.factories;
      if (q.progress >= q.cost) {
        const st = MapRenderer.states[q.stateId];
        const b = ConstructionManager.BUILDINGS.find(x => x.id === q.building);
        if (st) {
          if (!st.b) st.b = {};
          st.b[q.building] = (st.b[q.building] || 0) + 1;
          // 政治ステータスへの反映
          const s = CoreEngine.gameState;
          if (b && b.gameKey) s[b.gameKey]++;
          if (q.building === 'nuclear_reactor') s.nuclearReactorLevel++;
          if (q.building === 'supply_hub') st.supply = (st.supply || 0) + 4;
          if (q.building === 'infrastructure') st.supply = (st.supply || 0) + 1;
          CoreEngine.log(st.name + 'の' + (b ? b.name : q.building) + 'が完成しました！');
          GameUI.notify('🏗️ 建設完了: ' + st.name + ' ' + (b ? b.name : ''), 'success');
          CoreEngine.renderStats();
          MapRenderer.invalidateModes();
          MultiplayerManager.broadcast({ type: 'construction_done', state: q.stateId, building: q.building });
        }
        q.done = true;
        changed = true;
      }
    });
    ConstructionManager.queue = ConstructionManager.queue.filter(q => !q.done);
    if (changed && WindowManager.isOpen('construction')) ConstructionManager.render();
  }
}

// ==========================================================
// Module 7: ResourceManager — 資源管理・貿易
// ==========================================================
class ResourceManager {
  static TRADE_RESOURCES = [
    { id: 'oil', name: '石油', icon: 'oil' },
    { id: 'steel', name: '鋼鉄', icon: 'steel' },
    { id: 'tungsten', name: 'タングステン', icon: 'tungsten' },
    { id: 'chromium', name: 'クロム', icon: 'chromium' },
    { id: 'aluminum', name: 'アルミニウム', icon: 'aluminum' },
    { id: 'rubber', name: 'ゴム', icon: 'rubber' },
    { id: 'coal', name: '石炭', icon: 'coal' }
  ];

  static init() {
    ResourceManager.render();
    CoreEngine.registerTickCallback(() => ResourceManager.onTick());
  }

  static onTick() {
    if (GameUI.currentTab === 'trade') ResourceManager.render();
  }

  static render() {
    const s = CoreEngine.gameState;
    const container = document.getElementById('trade-content');

    let html = '<div class="sp-section"><h3>📦 資源一覧</h3><div class="resource-grid">';
    ResourceManager.TRADE_RESOURCES.forEach(r => {
      const amount = Math.floor(s.resources[r.id] || 0);
      const imgPath = DataFetcher.RESOURCE_IMAGES[r.icon];
      html += '<div class="resource-card"><img src="' + imgPath + '" onerror="this.style.display=\'none\'" alt="' + r.name + '">' +
        '<div class="rc-info"><div class="rc-name">' + r.name + '</div><div class="rc-amount">保有量: ' + amount + '</div></div></div>';
    });
    html += '</div></div>';

    html += '<div class="sp-section"><h3>🤝 貿易 (資源輸入)</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">民需工廠1つを消費して資源を輸入します。輸送船も消費します。</p>';
    ResourceManager.TRADE_RESOURCES.forEach(r => {
      const amount = Math.floor(s.resources[r.id] || 0);
      html += '<div class="trade-row"><span>' + r.name + ' (保有: ' + amount + ')</span>' +
        '<button class="trade-btn" onclick="ResourceManager.importResource(\'' + r.id + '\',\'' + r.name + '\')" ' +
        (s.civilianFactories < 1 || s.convoys < 5 ? 'disabled' : '') + '>輸入 (工廠1・輸送船5)</button></div>';
    });
    html += '</div>';

    html += '<div class="sp-section"><h3>📤 輸出</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">余剰資源を輸出して民需工廠を獲得できます。</p>';
    ResourceManager.TRADE_RESOURCES.forEach(r => {
      const amount = Math.floor(s.resources[r.id] || 0);
      if (amount > 20) {
        html += '<div class="trade-row"><span>' + r.name + ' (保有: ' + amount + ')</span>' +
          '<button class="trade-btn" onclick="ResourceManager.exportResource(\'' + r.id + '\',\'' + r.name + '\')">輸出 (資源10→工廠0.5)</button></div>';
      }
    });
    html += '</div>';

    container.innerHTML = html;
  }

  static importResource(resId, resName) {
    const s = CoreEngine.gameState;
    if (s.civilianFactories < 1) { GameUI.notify('民需工廠が不足しています。', 'alert'); return; }
    if (s.convoys < 5) { GameUI.notify('輸送船が不足しています。', 'alert'); return; }
    s.civilianFactories -= 1;
    s.convoys -= 5;
    s.resources[resId] = (s.resources[resId] || 0) + 8;
    CoreEngine.log(resName + 'を輸入しました (+8)');
    GameUI.notify(resName + 'を輸入しました', 'success');
    CoreEngine.renderStats();
    ResourceManager.render();
    MultiplayerManager.broadcast({ type: 'trade', action: 'import', res: resId });
  }

  static exportResource(resId, resName) {
    const s = CoreEngine.gameState;
    if ((s.resources[resId] || 0) < 10) { GameUI.notify('資源が不足しています。', 'alert'); return; }
    s.resources[resId] -= 10;
    s.civilianFactories += 0.5;
    CoreEngine.log(resName + 'を輸出しました (+0.5工廠)');
    GameUI.notify(resName + 'を輸出しました', 'success');
    CoreEngine.renderStats();
    ResourceManager.render();
  }
}

// ==========================================================
// Module 7b: PoliticsManager — 政治画面 (指導者・国家精神・法律)
//   左上の国旗クリックで開く。法律は政治力を消費して変更。
// ==========================================================
class PoliticsManager {
  static LAWS = {
    conscription: [
      { id: 'volunteer', name: '志願兵制', cost: 0, mpPerDay: 100, wsReq: 0 },
      { id: 'limited', name: '限定徴兵', cost: 100, mpPerDay: 300, wsReq: 10 },
      { id: 'extensive', name: '大規模徴兵', cost: 150, mpPerDay: 600, wsReq: 25 },
      { id: 'service', name: '兵役必須法', cost: 200, mpPerDay: 1000, wsReq: 50 }
    ],
    economy: [
      { id: 'civilian', name: '民間経済', cost: 0, stabPerDay: 0.01, factoryOutput: 0 },
      { id: 'early', name: '早期動員', cost: 100, stabPerDay: 0, factoryOutput: 0.05 },
      { id: 'partial', name: '部分動員', cost: 150, stabPerDay: -0.005, factoryOutput: 0.10 },
      { id: 'total', name: '総動員', cost: 200, stabPerDay: -0.02, factoryOutput: 0.20 }
    ]
  };

  static init() {
    CoreEngine.registerTickCallback(() => PoliticsManager.onTick());
  }

  static currentLaw(kind) {
    const id = CoreEngine.gameState.laws[kind];
    return (PoliticsManager.LAWS[kind] || []).find(l => l.id === id) || (PoliticsManager.LAWS[kind] || [])[0];
  }

  static dailyManpowerGain() {
    return PoliticsManager.currentLaw('conscription').mpPerDay;
  }

  static onTick() {
    const s = CoreEngine.gameState;
    const eco = PoliticsManager.currentLaw('economy');
    s.stability = Math.max(0, Math.min(100, s.stability + eco.stabPerDay));
  }

  static nextLaw(kind) {
    const list = PoliticsManager.LAWS[kind];
    const cur = PoliticsManager.currentLaw(kind);
    return list[list.indexOf(cur) + 1] || null;
  }

  static enactLaw(kind) {
    const next = PoliticsManager.nextLaw(kind);
    if (!next) { GameUI.notify('既に最高位の法律です。', 'alert'); return; }
    const s = CoreEngine.gameState;
    const ws = PoliticsManager.LAWS[kind].indexOf(next) ? s.warSupport : 100;
    if (kind === 'conscription' && s.warSupport < next.wsReq) {
      GameUI.notify('戦争協力度が不足しています (' + next.wsReq + '% 必要)。', 'alert'); return;
    }
    if (s.politicalPower < next.cost) { GameUI.notify('政治力が不足しています。', 'alert'); return; }
    s.politicalPower -= next.cost;
    s.laws[kind] = next.id;
    CoreEngine.log('法律を「' + next.name + '」に変更しました。');
    GameUI.notify('📜 法律変更: ' + next.name, 'success');
    CoreEngine.renderStats();
    PoliticsManager.render();
    MultiplayerManager.broadcast({ type: 'law_change', kind: kind, law: next.id });
  }

  static render() {
    const container = document.getElementById('politics-content');
    if (!container) return;
    const s = CoreEngine.gameState;
    const nationName = ({ GER: 'ドイツ', SOV: 'ソ連', JAP: '日本', USA: 'アメリカ', ENG: 'イギリス', FRA: 'フランス', ITA: 'イタリア' })[s.country] || s.country;

    let html = '<div class="politics-section"><h3>' + DataFetcher.getCountryFlag(s.country) + ' ' + nationName + ' — 政府</h3>';
    // 指導者 (雇用したカードから)
    const leaders = CardSystem.hiredCards || [];
    if (leaders.length === 0) {
      html += '<p style="font-size:12px;color:var(--text-secondary);">配備済みの指導者がいません。「将軍カード」ウィンドウから雇用してください。</p>';
    } else {
      leaders.forEach(c => {
        const ab = CardSystem.ABILITIES[c.id] || CardSystem.DEFAULT_GENERAL_ABILITY;
        html += '<div class="politics-leader-row"><span style="font-size:18px;">🎖️</span>' +
          '<b>' + (c.name || c.id) + '</b>' +
          '<span style="color:var(--text-gold);">' + (c.rarity || '') + '</span>' +
          '<span style="color:var(--text-secondary);">' + (ab ? ab.name + ' — ' + ab.desc : '') + '</span></div>';
      });
    }
    html += '</div>';

    // 国家精神
    html += '<div class="politics-section"><h3>🌠 国家精神 (National Spirits)</h3>';
    const spirits = [];
    if (s.nationSystems) {
      if (s.nationSystems.mefoIssued) spirits.push({ name: 'MEFO手形 (有効)', desc: '建設コスト -20%・特別研究促進' });
      if (s.nationSystems.paranoia !== undefined) spirits.push({ name: 'スターリンのパラノイア (' + Math.round(s.nationSystems.paranoia) + ')', desc: '高まると将軍カードが粛清されるリスク' });
      if (s.nationSystems.armyInfluence !== undefined) spirits.push({ name: '陸海軍の対立 (陸軍 ' + Math.round(s.nationSystems.armyInfluence) + ')', desc: '陸海軍の影響力バランスが補正に影響' });
      if (s.nationSystems.congressDem !== undefined) spirits.push({ name: '連邦議会 (与党 ' + Math.round(s.nationSystems.congressDem) + '議席)', desc: '議会多数派の安定度ボーナス' });
      if (s.nationSystems.polarization !== undefined) spirits.push({ name: '政治的二極化 (' + Math.round(s.nationSystems.polarization) + ')', desc: '安定度の変動を増幅' });
    }
    if (s.atWar.length > 0) spirits.push({ name: '戦時中 (' + s.atWar.join(', ') + ')', desc: '戦争協力度ボーナス・経済ペナルティ' });
    if (spirits.length === 0) html += '<span class="politics-spirit">精神的安定 — ペナルティ/ボーナスなし</span>';
    else spirits.forEach(sp => {
      html += '<span class="politics-spirit" title="' + sp.desc + '"><b style="color:var(--text-gold);">' + sp.name + '</b><br><span style="color:var(--text-secondary);">' + sp.desc + '</span></span>';
    });
    html += '</div>';

    // 法律
    html += '<div class="politics-section"><h3>📜 法律 (Laws)</h3>';
    [['conscription', '徴兵法律'], ['economy', '経済法律']].forEach(([kind, label]) => {
      const cur = PoliticsManager.currentLaw(kind);
      const next = PoliticsManager.nextLaw(kind);
      const list = PoliticsManager.LAWS[kind];
      const idx = list.indexOf(cur);
      html += '<div class="law-row"><div><span style="color:var(--text-secondary);">' + label + ':</span> <span class="law-current">' + cur.name + '</span>' +
        '<span style="color:var(--text-secondary);font-size:11px;"> (' + list.map((l, i) => (i === idx ? '▶' : '') + l.name).join(' → ') + ')</span></div>';
      if (next) {
        const wsReqNote = kind === 'conscription' && s.warSupport < next.wsReq ? ' (戦争協力度' + next.wsReq + '%必要)' : '';
        html += '<button onclick="PoliticsManager.enactLaw(\'' + kind + '\')">' + next.name + ' へ変更 (PP' + next.cost + ')' + wsReqNote + '</button>';
      } else {
        html += '<span style="color:var(--text-secondary);font-size:11px;">最高位</span>';
      }
      html += '</div>';
    });
    html += '</div>';

    container.innerHTML = html;
  }
}

// ==========================================================
// Module 8: DiplomacyManager — 陣営・レンドリース・外交
// ==========================================================
class DiplomacyManager {
  static countries = [
    { id: 'GER', name: 'ドイツ', relation: 0, faction: null },
    { id: 'SOV', name: 'ソ連', relation: -50, faction: null },
    { id: 'JAP', name: '日本', relation: 20, faction: null },
    { id: 'USA', name: 'アメリカ', relation: -30, faction: null },
    { id: 'ENG', name: 'イギリス', relation: -40, faction: null },
    { id: 'FRA', name: 'フランス', relation: -20, faction: null },
    { id: 'ITA', name: 'イタリア', relation: 30, faction: null },
    { id: 'POL', name: 'ポーランド', relation: -60, faction: null }
  ];

  static factions = [];
  static lendLeaseContracts = [];
  static selectedTag = null;   // 地図右クリック等で選択中の国

  static init() {
    CoreEngine.registerTickCallback(() => DiplomacyManager.onTick());
    DiplomacyManager.render();
  }

  // 他国の領土を右クリックした際に外交画面を開く
  static openFor(tag) {
    DiplomacyManager.selectedTag = tag;
    WindowManager.open('diplomacy');
    GameUI.notify('🤝 ' + (DiplomacyManager.countries.find(c => c.id === tag) || { name: tag }).name + 'との外交画面を開きました');
  }

  static onTick() {
    const s = CoreEngine.gameState;
    // 宣戦布告済みの相手との戦争中: 戦争協力度の自然上昇
    if (s.atWar.length > 0 && s.warSupport < 100) {
      s.warSupport = Math.min(100, s.warSupport + 0.01);
    }
  }

  // ---- 戦争目標の正当化 (バニラルール: 正当化なしに宣戦は不可) ----
  static justifyWarGoal(tag) {
    const s = CoreEngine.gameState;
    if (s.justified[tag] || s.justifying[tag] || s.atWar.includes(tag)) return;
    if (s.politicalPower < 25) { GameUI.notify('政治力が不足しています (PP25必要)。', 'alert'); return; }
    s.politicalPower -= 25;
    s.justifying[tag] = 60;   // 60日で正当化が完了
    const c = DiplomacyManager.countries.find(c => c.id === tag);
    CoreEngine.addWorldTension(10, (c ? c.name : tag) + 'への戦争目標の正当化を開始');
    CoreEngine.log((c ? c.name : tag) + 'への戦争目標の正当化を開始しました (60日)。');
    GameUI.notify('⚔️ ' + (c ? c.name : tag) + 'への戦争目標を正当化中...', 'success');
    DiplomacyManager.render();
    MultiplayerManager.broadcast({ type: 'justify', target: tag });
  }

  // ---- 宣戦布告 (正当化が完了した国にのみ可能) ----
  static declareWar(tag) {
    const s = CoreEngine.gameState;
    if (!s.justified[tag]) { GameUI.notify('先に戦争目標を正当化してください。', 'alert'); return; }
    if (s.atWar.includes(tag)) return;
    s.atWar.push(tag);
    delete s.justified[tag];
    s.warSupport = Math.min(100, s.warSupport + 5);
    const c = DiplomacyManager.countries.find(c => c.id === tag);
    CoreEngine.addWorldTension(15, (c ? c.name : tag) + 'への宣戦布告');
    CoreEngine.log('⚔️ ' + (c ? c.name : tag) + 'に宣戦布告しました！');
    GameUI.notify('⚔️ ' + (c ? c.name : tag) + 'に宣戦布告！', 'alert');
    CoreEngine.renderStats();
    DiplomacyManager.render();
    if (typeof PoliticsManager !== 'undefined') PoliticsManager.render();
    MultiplayerManager.broadcast({ type: 'declare_war', target: tag });
  }

  static render() {
    const container = document.getElementById('diplomacy-content');
    const s = CoreEngine.gameState;
    const myCountry = s.country;

    let html = '<div class="faction-panel"><h3>🏰 陣営 (Faction)</h3>';
    if (DiplomacyManager.factions.length === 0) {
      html += '<p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">陣営がありません。新しい陣営を設立できます。</p>' +
        '<button class="diplo-btn" onclick="DiplomacyManager.createFaction()" style="background:var(--text-gold);color:#000;">陣営を設立 (PP25)</button>';
    } else {
      DiplomacyManager.factions.forEach(f => {
        html += '<div style="margin-bottom:8px;"><strong style="color:var(--text-gold);">' + f.name + '</strong> (盟主: ' + DataFetcher.getCountryFlag(f.leader) + ' ' + f.leader + ')<br><div>';
        f.members.forEach(m => { html += '<span class="faction-member">' + DataFetcher.getCountryFlag(m) + ' ' + m + '</span>'; });
        html += '</div></div>';
      });
    }
    html += '</div>';

    html += '<div class="faction-panel"><h3>📦 レンドリース (Lend-Lease)</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">同盟国に余剰装備を送付できます。</p>';
    if (DiplomacyManager.lendLeaseContracts.length > 0) {
      DiplomacyManager.lendLeaseContracts.forEach(ll => {
        html += '<div class="lend-lease-row"><span>' + DataFetcher.getCountryFlag(ll.from) + ' → ' + DataFetcher.getCountryFlag(ll.to) + '</span><span>' + ll.equipment + ' x' + ll.amount + '</span></div>';
      });
    } else {
      html += '<p style="font-size:12px;color:var(--text-secondary);">レンドリース契約なし</p>';
    }
    html += '</div>';

    html += '<div class="sp-section"><h3>🌍 外交関係 <span style="font-size:11px;color:var(--text-secondary);">— 戦争には必ず「戦争目標の正当化」が必要です</span></h3>';
    DiplomacyManager.countries.forEach(c => {
      if (c.id === myCountry) return;
      const relColor = c.relation > 0 ? 'var(--accent-green)' : c.relation < -30 ? 'var(--accent-red)' : 'var(--text-secondary)';
      const selected = DiplomacyManager.selectedTag === c.id;
      const justified = s.justified[c.id];
      const justifying = s.justifying[c.id];
      const atWar = s.atWar.includes(c.id);
      const borderStyle = selected ? 'border-color:var(--text-gold);background:#223018;' : '';
      html += '<div class="diplo-country-card" style="' + borderStyle + '"><div class="dc-header"><span class="dc-flag">' + DataFetcher.getCountryFlag(c.id) + '</span>' +
        '<div><div class="dc-name">' + c.name + (atWar ? ' <span style="color:var(--accent-red);font-size:11px;">⚔️ 交戦中</span>' : '') + '</div><div class="dc-relation" style="color:' + relColor + ';">関係: ' + (c.relation > 0 ? '+' : '') + c.relation + '</div></div></div>' +
        '<button class="diplo-btn" onclick="DiplomacyManager.improveRelation(\'' + c.id + '\')">関係改善 (PP10)</button>' +
        '<button class="diplo-btn" onclick="DiplomacyManager.inviteToFaction(\'' + c.id + '\')" ' + (c.relation < 30 ? 'disabled' : '') + '>陣営に招待</button>' +
        '<button class="diplo-btn" onclick="DiplomacyManager.lendLease(\'' + c.id + '\')" ' + (c.relation < 0 ? 'disabled' : '') + '>レンドリース</button>';
      if (atWar) {
        html += '<span style="color:var(--accent-red);font-size:12px;font-weight:700;">⚔️ 戦争状態</span>';
      } else if (justified) {
        html += '<button class="diplo-btn" style="background:var(--accent-red);color:#fff;" onclick="DiplomacyManager.declareWar(\'' + c.id + '\')">⚔️ 宣戦布告 (緊張度+15%)</button>';
      } else if (justifying) {
        html += '<span style="color:var(--text-secondary);font-size:11px;">正当化中... 残り' + Math.round(justifying) + '日</span>';
      } else {
        html += '<button class="diplo-btn" onclick="DiplomacyManager.justifyWarGoal(\'' + c.id + '\')">戦争目標の正当化 (PP25・60日・緊張度+10%)</button>';
      }
      html += '</div>';
    });
    html += '</div>';

    container.innerHTML = html;
  }

  static createFaction() {
    const s = CoreEngine.gameState;
    if (s.politicalPower < 25) { GameUI.notify('政治力が不足しています。', 'alert'); return; }
    const name = prompt('陣営名を入力してください:', '枢軸国');
    if (!name) return;
    s.politicalPower -= 25;
    const faction = { name: name, leader: s.country, members: [s.country] };
    DiplomacyManager.factions.push(faction);
    CoreEngine.log('陣営「' + name + '」を設立しました。');
    GameUI.notify('陣営「' + name + '」を設立しました！', 'success');
    CoreEngine.renderStats();
    DiplomacyManager.render();
    MultiplayerManager.broadcast({ type: 'faction_create', faction: faction });
  }

  static improveRelation(countryId) {
    const s = CoreEngine.gameState;
    if (s.politicalPower < 10) { GameUI.notify('政治力が不足しています。', 'alert'); return; }
    s.politicalPower -= 10;
    const c = DiplomacyManager.countries.find(c => c.id === countryId);
    if (c) c.relation = Math.min(100, c.relation + 15);
    CoreEngine.log(c.name + 'との関係を改善しました。');
    GameUI.notify(c.name + 'との関係を改善しました', 'success');
    CoreEngine.renderStats();
    DiplomacyManager.render();
  }

  static inviteToFaction(countryId) {
    const c = DiplomacyManager.countries.find(c => c.id === countryId);
    if (!c || c.relation < 30) { GameUI.notify('関係が不十分です。', 'alert'); return; }
    if (DiplomacyManager.factions.length === 0) { GameUI.notify('先に陣営を設立してください。', 'alert'); return; }
    const faction = DiplomacyManager.factions[0];
    if (!faction.members.includes(countryId)) {
      faction.members.push(countryId);
      c.faction = faction.name;
      CoreEngine.log(c.name + 'が陣営「' + faction.name + '」に加盟しました。');
      GameUI.notify(c.name + 'が陣営に加盟しました！', 'success');
      MultiplayerManager.broadcast({ type: 'faction_join', countryId: countryId, factionName: faction.name });
    }
    DiplomacyManager.render();
  }

  static lendLease(countryId) {
    const c = DiplomacyManager.countries.find(c => c.id === countryId);
    if (!c || c.relation < 0) { GameUI.notify('関係が不十分です。', 'alert'); return; }
    const equipment = prompt('送付する装備 (例: 歩兵装備, 戦車, 航空機):', '歩兵装備');
    if (!equipment) return;
    const amount = parseInt(prompt('数量:', '100'));
    if (!amount || amount <= 0) return;
    DiplomacyManager.lendLeaseContracts.push({ from: CoreEngine.gameState.country, to: countryId, equipment: equipment, amount: amount });
    CoreEngine.log(c.name + 'へレンドリース: ' + equipment + ' x' + amount);
    GameUI.notify(c.name + 'へレンドリース送付', 'success');
    DiplomacyManager.render();
    MultiplayerManager.broadcast({ type: 'lend_lease', to: countryId, equipment: equipment, amount: amount });
  }
}

// ==========================================================
// Module 9: DivisionDesigner — 5×5グリッド編成エディター
// ==========================================================
class DivisionDesigner {
  static grid = Array(5).fill(null).map(() => Array(5).fill(null));
  static selectedBattalion = null;
  static availableBattalions = [
    { id: 'infantry', name: '歩兵', icon: '🪖', attack: 10, defense: 20, org: 60 },
    { id: 'artillery', name: '砲兵', icon: '💥', attack: 25, defense: 5, org: 10 },
    { id: 'armor', name: '戦車', icon: '🚜', attack: 30, defense: 15, org: 40 },
    { id: 'anti_tank', name: '対戦車', icon: '🎯', attack: 15, defense: 8, org: 15 },
    { id: 'anti_air', name: '対空', icon: '🛡️', attack: 8, defense: 10, org: 15 },

  static specialBattalions = [];

  static init() { DivisionDesigner.render(); }

  static unlockSpecialBattalion(sciId) {
    const specialBatts = {
      boris_stechkin: { id: 'jet_fighter', name: 'ジェット戦闘機', icon: '✈️', attack: 40, defense: 20, org: 30 },
      sergey_korolyov: { id: 'v2_rocket', name: 'V2ロケット', icon: '🚀', attack: 50, defense: 0, org: 5 },

      vladimir_kotelnikov: { id: 'land_battleship', name: '陸上戦艦', icon: '🛳️', attack: 45, defense: 40, org: 50 }
    };
    const batt = specialBatts[sciId];
    if (batt && !DivisionDesigner.specialBattalions.find(b => b.id === batt.id)) {
      DivisionDesigner.specialBattalions.push(batt);
      GameUI.notify('特別大隊解除: ' + batt.name + '！', 'success');
    }
  }

  static render() {
    const container = document.getElementById('division-content');
    const allBatts = [...DivisionDesigner.availableBattalions, ...DivisionDesigner.specialBattalions];

    let html = '<div class="sp-section"><h3>⚔️ 師団編成エディター (5×5)</h3>' +
      '<p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;">左の大隊を選択し、グリッドをクリックして配置します。</p>' +
      '<div class="division-grid-container"><div><div class="division-grid" id="division-grid">';

    for (let y = 0; y < 5; y++) {
      for (let x = 0; x < 5; x++) {
        const cell = DivisionDesigner.grid[y][x];
        const cls = cell ? 'division-cell filled' : 'division-cell';
        const icon = cell ? cell.icon : '';
        html += '<div class="' + cls + '" onclick="DivisionDesigner.toggleCell(' + x + ',' + y + ')">' + icon + '</div>';
      }
    }
    html += '</div><button class="sp-btn" onclick="DivisionDesigner.clearGrid()" style="margin-top:8px;">グリッドをクリア</button></div>';

    html += '<div class="division-battalion-list"><h4 style="color:var(--text-gold);margin-bottom:6px;">大隊選択</h4>';
    allBatts.forEach(b => {
      const isSpecial = DivisionDesigner.specialBattalions.find(sb => sb.id === b.id);
      html += '<div class="battalion-option" onclick="DivisionDesigner.selectBattalion(\'' + b.id + '\')">' +
        b.icon + ' ' + b.name + (isSpecial ? ' <span style="color:var(--accent-green);">★</span>' : '') + '</div>';
    });
    html += '</div>';

    const stats = DivisionDesigner.calculateStats();
    html += '<div class="division-stats"><h4 style="color:var(--text-gold);margin-bottom:6px;">師団ステータス</h4>' +
      '<div class="division-stat-row"><span>攻撃力</span><span style="color:var(--accent-red);">' + stats.attack + '</span></div>' +
      '<div class="division-stat-row"><span>防御力</span><span style="color:var(--accent-green);">' + stats.defense + '</span></div>' +
      '<div class="division-stat-row"><span>組織力</span><span style="color:var(--accent-blue);">' + stats.org + '</span></div>' +
      '<div class="division-stat-row"><span>大隊数</span><span>' + stats.count + '</span></div>' +
      '<div class="division-stat-row"><span>機甲速度ボーナス</span><span>' + (CoreEngine.gameState.cardModifiers.armorSpeed > 0 ? '+' : '') + (CoreEngine.gameState.cardModifiers.armorSpeed * 100) + '%</span></div>' +
      '<div class="division-stat-row"><span>歩兵防御ボーナス</span><span>' + (CoreEngine.gameState.cardModifiers.infantryDefense > 0 ? '+' : '') + (CoreEngine.gameState.cardModifiers.infantryDefense * 100) + '%</span></div>' +
      '</div></div></div>';

    container.innerHTML = html;
  }

  static selectBattalion(battId) {
    const allBatts = [...DivisionDesigner.availableBattalions, ...DivisionDesigner.specialBattalions];
    DivisionDesigner.selectedBattalion = allBatts.find(b => b.id === battId) || null;
    GameUI.notify(DivisionDesigner.selectedBattalion ? '選択: ' + DivisionDesigner.selectedBattalion.name : '選択解除');
  }

  static toggleCell(x, y) {
    if (DivisionDesigner.grid[y][x]) {
      DivisionDesigner.grid[y][x] = null;
    } else if (DivisionDesigner.selectedBattalion) {
      DivisionDesigner.grid[y][x] = { ...DivisionDesigner.selectedBattalion };
    }
    DivisionDesigner.render();
  }

  static clearGrid() {
    DivisionDesigner.grid = Array(5).fill(null).map(() => Array(5).fill(null));
    DivisionDesigner.render();
  }

  static calculateStats() {
    let attack = 0, defense = 0, org = 0, count = 0;
    DivisionDesigner.grid.forEach(row => {
      row.forEach(cell => {
        if (cell) {
          let cellAttack = cell.attack;
          let cellDefense = cell.defense;
          if (cell.id === 'armor') cellAttack *= (1 + (CoreEngine.gameState.cardModifiers.armorBreakthrough || 0));
          if (cell.id === 'infantry') cellDefense *= (1 + (CoreEngine.gameState.cardModifiers.infantryDefense || 0));
          attack += cellAttack;
          defense += cellDefense;
          org += cell.org;
          count++;
        }
      });
    });
    if (count > 0) org = Math.floor(org / count);
    return { attack: Math.floor(attack), defense: Math.floor(defense), org: org, count: count };
  }
}

// Module 10: CheatConsole — コンソールチート機能
// ==========================================================
class CheatConsole {
  static history = [];
  static historyIdx = -1;

  static init() {
    document.addEventListener('keydown', (e) => {
      if (e.key === '`' || (e.key === '@' && e.shiftKey) || (e.key === '^' && e.shiftKey) || e.key === '~') {
        if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
          e.preventDefault();
          CheatConsole.toggle();
        }
      }
    });
  }

  static toggle() {
    const el = document.getElementById('cheat-console');
    if (el.classList.contains('hidden')) {
      el.classList.remove('hidden');
      el.classList.remove('collapsed');
      document.getElementById('cheat-console-input').focus();
    } else {
      el.classList.toggle('collapsed');
    }
  }

  static handleInput(e) {
    if (e.key === 'Enter') {
      const cmd = e.target.value.trim();
      if (cmd) {
        CheatConsole.execute(cmd);
        CheatConsole.history.push(cmd);
        CheatConsole.historyIdx = CheatConsole.history.length;
      }
      e.target.value = '';
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (CheatConsole.historyIdx > 0) {
        CheatConsole.historyIdx--;
        e.target.value = CheatConsole.history[CheatConsole.historyIdx] || '';
      }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (CheatConsole.historyIdx < CheatConsole.history.length - 1) {
        CheatConsole.historyIdx++;
        e.target.value = CheatConsole.history[CheatConsole.historyIdx] || '';
      } else {
        CheatConsole.historyIdx = CheatConsole.history.length;
        e.target.value = '';
      }
    }
  }

  static output(msg, isError) {
    const out = document.getElementById('cheat-console-output');
    const line = document.createElement('div');
    line.className = 'cheat-output-line' + (isError ? ' cheat-error' : '');
    line.textContent = '> ' + msg;
    out.appendChild(line);
    out.scrollTop = out.scrollHeight;
  }

  static execute(cmd) {
    const parts = cmd.toLowerCase().split(/\s+/);
    const command = parts[0];
    const s = CoreEngine.gameState;

    switch (command) {
      case 'nuke':
        var nukeCount = parseInt(parts[1]) || 1;
        s.nuclearStockpile += nukeCount;
        CheatConsole.output('核爆弾 +' + nukeCount + ' (現在: ' + Math.floor(s.nuclearStockpile) + ')');
        CoreEngine.renderStats();
        break;
      case 'pp':
        var ppVal = parseInt(parts[1]) || 100;
        s.politicalPower += ppVal;
        CheatConsole.output('政治力 +' + ppVal + ' (現在: ' + Math.floor(s.politicalPower) + ')');
        CoreEngine.renderStats();
        break;
      case 'manpower':
        var mpVal = parseInt(parts[1]) || 1000000;
        s.manpower += mpVal;
        CheatConsole.output('人的資源 +' + mpVal + ' (現在: ' + s.manpower + ')');
        CoreEngine.renderStats();
        break;
      case 'ic':
        s.civilianFactories += 10;
        s.militaryFactories += 10;
        CheatConsole.output('工廠 +10C/+10M (現在: ' + s.civilianFactories + 'C/' + s.militaryFactories + 'M)');
        CoreEngine.renderStats();
        break;
      case 'it':
        CheatConsole.output('全技術研究を即座に完了します（チート）');
        if (ResearchManager.techData) {
          Object.values(ResearchManager.techData).forEach(cat => {
            cat.forEach(t => ResearchManager.researchedTech.add(t.id));
          });
          ResearchManager.render();
        }
        break;
      case 'focus.autocomplete':
        FocusTreeManager.autocomplete = !FocusTreeManager.autocomplete;
        CheatConsole.output('focus.autocomplete = ' + (FocusTreeManager.autocomplete ? 'ON' : 'OFF'));
        FocusTreeManager.render();
        break;
      case 'focus.nochecks':
        FocusTreeManager.noChecks = !FocusTreeManager.noChecks;
        CheatConsole.output('focus.nochecks = ' + (FocusTreeManager.noChecks ? 'ON' : 'OFF'));
        FocusTreeManager.render();
        break;
      case 'allowdiplo':
        CheatConsole.output('allowdiplo = ON (外交制限解除)');
        DiplomacyManager.countries.forEach(c => c.relation = Math.max(c.relation, 50));
        DiplomacyManager.render();
        break;
      case 'annex':
        var annexCountry = parts[1] ? parts[1].toUpperCase() : '';
        if (annexCountry && DiplomacyManager.countries.find(c => c.id === annexCountry)) {
          var statesTaken = MapRenderer.annexCountry(annexCountry);
          CheatConsole.output(annexCountry + 'を併合しました（チート）: ' + statesTaken + '州を獲得');
          GameUI.notify(annexCountry + 'を併合しました (' + statesTaken + '州)', 'alert');
        } else {
          CheatConsole.output('国名コードが無効: ' + annexCountry, true);
        }
        break;
      case 'tag':
        var tagCountry = parts[1] ? parts[1].toUpperCase() : '';
        var knownOwners = new Set(Object.values(MapRenderer.states || {}).map(function(st){ return st.owner; }));
        if (tagCountry && (DataFetcher.getCountryFlag(tagCountry) !== '🏳️' || knownOwners.has(tagCountry))) {
          s.country = tagCountry;
          CheatConsole.output('プレイヤー国を' + tagCountry + 'に変更しました');
          CoreEngine.renderStats();
          if (DataFetcher.FOCUS_PATHS[tagCountry]) FocusTreeManager.init(tagCountry);
          if (MapRenderer.ready) { MapRenderer.centerOn(tagCountry); MapRenderer.invalidateModes(); }
        } else {
          CheatConsole.output('無効な国コード: ' + tagCountry, true);
        }
        break;
      case 'stability':
        s.stability = Math.min(100, Math.max(0, parseInt(parts[1]) || 100));
        CheatConsole.output('安定度を' + s.stability + 'に設定');
        CoreEngine.renderStats();
        break;
      case 'warsupport':
        s.warSupport = Math.min(100, Math.max(0, parseInt(parts[1]) || 100));
        CheatConsole.output('戦争協力度を' + s.warSupport + 'に設定');
        CoreEngine.renderStats();
        break;
      case 'research':
        s.researchSlots = 5;
        CheatConsole.output('研究スロットを5に設定');
        break;
      case 'help':
        CheatConsole.output('利用可能コマンド: nuke [数値], pp [数値], manpower [数値], ic, it, focus.autocomplete, focus.nochecks, allowdiplo, annex [国コード], tag [国コード], stability [数値], warsupport [数値], research');
        break;
      default:
        CheatConsole.output('不明なコマンド: ' + command + ' (helpで一覧表示)', true);
    }
  }
}
