<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ソ連国家方針</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- トップバー (ステータス & 日時・速度操作) -->
  <header id="top-bar">
    <div class="stats-group">
      <div class="stat-item">安定度: <span id="val-stability">85 / 100</span></div>
      <div class="stat-item">戦争協力度: <span id="val-war-support">60 / 100</span></div>
      <div class="stat-item">攻撃性: <span id="val-aggression">42 / 100</span></div>
      
      <!-- 【追加】政治力の左側に配置されたボタン群 -->
      <div class="nav-btn-group">
        <button class="nav-btn" onclick="openGameSubWindow('research')">研究</button>
        <button class="nav-btn" onclick="openGameSubWindow('production')">生産</button>
      </div>

      <div class="stat-item">政治力: <span id="val-pp">120 / 100</span></div>
    </div>

    <!-- カレンダー & 時間速度変更コントローラー -->
    <div class="time-control-group">
      <div id="calendar-display">1936年1月1日</div>
      <div class="speed-buttons">
        <button id="btn-pause" class="speed-btn active">⏸️</button>
        <button class="speed-btn" data-speed="1">1速</button>
        <button class="speed-btn" data-speed="2">2速</button>
        <button class="speed-btn" data-speed="3">3速</button>
        <button class="speed-btn" data-speed="4">4速</button>
        <button class="speed-btn" data-speed="5">5速</button>
      </div>
    </div>
  </header>

  <!-- ログエリア -->
  <div id="log-banner">
    <span id="typewriter-text">1936年1月1日 - 世界情勢の監視を開始...</span>
  </div>

  <!-- 国家方針ツリー表示領域 (ドラッグ＆ズーム可能) -->
  <main id="tree-container">
    <div id="tree-viewport">
      <svg id="svg-lines"></svg>
      <div id="focus-nodes"></div>
    </div>
  </main>

  <!-- ツールチップ -->
  <div id="nf-tooltip" class="hidden">
    <div id="tooltip-title"></div>
    <div id="tooltip-time"></div>
    <div id="tooltip-effect"></div>
  </div>

  <script src="script.js"></script>

  <!-- サブウィンドウ呼び出し関数 -->
  <script>
    function openGameSubWindow(type) {
      let url = '';
      let windowName = '';

      // game/sov/index.html からの相対パス指定
      if (type === 'research') {
        url = 'tec/index.html';
        windowName = 'ResearchWindow';
      } else if (type === 'production') {
        url = 'tec/p/production.html';
        windowName = 'ProductionWindow';
      }

      if (url) {
        const width = 1100;
        const height = 750;
        const left = (window.screen.width - width) / 2;
        const top = (window.screen.height - height) / 2;

        window.open(
          url,
          windowName,
          `width=${width},height=${height},top=${top},left=${left},resizable=yes,scrollbars=yes`
        );
      }
    }
  </script>

  <!-- ▼ ここから追加した簡易デバッグスクリプト ▼ -->
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const targetFocusId = "SOV_finish_the_five_year_plan";
        
        const ymlCount = typeof localizationMap !== 'undefined' ? Object.keys(localizationMap).length : "不明(未定義)";
        const txtCount = typeof scriptedLocMap !== 'undefined' ? Object.keys(scriptedLocMap).length : "不明(未定義)";
        
        let resolvedName = "";
        if (typeof resolveDynamicLoc === 'function') {
          resolvedName = resolveDynamicLoc(targetFocusId);
        } else {
          resolvedName = "resolveDynamicLoc関数が見つかりません";
        }

        const logTarget = document.getElementById("typewriter-text");
        if (logTarget) {
          logTarget.innerHTML = `<b style="color:yellow;">[デバッグ結果]</b> yml:${ymlCount}件 / txt:${txtCount}件 | 変換テスト(${targetFocusId}) ➔ <b>${resolvedName}</b>`;
        }
      }, 1500);
    });
  </script>
</body>
</html>
