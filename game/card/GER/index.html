<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カードパックガチャ - ドイツ</title>
  <link rel="stylesheet" href="style.css">
  <!-- Three.js & GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- UIレイヤー -->
  <div id="ui-layer">
    <div id="top-bar">
      <button id="light-btn">光源: ON</button>
      <button id="zukan-btn">図鑑を見る</button>
    </div>
    
    <div id="instruction">パック上部をスワイプして開封！</div>

    <div id="result-container">
      <div id="result-text"></div>
      <button id="reset-btn">もう一度引く</button>
    </div>
  </div>

  <!-- カットイン演出オーバーレイ -->
  <div id="cutin-overlay">
    <div class="cutin-banner" id="cutin-banner">
      <div class="cutin-img-wrapper">
        <img id="cutin-img" class="cutin-img" src="" alt="CutIn">
      </div>
    </div>
  </div>

  <!-- 図鑑モーダル -->
  <div id="zukan-modal">
    <div class="zukan-content">
      <div class="zukan-header">
        <h2>ドイツ指導者図鑑</h2>
        <button id="zukan-close-btn">&times;</button>
      </div>
      <div id="zukan-grid" class="zukan-grid"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
