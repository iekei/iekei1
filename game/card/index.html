<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カードパック選択</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: #121212;
      background-image: 
        radial-gradient(#222222 15%, transparent 16%),
        radial-gradient(#000000 15%, transparent 16%);
      background-size: 16px 16px;
      background-position: 0 0, 8px 8px;
      color: #fff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 32px;
      letter-spacing: 2px;
      margin-bottom: 40px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .pack-container {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pack-card {
      width: 220px;
      height: 340px;
      background: #f5f5f7;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      box-sizing: border-box;
      text-decoration: none;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .pack-card:hover {
      transform: translateY(-10px) scale(1.03);
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.9);
    }

    /* ナチパック固有装飾 */
    .pack-ger {
      border: 4px solid #d0d0d5;
    }

    /* ソ連パック固有装飾 */
    .pack-sov {
      background: #8b0000;
      border: 4px solid #ffd700;
    }

    .pack-title {
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
      text-align: center;
    }

    .pack-ger .pack-title { color: #111; }
    .pack-sov .pack-title { color: #ffd700; }

    .pack-icon {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin: auto 0;
    }

    .btn-open {
      width: 100%;
      padding: 10px 0;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      text-align: center;
    }

    .pack-ger .btn-open { background: #111; color: #fff; }
    .pack-sov .btn-open { background: #ffd700; color: #8b0000; }
  </style>
</head>
<body>

  <h1>カードパックを選択</h1>

  <div class="pack-container">
    <a href="./GER/index.html" class="pack-card pack-ger">
      <div class="pack-title">ナチスドイツ<br>パック</div>
      <img src="./GER/data/image/icon/nazi.png" alt="GER Icon" class="pack-icon" onerror="this.style.display='none'">
      <div class="btn-open">開封する</div>
    </a>

    <a href="./JAP/index.html" class="pack-card pack-ger">
      <div class="pack-title">大日本帝国<br>パック</div>
      <img src="./JAP/data/image/icon/nazi.png" alt="JAP Icon" class="pack-icon" onerror="this.style.display='none'">
      <div class="btn-open">開封する</div>
    </a>

    <a href="./SOV/index.html" class="pack-card pack-sov">
      <div class="pack-title">ソビエト連邦<br>パック</div>
      <img src="./SOV/data/image/icon/soviet.png" alt="SOV Icon" class="pack-icon" onerror="this.style.display='none'">
      <div class="btn-open">開封する</div>
    </a>
  </div>

</body>
</html>
