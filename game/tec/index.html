<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOI4 研究ツリー (Research Tree)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 上部カテゴリー切り替えタブ -->
  <header id="research-header">
    <div class="category-tabs">
      <button class="tab-btn active" data-cat="infantry">
        <span class="tab-icon">🪖</span>歩兵・支援
      </button>
      <button class="tab-btn" data-cat="armor">
        <span class="tab-icon">🚜</span>装甲車輌
      </button>
      <button class="tab-btn" data-cat="artillery">
        <span class="tab-icon">💥</span>砲兵
      </button>
      <button class="tab-btn" data-cat="naval">
        <span class="tab-icon">⚓</span>海軍
      </button>
      <button class="tab-btn" data-cat="air">
        <span class="tab-icon">✈️</span>航空機
      </button>
      <button class="tab-btn" data-cat="engineering">
        <span class="tab-icon">🛠️</span>工学・原子核
      </button>
      <button class="tab-btn" data-cat="industry">
        <span class="tab-icon">🏭</span>産業
      </button>
    </div>
  </header>

  <!-- メインビューポート（ホイールで縦スクロール、ドラッグで横移動） -->
  <main id="tree-container">
    
    <!-- 左側に固定される「年数タイムライン」 -->
    <div id="year-sidebar">
      <div class="year-label" style="top: 50px;">1936</div>
      <div class="year-label" style="top: 200px;">1938</div>
      <div class="year-label" style="top: 320px;">1939</div>
      <div class="year-label" style="top: 440px;">1940</div>
      <div class="year-label" style="top: 560px;">1941</div>
      <div class="year-label" style="top: 680px;">1942</div>
      <div class="year-label" style="top: 800px;">1943</div>
      <div class="year-label" style="top: 920px;">1944</div>
    </div>

    <!-- ツリー本体（可動エリア） -->
    <div id="tree-viewport">
      <svg id="svg-lines"></svg>
      <div id="tech-nodes"></div>
    </div>
  </main>

  <!-- 本家風ツールチップ -->
  <div id="tech-tooltip" class="hidden">
    <div id="tooltip-title">技術名</div>
    <div id="tooltip-year">基準年: 1936</div>
    <hr>
    <div id="tooltip-effects"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
