<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生産管理 (Production Management)</title>
  <link rel="stylesheet" href="production.css">
</head>
<body>

<header id="top-bar">
  <div id="game-clock">
    <span id="calendar-display">1936年1月1日</span>
    <div id="speed-controls" style="margin-top: 5px; display: flex; gap: 4px;">
      <button class="speed-btn" id="btn-pause" data-speed="0">停止</button>
      <button class="speed-btn" data-speed="1">1速</button>
      <button class="speed-btn" data-speed="2">2速</button>
      <button class="speed-btn" data-speed="3">3速</button>
      <button class="speed-btn" data-speed="4">4速</button>
      <button class="speed-btn" data-speed="5">5速</button>
    </div>

    <!-- 資源表示欄 -->
    <div id="resource-summary" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
      <span class="res-badge"><img src="image/石油.png" class="res-icon"> 石油: <span id="res-oil">500</span></span>
      <span class="res-badge"><img src="image/アルミ.png" class="res-icon"> アルミ: <span id="res-aluminum">500</span></span>
      <span class="res-badge"><img src="image/ゴム.png" class="res-icon"> ゴム: <span id="res-ゴム">500</span></span>
      <span class="res-badge"><img src="image/タングステン.png" class="res-icon"> タングステン: <span id="res-タングステン">300</span></span>
      <span class="res-badge"><img src="image/鋼材.png" class="res-icon"> 鋼材: <span id="res-鋼材">1000</span></span>
      <span class="res-badge"><img src="image/クロム.png" class="res-icon"> クロム: <span id="res-クロム">300</span></span>
      <span class="res-badge"><img src="image/石炭.png" class="res-icon"> 石炭: <span id="res-石炭">800</span></span>
    </div>
  </div>

  <!-- 資源輸入タブ -->
  <div id="import-tabs" style="display: flex; gap: 5px; margin-top: 10px; background: #0d1117; padding: 5px;">
    <button class="tab-btn" onclick="openImport('石油')"><img src="image/石油.png" class="res-icon-tab"> 石油</button>
    <button class="tab-btn" onclick="openImport('アルミ')"><img src="image/アルミ.png" class="res-icon-tab"> アルミ</button>
    <button class="tab-btn" onclick="openImport('ゴム')"><img src="image/ゴム.png" class="res-icon-tab"> ゴム</button>
    <button class="tab-btn" onclick="openImport('タングステン')"><img src="image/タングステン.png" class="res-icon-tab"> タングステン</button>
    <button class="tab-btn" onclick="openImport('鋼材')"><img src="image/鋼材.png" class="res-icon-tab"> 鋼材</button>
    <button class="tab-btn" onclick="openImport('クロム')"><img src="image/クロム.png" class="res-icon-tab"> クロム</button>
    <button class="tab-btn" onclick="openImport('石炭')"><img src="image/石炭.png" class="res-icon-tab"> 石炭</button>
  </div>

  <div id="nav-links">
    <a href="../index.html" class="nav-btn">研究ツリーに戻る</a>
  </div>
</header>

<!-- 輸入パネル (初期非表示) -->
<section id="import-panel" class="panel" style="display:none; margin: 10px;">
  <h2 id="import-title">輸入設定: 選択なし</h2>
  <div id="country-list" style="max-height: 200px; overflow-y: auto;"></div>
  <div id="import-slider-area" style="margin-top: 15px; padding: 10px; border: 1px solid #30363d;">
    <input type="range" id="import-slider" min="50" max="500" step="50" style="width: 100%;">
    <p>輸入量: <span id="slider-value">50</span></p>
    <p>消費民需工場: <span id="req-civ">1</span> / 輸送船: <span id="req-convoy">5</span></p>
    <button id="exec-import-btn" class="action-btn">輸入を開始 (3日後に到着)</button>
  </div>
</section>

<main id="production-container">
  <!-- 既存の生産管理エリア -->
  <section id="available-techs" class="panel">...</section>
  <section id="active-production" class="panel">...</section>
</main>

<script src="production.js"></script>
</body>
</html>
