<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1936 WWII World Map</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div class="panel-header">1936 Eastern Front Command</div>
    
    <div class="panel-section">
      <div class="section-title">1. 支配国の選択（プロヴィンス占領）</div>
      <div class="country-selector">
        <button class="country-btn active" id="btn-SOV" onclick="selectCountry('SOV')">
          <span>☭</span> ソ連
        </button>
        <button class="country-btn" id="btn-GER" onclick="selectCountry('GER')">
          <span>卍</span> ドイツ
        </button>
      </div>
      <p class="panel-note">
        ※国家を選択し、マップ上の領土や海域をクリックすると支配国（ソ連:赤 / ドイツ:黒）を変更できます。
      </p>
    </div>

    <div class="panel-section">
      <div class="section-title">2. 師団の追加</div>
      <div class="division-box">
        <div class="division-note">マップをクリックして師団を配置</div>
        <button class="country-btn" onclick="toggleAddDivisionMode()" id="btn-add-div">
          🪖 師団を新規配備
        </button>
      </div>
    </div>

    <div class="panel-section">
      <div class="section-title">マップ凡例</div>
      <ul class="legend-list">
        <li><span class="legend-icon">⛰️</span> 主要山脈 (突破困難)</li>
        <li><span class="legend-icon">🌊</span> 大河川 (渡河ペナルティ)</li>
        <li><span style="color:#e74c3c;">➡</span> 電撃戦突破予測ルート</li>
      </ul>
    </div>
  </div>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="main.js"></script>

</body>
</html>
