services:
  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.base44.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1/ || { echo 'Frontend unavailable'; exit 1; }"]
      interval: 30s
      timeout: 7s
      start_period: 15s
      retries: 3
    restart: on-failure

  api:
    image: node:22-slim
    working_dir: /app/server
    volumes:
      - ./server:/app/server
      - api-data:/app/server/data
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev -- --watch . --ignore data/ --ignore node_modules/"]
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health', {signal: AbortSignal.timeout(5000)}).then(async r => {if (!r.ok || !(await r.json()).ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 7s
      start_period: 45s
      retries: 3
    restart: on-failure

volumes:
  api-data:
